<style>
  :root {

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:14px; }
  .layout { display:flex; flex-direction:column; height:100vh; }

  #search { margin-left:auto; flex:0 0 260px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13px; }
  .below { flex:1 1 auto; display:flex; min-height:0; }

  aside { flex:0 0 264px; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--sidebar); min-height:0; }

  #legend .legend-item { display:inline-flex; align-items:center; gap:5px; cursor:pointer; border:0; background:none; font:inherit; font-size:11.5px; color:var(--muted); padding:2px 6px; border-radius:5px; }
  #legend .legend-item:hover { background:var(--hover); color:var(--ink); }
  #legend .legend-item.active { background:var(--active); color:var(--ink); font-weight:600; }

  #doc a.flash { background:#fff3bf; box-shadow:0 0 0 3px #fff3bf; border-radius:3px; transition:background .3s, box-shadow .3s; }
  #doc table { border-collapse:collapse; font-size:13px; margin:12px 0; }
  #doc th, #doc td { border:1px solid var(--line); padding:6px 10px; text-align:left; }

  #doc code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:85%; background:var(--code); padding:.15em .4em; border-radius:5px; }
  #doc pre { background:var(--code); padding:13px; border-radius:8px; overflow-x:auto; }

<script>
const DATA = {"title": "ai-engineering", "nodes": [{"id": "agents/A2A.md", "title": "Agent2Agent", "type": "Standard", "description": "An protocol designed by Google enabling communication and interoperability between opaque agentic applications.", "tags": [], "resource": "https://a2a-protocol.org", "body": "A2A is a protocol for cross agent communication, a \"REST API for agents\". Though at the time or writing it has failed to gain traction on the open internet, mainly emerging inside enterprise platforms.\n\nThe [\"Agents are not tools\"](https://discuss.google.dev/t/agents-are-not-tools/) Google blog post argues that agents differ from tools in the way that they can handle imprecise, text formulated requests, and be a peer in the problem solving process, whereas tools are better suited for specific, well-defined tasks.\n\nThis [blog post](https://discuss.google.dev/t/a2a-protocol-demystifying-tasks-vs-messages/) compares the A2A protocol's Message and Task [data types](https://a2a-protocol.org/latest/specification/#4-protocol-data-model), which helps understand the problems the protocol was designed to solve.", "color": "#dc2626"}, {"id": "agents/ACP.md", "title": "Agent Client Protocol", "type": "Standard", "description": "ACP standardizes communication between code editors/IDEs and coding agents.", "tags": [], "resource": "https://agentclientprotocol.com/", "body": "Protocol only useful for IDEs.", "color": "#dc2626"}, {"id": "agents/agent.md", "title": "Agent", "type": "Overview", "description": "The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.", "tags": [], "resource": "https://docs.langchain.com/oss/python/langchain/agents", "body": "Agent is not a well-defined term, but in most cases it means an **LLM in a loop\nwith tools**: the model picks the next action, calls a [tool](#node:harness/tools.md),\nobserves the result, and repeats until the task is done. What distinguishes an\nagent from a fixed pipeline is that the *model* \u2014 not hard-coded logic \u2014 directs\nthe control flow; when the flow can be fixed instead, a\n[workflow](#node:harness/workflows.md) is the leaner option. The recurring ingredients\nare the loop, planning (decomposing a goal into steps), tool use,\n[memory](#node:context/memory.md) (carrying context across steps), and often\n[subagents](#node:harness/subagents.md) for delegating focused subtasks. The loop is\ndriven by an [agent harness](#node:harness/harness.md); frameworks like\n[deepagents](#node:agents/deep-agents.md) package these patterns.", "color": "#3b82f6"}, {"id": "agents/antigravity.md", "title": "Antigravity", "type": "Product", "description": "Google's agent-first development platform built on Gemini \u2014 an IDE, desktop app, and CLI sharing one agent harness.", "tags": [], "resource": "https://antigravity.google", "body": "Antigravity is Google's agent-first development platform built on Gemini: an IDE, a\ndesktop app, and a CLI that share a common [agent](#node:agents/agent.md)\n[harness](#node:harness/harness.md), where agents operate across the editor, terminal,\nand browser to build software from a prompt.", "color": "#ea7317"}, {"id": "agents/claude-code.md", "title": "Claude Code", "type": "Product", "description": "Anthropic's coding agent \u2014 Claude in a loop with file, shell, and code tools, available as CLI, IDE extension, and SDK.", "tags": [], "resource": "https://code.claude.com/docs", "body": "Claude Code is Anthropic's coding [agent](#node:agents/agent.md): a terminal-native\n[harness](#node:harness/harness.md) running Claude.\n\nClaude code usage can be traced via LangSmith using this [plugin](https://docs.langchain.com/langsmith/trace-claude-code).", "color": "#ea7317"}, {"id": "agents/codex.md", "title": "Codex", "type": "Product", "description": "OpenAI's coding agent \u2014 an open-source terminal CLI plus cloud environments, powered by OpenAI's coding models.", "tags": [], "resource": "https://openai.com/codex/", "body": "Codex is OpenAI's coding [agent](#node:agents/agent.md): an open-source terminal CLI\nplus cloud environments and IDE integration, powered by OpenAI's frontier coding\nmodels. It runs tasks end-to-end \u2014 features, refactors, migrations \u2014 with agents\nworking in parallel across git worktrees.", "color": "#ea7317"}, {"id": "agents/deep-agents.md", "title": "Deep Agents", "type": "Product", "description": "Opinionated LangChain package for high level agent patterns.", "tags": [], "resource": "https://docs.langchain.com/oss/python/deepagents/overview", "body": "Deep Agents is the LangChain library that packages production [agent](#node:agents/agent.md) patterns \u2014 planning, [subagents](#node:harness/subagents.md), durable [memory](#node:context/memory.md), human-in-the-loop, and [workflows](#node:harness/workflows.md) \u2014 on top of LangGraph, which serves as its [harness](#node:harness/harness.md).", "color": "#ea7317"}, {"id": "agents/devin.md", "title": "Devin", "type": "Product", "description": "Cognition's autonomous AI software engineer \u2014 a cloud agent that executes coding tasks end-to-end in its own sandbox.", "tags": [], "resource": "https://devin.ai", "body": "Devin is Cognition's autonomous AI software engineer: a cloud-based\n[agent](#node:agents/agent.md) that plans and executes coding tasks end-to-end and\nasynchronously in its own isolated sandbox \u2014 closer to a delegated engineer than a\nlocal pair-programmer.", "color": "#ea7317"}, {"id": "agents/opencode.md", "title": "OpenCode", "type": "Product", "description": "Open-source, terminal-native, model-agnostic coding agent \u2014 a vendor-neutral alternative to Claude Code.", "tags": [], "resource": "https://opencode.ai", "body": "OpenCode is an open-source, terminal-native coding [agent](#node:agents/agent.md) (by\nthe SST team) that is model-agnostic \u2014 it connects to many model providers rather\nthan a single vendor, runs locally, and stores its sessions on disk. A\nvendor-neutral counterpart to [Claude Code](#node:agents/claude-code.md). Can be used with Codex or Antigravity subscriptions, but not with Claude.\n\nOpenCode usage can be traced via LangSmith using this [plugin](https://docs.langchain.com/langsmith/trace-with-opencode).", "color": "#ea7317"}, {"id": "agents/peer-agents.md", "title": "Peer Agents", "type": "Technique", "description": "Independently governed agents that own goals and coordinate as peers rather than through a permanent parent.", "tags": [], "resource": "", "body": "Peer agents are autonomous [agents](#node:agents/agent.md) that cooperate without one\npermanently owning the others' goals, lifecycles, or authority. Unlike a\n[parent with subagents](#node:harness/subagents.md), each peer can initiate work,\naccept or reject requests, and continue operating independently.\n\n# Control model\n\n| Relationship | Goal and initiative | Authority |\n|---|---|---|\n| Parent\u2013subagent | The parent delegates part of its goal | The parent controls the task and usually the subagent's lifecycle |\n| Peer\u2013peer | Either agent may initiate collaboration from its own goal | Neither agent can generally override or terminate the other |\n\nThe distinction is task-scoped rather than necessarily permanent. If agent A\ndelegates a bounded task to B, B acts as A's subagent for that task; in another\ninteraction B may delegate to A. They remain peers at the system level when\nneither has standing authority over the other.\n\n# Communication\n\nPeer and subagent implementations often use the same machinery: an agent is\nexposed as a callable endpoint or [tool](#node:harness/tools.md), messages carry task\ncontext, and results arrive synchronously or asynchronously. Peers can also\ncoordinate indirectly through shared files, databases, repositories, queues, or\nblackboards, provided ownership and concurrent updates are controlled.\n\n[Agent2Agent](#node:agents/A2A.md) standardizes remote-agent discovery and the\nexchange of messages, stateful tasks, status updates, and artifacts. It does not\nmake agents peers by itself: peerhood comes from independent goal and authority\nownership, not from the transport or message format.\n\n# Reduction boundary\n\nA central orchestrator can simulate the message trace of any finite peer\nworkflow, but making that orchestrator the agents' parent changes the\narchitecture when the agents are independently governed. For example, buyer\nand supplier agents can negotiate while keeping their budgets, margins,\ncredentials, and approval policies private. Neither can command the other, and\nan agreement requires both authorities to commit. A mediator may route their\nmessages, but it is not their parent.\n\n# Design considerations\n\nPeer coordination introduces distributed-systems concerns beyond ordinary\ndelegation: authenticated identities, task and ancestry IDs, idempotency,\nconcurrency control, distributed termination, and cycle detection when A calls\nB and B calls A. Compromise or failure can propagate through\n[inter-agent communication](#node:security/risks/insecure-inter-agent-communication.md)\nand cause [cascading failures](#node:security/risks/cascading-agent-failures.md).", "color": "#7c3aed"}, {"id": "ai-engineering.md", "title": "AI Engineering", "type": "Overview", "description": "Personal knowledge base for AI engineering concepts.", "tags": [], "resource": "", "body": "# Map\n\n- **Context** \u2014 how the model gets its context: [MCP](#node:context/mcp.md), the\n  [Open Knowledge Format](#node:context/okf.md), [RAG](#node:context/rag.md),\n  [context engineering](#node:context/context-engineering.md), and\n  [memory](#node:context/memory.md).\n- **Tools** \u2014 the [tools](#node:harness/tools.md) primitive, plus\n  [provider-side](#node:harness/provider-tools.md) and [frontend](#node:harness/frontend-tools.md) tools.\n- **Enterprise** \u2014 the control plane: the [LLM Gateway](#node:enterprise/llm-gateway.md)\n  and the [MCP Gateway](#node:enterprise/mcp-gateway.md).\n- **Agents** \u2014 what an agent is ([agent architecture](#node:agents/agent.md)) and the\n  [peer-agent](#node:agents/peer-agents.md) coordination model, plus the\n  concrete ones: [deepagents](#node:agents/deep-agents.md),\n  [Claude Code](#node:agents/claude-code.md), [opencode](#node:agents/opencode.md),\n  [Codex](#node:agents/codex.md), [Devin](#node:agents/devin.md), and\n  [Antigravity](#node:agents/antigravity.md).\n- **Harness** \u2014 the machinery that runs them: the [harness](#node:harness/harness.md),\n  [subagents](#node:harness/subagents.md), and [workflows](#node:harness/workflows.md).\n- **Observability & evaluation** \u2014 tracing and evals with\n  [LangSmith](#node:observability/langsmith.md), [Langfuse](#node:observability/langfuse.md),\n  and [LangSmith Evals](#node:observability/langsmith-evals.md).\n- **Security** \u2014 [risks and mitigations](#node:security/security.md): the OWASP Agentic\n  Top 10 and the guardrails and masking that minimize them.\n\n# Resources\n\nFor discovering new information:\n\n- [Cognition blog](https://cognition.com/blog)\n- [LangChain blog](https://www.langchain.com/blog)\n- [Anthropic Engineering blog](https://www.anthropic.com/engineering)\n- [FastMCP](https://gofastmcp.com)\n- [LangChain's Max Agency podcast](https://www.youtube.com/playlist?list=PLfaIDFEXuae3UwB1QGEjsRAr8BzCQss7s)\n\nNice general resources:\n\n- [The Agentic Operating Model \u2014 LangChain](https://www.langchain.com/resources/the-agentic-operating-model)", "color": "#3b82f6"}, {"id": "context/context-engineering.md", "title": "Context Engineering", "type": "Technique", "description": "Deliberately assembling what goes into the model's context window \u2014 instructions, tools, retrieved data, memory, and history.", "tags": [], "resource": "https://docs.langchain.com/oss/python/deepagents/context-engineering", "body": "Context engineering is the practice of deliberately assembling everything the\nmodel sees for a given step \u2014 system instructions, [tool](#node:harness/tools.md)\ndefinitions, [retrieved](#node:context/rag.md) data, [memory](#node:context/memory.md), and\nconversation history \u2014 and managing the limited context window. It is the broader\nsuccessor discipline to prompt engineering.", "color": "#7c3aed"}, {"id": "context/mcp.md", "title": "Model Context Protocol (MCP)", "type": "Standard", "description": "Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.", "tags": [], "resource": "https://modelcontextprotocol.io", "body": "MCP is a JSON-RPC-based protocol that standardizes the boundary between an LLM\nclient and external capabilities \u2014 mainly **tools**, but it also supports\n**resources** and **prompts**. Its [tools](#node:harness/tools.md) are consumed by\n[agent architectures](#node:agents/agent.md) and, in production, fronted by an\n[MCP gateway](#node:enterprise/mcp-gateway.md) that multiplexes and secures many\nservers.\n\nIt was designed **stateful**: a session opens with an initialization handshake\nthat negotiates protocol version and capabilities once, over a persistent\nconnection the server can also push back on \u2014 sampling, elicitation, progress,\nand resource/tool-list-change notifications. That bidirectional, session-oriented\nmodel fit MCP's local-first origin, where a client launches a local server over\nstdio and the connection is naturally long-lived.\n\nThat same statefulness is its main drawback for remote, at-scale deployments: the\nhandshake and per-session state force sticky sessions and complicate serverless\nand horizontal scaling. A stateless-by-default redesign was requested in\n[SEP-1442](https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1442)\nand accepted as\n[SEP-2575](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2575)\n(merged May 2026), targeting the 2026-07-28 spec revision \u2014 worth tracking as it\nlands.\n\n# Resources\n\n- [MCP specification](https://modelcontextprotocol.io)\n- [FastMCP](https://gofastmcp.com)\n- [SEP-2575: Make MCP Stateless](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2575) (merged; targets the 2026-07-28 spec)", "color": "#dc2626"}, {"id": "context/memory.md", "title": "Memory", "type": "Technique", "description": "How an agent carries state across steps and sessions \u2014 short-term context plus durable long-term stores.", "tags": [], "resource": "https://docs.langchain.com/oss/python/deepagents/memory", "body": "Memory is how an agent retains information beyond a single model call: short-term\nworking memory in the context window, and long-term memory persisted externally\n(often a vector store) and retrieved when relevant. It lets an agent accumulate\nstate across steps and sessions \u2014 and is a target for\n[poisoning](#node:security/risks/memory-context-poisoning.md).", "color": "#7c3aed"}, {"id": "context/okf.md", "title": "Open Knowledge Format (OKF)", "type": "Standard", "description": "Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.", "tags": [], "resource": "https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf", "body": "OKF represents knowledge \u2014 the metadata and curated context around data and\nsystems \u2014 as a directory of markdown files with YAML frontmatter. One concept\nper file; the file path is the concept's identity. No schema registry, no\ncentral authority, no required tooling. This very bundle is an OKF bundle.\n\n# Relationship with skills\n\nOKF is *knowledge* (declarative facts), distinct from an agent **skill**\n(procedural capability) and from [MCP](#node:context/mcp.md) (a transport for tools\nand resources). An agent could consume an OKF bundle as its knowledge base while\na skill provides the procedure to traverse it and MCP exposes the live tools.\n\n# Resources\n\n- [OKF specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)", "color": "#dc2626"}, {"id": "context/openwiki.md", "title": "OpenWiki", "type": "Product", "description": "LangChain's early-stage CLI for generating and maintaining agent-facing Markdown wikis from local knowledge sources.", "tags": [], "resource": "https://github.com/langchain-ai/openwiki", "body": "OpenWiki generates and maintains local Markdown knowledge for agents. Code mode\nwrites repository documentation, while personal mode synthesizes configured\nsources into `~/.openwiki/wiki` for cross-project continuity.\n\n# How it works\n\nConnectors first write deterministic raw snapshots and manifests locally.\nSource-specific agent runs then synthesize those artifacts into wiki pages,\nwhile the raw artifacts remain available for provenance checks. Generated pages\nmay link back to that evidence, but citations are not enforced. Scheduled\ningestion can keep the wiki fresh without placing the full source corpus into\nevery agent context.\n\n# Where it fits\n\nOpenWiki is a product implementation of durable [Memory](#node:context/memory.md) and\nselective [Context Engineering](#node:context/context-engineering.md). Like\n[RAG](#node:context/rag.md), it retrieves external context for a task, but it\npre-synthesizes that context into an agent-oriented wiki rather than retrieving\nraw chunks only at query time.\n\nIts current value is strongest for broad context, trends, commitments, and\ncross-project continuity. For concrete engineering work, generated summaries\nshould remain leads: current source files, Git history, tests, and other primary\nevidence are more authoritative.\n\n# Resources\n\n- [OpenWiki repository](https://github.com/langchain-ai/openwiki)", "color": "#ea7317"}, {"id": "context/rag.md", "title": "RAG", "type": "Technique", "description": "Retrieval-augmented generation \u2014 fetching relevant documents at query time and adding them to the model's context.", "tags": [], "resource": "", "body": "While strictly speaking retrieval-augmented generation doesn't have to be based on vector embeddings and semantic similarity search, in practice that's what is usually implied when people mention RAG. Powerful technique, but doesn't suit all use cases - doesn't work well for structured or semi-structured data or data that changes frequently - embeddings are not directly linked to original text and require re-indexing. Additionally, it requires a lot of maintenance and complex setup - need to normalize text, deal with structured data, chunking, etc.\n\nRAG is one of the techniques used in\n[context engineering](#node:context/context-engineering.md).\n\nSome discussions about RAG highlighting the need for custom approaches and complex data engineering pipelines, as well as retrieval techniques:\n\n- > [retrieval is not a vector store](https://www.reddit.com/r/Rag/s/KDBqvK7pMb)\n\n- > [metadata is everything](https://www.reddit.com/r/Rag/comments/1m890yk/i_made_60k_building_rag_projects_in_3_months/)", "color": "#7c3aed"}, {"id": "development/observability-driven-development.md", "title": "Observability-Driven AI-Assisted Development", "type": "Technique", "description": "A development loop where AI agents use real runtime telemetry as evidence for diagnosis, remediation, and verification.", "tags": [], "resource": "", "body": "Observability-driven AI-assisted development makes runtime evidence part of the\nsoftware-development loop. An [agent](#node:agents/agent.md) retrieves traces, logs,\nmetrics, exceptions, and evaluation results through [tools](#node:harness/tools.md),\ncorrelates them with the code and current task, proposes or implements a bounded\nchange, and verifies the result. Observability is therefore not only for human\ndashboards and alerts; it becomes queryable [context](#node:context/context-engineering.md)\nfor development agents.\n\n# Core loop\n\n1. **Instrument** the application so important operations, failures, costs, and\n   outcomes produce structured telemetry with environment, version, and\n   correlation identifiers.\n2. **Observe** real behavior in production, staging, tests, and evaluations.\n3. **Retrieve** a bounded evidence window through an observability API, CLI, or\n   [MCP](#node:context/mcp.md) server rather than pasting dashboard screenshots or\n   unbounded logs into the agent context.\n4. **Correlate** signals across systems and map representative events to code,\n   configuration, deployments, and existing work items.\n5. **Diagnose** root-cause candidates, separating actionable defects from\n   expected behavior, external failures, instrumentation gaps, and insufficient\n   evidence.\n6. **Change** the smallest coherent unit of code, configuration, tests, or\n   instrumentation that addresses the supported cause.\n7. **Verify** with a reproduction, automated tests, static checks, and a safe\n   re-query of the relevant telemetry when the behavior can be exercised.\n8. **Learn** by retaining the evidence, decision, and result in issues, pull\n   requests, runbooks, evaluations, or durable agent instructions.\n\nThe loop is evidence-driven rather than fully autonomous: telemetry informs the\nagent's reasoning, but review and deployment controls remain independent gates.\n\n# Operating modes\n\n**Reactive investigation** starts from a reported symptom, failed test, alert,\nor trace. The agent narrows the time window, inspects a representative execution,\nreproduces the behavior where possible, and fixes the supported root cause during\nthe active coding or debugging session.\n\n**Proactive retrospection** periodically scans a fixed, non-overlapping runtime\nwindow for repeated exceptions, failed child operations, latency or cost outliers,\nand observability gaps. Findings are clustered by root cause and reconciled with\nthe existing backlog before an agent opens or implements work. A durable\ncheckpoint records the last fully triaged window so recurring sweeps neither skip\nnor silently forget telemetry.\n\n# Complementary evidence\n\nLLM and agent traces expose prompts, model responses, tool calls, trajectories,\nlatency, token use, and cost. Products such as\n[LangSmith](#node:observability/langsmith.md) and\n[Langfuse](#node:observability/langfuse.md) answer what an AI system saw, decided, and\ndid.\n\nApplication observability exposes standard logs, spans, metrics, exceptions,\ndatabase and HTTP activity, and infrastructure health. OpenTelemetry-compatible\nsystems such as [Logfire](https://logfire.pydantic.dev/docs/) answer what the\nsoftware and its environment experienced.\n\nNeither layer replaces the other. A successful top-level agent response can\ncontain a failed tool call, while an application exception may not explain the\nmodel decision that led to it. Correlation should prefer shared trace or request\nidentifiers; when none exists, timestamp, environment, operation, and failure\ntext provide only probabilistic linkage and must be labeled accordingly.\n\n[LangSmith Evals](#node:observability/langsmith-evals.md) and comparable evaluation\nsystems add outcome evidence. A production trace can become a regression example,\nand a verified fix can be tested across a dataset rather than only against the\nsingle observed failure.\n\n# Required capabilities\n\n- Structured, sufficiently detailed instrumentation at both the AI and\n  application layers.\n- Stable environment, release, operation, and correlation attributes.\n- Read-only, queryable observability interfaces available to the coding agent,\n  preferably with schema discovery and deep links to representative evidence.\n- Explicit time bounds, result limits, and progressive queries that summarize\n  before fetching full traces or stack traces.\n- Access to the relevant code, configuration, tests, and work ledger so evidence\n  can be connected to a change rather than merely summarized.\n- Separate permissions for reading telemetry, editing code, creating work items,\n  deploying, and mutating production.\n- Verification gates that distinguish test evidence, pre-deployment telemetry,\n  and post-deployment confirmation.\n\n# Guardrails and failure modes\n\n- **Telemetry is incomplete evidence.** Missing spans or unattributed errors are\n  observability gaps, not proof that a component is healthy or faulty.\n- **Correlation can be false.** Do not claim identity across systems without a\n  shared identifier; record confidence when correlating indirectly.\n- **Noise can create busywork.** Cluster repeated events into root causes and\n  deduplicate against existing issues and pull requests.\n- **Sensitive data can leak.** Redact or minimize prompts, payloads, credentials,\n  and personal data before they reach telemetry or an agent context.\n- **Telemetry is untrusted input.** Logs, exceptions, model payloads, and tool\n  results may contain attacker-controlled instructions. Treat them as diagnostic\n  data and independently verify any suggested action to prevent\n  [agent goal hijack](#node:security/risks/agent-goal-hijack.md).\n- **Unbounded retrieval wastes context and money.** Query narrow windows, aggregate\n  first, and fetch representative details only as needed.\n- **A plausible diagnosis is not verification.** Require a reproduction or other\n  causal evidence, targeted tests, review, and relevant telemetry checks.\n- **Read access must not imply production authority.** Agents may inspect safely;\n  deployment, destructive operations, and checkpoint advancement require explicit\n  policy and completion criteria.\n\n# Implementation pattern\n\nOne practical implementation pairs an LLM-specific tracer such as LangSmith with\nan OpenTelemetry backend such as Logfire, exposes both through scoped CLI or MCP\ntools, and gives a coding agent project-specific instructions for identifiers,\nenvironments, query constraints, and signal ownership. This is one realization of\nthe technique, not a dependency on those products: the invariant is a controlled\npath from real behavior to retrievable evidence, bounded change, and verified\nlearning.\n\n# Citations\n\n- [OpenTelemetry observability primer](https://opentelemetry.io/docs/concepts/observability-primer/)\n- [LangSmith observability concepts](https://docs.langchain.com/langsmith/observability-concepts)\n- [Logfire MCP server](https://logfire.pydantic.dev/docs/how-to-guides/mcp-server/)\n- [Model Context Protocol](https://modelcontextprotocol.io/)", "color": "#7c3aed"}, {"id": "enterprise/llm-gateway.md", "title": "LLM Gateway", "type": "Technique", "description": "A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.", "tags": [], "resource": "", "body": "An LLM gateway is the control plane between AI clients and the\nmodels they use. It centralizes cross-cutting concerns \u2014 authentication,\nauthorization, rate limiting, routing/failover, content\npolicy, and audit \u2014 so that individual apps and agents stay thin. It is the\nmodel-side counterpart to the [MCP gateway](#node:enterprise/mcp-gateway.md) and a\nnatural enforcement point for [guardrails](#node:security/mitigations/guardrails.md).\n\nExamples:\n\n- LiteLLM", "color": "#7c3aed"}, {"id": "enterprise/mcp-gateway.md", "title": "MCP Gateway", "type": "Technique", "description": "An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.", "tags": [], "resource": "", "body": "An MCP gateway is the control point in front of many [MCP](#node:context/mcp.md) servers \u2014 one authenticated endpoint applying permissions, secret injection, [anonymization](#node:security/mitigations/pii-masking.md), [guardrails](#node:security/mitigations/guardrails.md), and audit. It is the tool-side counterpart to the [LLM gateway](#node:enterprise/llm-gateway.md) and the main control against [agent identity & privilege abuse](#node:security/risks/identity-privilege-abuse.md).", "color": "#7c3aed"}, {"id": "harness/frontend-tools.md", "title": "Frontend Tools", "type": "Technique", "description": "Client-side tools executed in the frontend, typically for UI interactions \u2014 a newer, less standardized category.", "tags": [], "resource": "", "body": "Frontend [tools](#node:harness/tools.md) run on the client's frontend rather than its\nbackend, typically to drive UI interactions (rendering components, reading UI\nstate). It is a much newer and less standardized category than backend tools.\nExamples:\n\n- [Google's A2UI](https://a2ui.org)\n- [LangChain's headless tools](https://docs.langchain.com/oss/python/langchain/frontend/headless-tools)\n- [FastMCP's implementation of MCP apps](https://gofastmcp.com/apps/fastmcp-app)", "color": "#7c3aed"}, {"id": "harness/harness.md", "title": "Agent Harness", "type": "Overview", "description": "The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.", "tags": [], "resource": "", "body": "The harness is the runtime that drives the agent loop around the model: it parses each model response, dispatches the tool calls, feeds results back, manages context and memory, enforces sandboxing and limits (retries, max steps, budgets), and decides when to stop. It is the concrete implementation of an [agent architecture](#node:agents/agent.md) \u2014 the model and the tools plug into it, and it is what runs a [workflow](#node:harness/workflows.md) or a full agent loop. Frameworks like [deepagents](#node:agents/deep-agents.md) ship a ready-made harness.", "color": "#3b82f6"}, {"id": "harness/provider-tools.md", "title": "Provider-Side Tools", "type": "Technique", "description": "Tools defined and executed by the model provider \u2014 built-in web search, code execution \u2014 that clients just enable.", "tags": [], "resource": "", "body": "Provider-side [tools](#node:harness/tools.md) are defined and executed by the model\nprovider rather than the client \u2014 built-in capabilities like web search, code\nexecution, or hosted file search that a client simply enables in its API call. The\nprovider runs them and returns results inline, so the client never sees or hosts the implementation.\n\n# Examples\n\n- **Anthropic (Claude)** \u2014 Anthropic's\n  [server tools](https://platform.claude.com/docs/en/agents-and-tools/tool-use/server-tools)\n  include [web search](https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool),\n  [web fetch](https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-fetch-tool),\n  and [code execution](https://platform.claude.com/docs/en/agents-and-tools/tool-use/code-execution-tool).\n  Anthropic executes these inside the Claude API turn and returns the tool-use\n  and result blocks to the client.\n- **OpenAI (GPT models; analogous capabilities appear in ChatGPT)** \u2014 the\n  Responses API provides [built-in tools](https://developers.openai.com/api/docs/guides/tools)\n  including [web search](https://developers.openai.com/api/docs/guides/tools-web-search),\n  [file search](https://developers.openai.com/api/docs/guides/tools-file-search),\n  [Code Interpreter](https://developers.openai.com/api/docs/guides/tools-code-interpreter),\n  and [image generation](https://developers.openai.com/api/docs/guides/tools-image-generation).\n  ChatGPT product availability and API model support are related but separate.\n- **Google (Gemini)** \u2014 Gemini's\n  [built-in tools](https://ai.google.dev/gemini-api/docs/tools) include\n  [Google Search](https://ai.google.dev/gemini-api/docs/google-search),\n  [URL context](https://ai.google.dev/gemini-api/docs/url-context), and\n  [code execution](https://ai.google.dev/gemini-api/docs/code-execution).\n  Google executes these within the API request; custom function calls and\n  Computer Use instead require the client to execute the requested action.", "color": "#7c3aed"}, {"id": "harness/subagents.md", "title": "Subagents", "type": "Technique", "description": "Delegating focused subtasks to separate agent instances, and orchestrating multiple agents together.", "tags": [], "resource": "https://docs.langchain.com/oss/python/deepagents/subagents", "body": "Subagents are separate agent instances spawned to handle a focused subtask with\ntheir own context, keeping the parent's context clean; multi-agent systems\ncoordinate several such agents, often under a supervisor. Unlike\n[peer agents](#node:agents/peer-agents.md), subagents receive their task and authority\nfrom a parent, even though the underlying invocation machinery may be the same.\nThe pattern adds a new attack surface \u2014 see\n[insecure inter-agent communication](#node:security/risks/insecure-inter-agent-communication.md).", "color": "#7c3aed"}, {"id": "harness/tools.md", "title": "Tools", "type": "Overview", "description": "The primitive that turns an LLM into an agent \u2014 functions the model can call to act on and read from its environment.", "tags": [], "resource": "https://docs.langchain.com/oss/python/deepagents/tools", "body": "Tools are the main thing needed to convert an LLM into a capable agent. Without\nthem, most agent actions would end after one turn; with them, agents can interact\nwith the environment, fetch new context to condition their output on, and perform\ncomplex tasks. They are like control statements in programming languages.\nAdditionally, tools are generic and can be used for almost any use case \u2014 ranging\nfrom direct actions like querying a database to meta operations like\n[workflow](#node:harness/workflows.md) orchestration or recursive\n[subagent](#node:harness/subagents.md) calling. Tools are exposed to models through\nprovider APIs and protocols like [MCP](#node:context/mcp.md).\n\n# Where tools run\n\nTools for LLMs can be generally organized by where they execute:\n\n- **Client-side tools** \u2014 executed by the client.\n  - **Backend tools** \u2014 executed on the client's backend; the majority of tools\n    fall into this category.\n  - **[Frontend tools](#node:harness/frontend-tools.md)** \u2014 executed on the client's\n    frontend, typically for UI interactions; a newer, less standardized category.\n- **[Provider-side tools](#node:harness/provider-tools.md)** \u2014 defined and executed by the\n  model provider (built-in web search, code execution, etc.); clients just enable\n  them in API calls.", "color": "#3b82f6"}, {"id": "harness/workflows.md", "title": "Workflows", "type": "Technique", "description": "Workflows let an agent orchestrate its tool calls programmatically \u2014 scripted tool use for lower token cost and long-running tasks.", "tags": [], "resource": "", "body": "Workflows give an [agent](#node:agents/agent.md) a way to make tool calls in a scripted way, allowing for reduced token usage and orchestration of long running tasks. They become especially powerful with access to a [subagent](#node:harness/subagents.md)-spawning tool. Because they run model-written code inside the [harness](#node:harness/harness.md), they raise [unexpected code execution](#node:security/risks/unexpected-code-execution.md) risk.\n\nExamples of workflow implementations:\n\n- [Claude Workflows](https://code.claude.com/docs/en/workflows)\n- [LangChain Dynamic Subagents](https://docs.langchain.com/oss/python/deepagents/dynamic-subagents)", "color": "#7c3aed"}, {"id": "observability/langfuse.md", "title": "Langfuse", "type": "Product", "description": "Open-source LLM observability and tracing, OpenTelemetry-friendly.", "tags": [], "resource": "https://langfuse.com", "body": "Langfuse is an open-source LLM observability platform \u2014 self-hostable tracing, metrics, and evals, a vendor-neutral alternative to [LangSmith](#node:observability/langsmith.md) on the same OTel backbone.", "color": "#ea7317"}, {"id": "observability/langsmith-evals.md", "title": "LangSmith Evals", "type": "Product", "description": "Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.", "tags": [], "resource": "https://docs.langchain.com/oss/python/langchain/test/evals", "body": "[LangSmith](#node:observability/langsmith.md)'s evaluation tooling runs datasets, LLM-as-judge and custom evaluators, and experiments over traces \u2014 the operational side of evals in this stack.", "color": "#ea7317"}, {"id": "observability/langsmith.md", "title": "LangSmith", "type": "Product", "description": "LangChain's tracing and evaluation platform for LLM/agent observability.", "tags": [], "resource": "https://www.langchain.com/langsmith", "body": "LangSmith is LangChain's managed platform for tracing, monitoring, and [evaluating](#node:observability/langsmith-evals.md) LLM apps and agents \u2014 the observability backend used across this work. [Langfuse](#node:observability/langfuse.md) is the open-source alternative.", "color": "#ea7317"}, {"id": "providers/claude.md", "title": "Claude", "type": "Product", "description": "Anthropic Claude API token pricing and prompt-caching mechanics \u2014 cache multipliers, TTLs, and cost-optimization guidance.", "tags": [], "resource": "https://docs.anthropic.com/en/docs/about-claude/pricing", "body": "Token pricing and prompt-caching behavior for Anthropic's Claude API \u2014 the\nper-model rates, cache multipliers, and TTL rules that drive cost. Read it\nalongside the [OpenAI](#node:providers/gpt.md) and [Gemini](#node:providers/gemini.md)\npricing notes for a cross-provider comparison. Caching is the concrete cost lever\nbehind [context engineering](#node:context/context-engineering.md);\n[provider-side tools](#node:harness/provider-tools.md) are billed on top of these token\nrates; and an [LLM gateway](#node:enterprise/llm-gateway.md) is where per-provider\ncosts get compared, routed, and capped.\n\n*Verified against Anthropic documentation on 2026-07-11. Prices are per 1 million tokens.*\n\n# Representative pricing\n\n| Model | Base input | 5-minute cache write | 1-hour cache write | Cache hit/refresh | Output |\n|---|---:|---:|---:|---:|---:|\n| Claude Fable 5 | $10.00 | $12.50 | $20.00 | $1.00 | $50.00 |\n| Claude Opus 4.8 | $5.00 | $6.25 | $10.00 | $0.50 | $25.00 |\n\nCache multipliers are:\n\n- 5-minute write: **1.25\u00d7** base input\n- 1-hour write: **2\u00d7** base input\n- Cache hit/refresh: **0.1\u00d7** base input\n\nA token is charged as ordinary input, cache creation, or cache read \u2014 not all three.\n\n# How caching works\n\n- Prompt caching must be enabled with `cache_control`; it is not globally automatic for every request.\n- Top-level automatic caching lets Anthropic choose cache boundaries.\n- Explicit `cache_control` markers let you define reusable prefixes.\n- The default TTL is 5 minutes.\n- A successful hit refreshes the 5-minute TTL without another cache-write charge.\n- A 1-hour TTL is available at the higher write rate.\n- Cache matching is prefix-based, so stable system prompts, tools, documents, and conversation history should come before changing content.\n- Usage reports separate ordinary input, cache creation, and cache reads.\n\nWith a 5-minute cache, one later hit is already cheaper than sending the same prefix uncached twice. A 1-hour write generally needs at least two later hits to beat repeated uncached input.\n\n# Context and long-context pricing\n\nCurrent Claude models with a 1M-token context window use the same listed per-token rates throughout that window. Anthropic does not apply a [GPT-style](#node:providers/gpt.md) pricing cliff at a lower threshold for those models.\n\nInput, generated output, and thinking tokens share the context window. Generated output does not retroactively change the current request's input price, but it becomes input if preserved in a later turn. Cached tokens still occupy context.\n\n# Other modifiers\n\n- US-only inference on supported newer models adds **1.1\u00d7**.\n- Batch API processing gives a **50% input/output discount**.\n- For most Claude models, cache-read tokens do not count toward input-token-per-minute limits; cache creation and uncached input do.\n\n# Practical recommendations\n\n- Use a 5-minute cache for interactive sessions.\n- Use a 1-hour cache only when reuse over that period is likely.\n- Keep stable content first and dynamic content last.\n- Inspect `cache_creation_input_tokens` and `cache_read_input_tokens`.\n- Bound any keep-alive loop; Claude's refresh-on-hit behavior makes it predictable, but unnecessary pings still cost money.\n\n# Citations\n\n- Pricing: <https://docs.anthropic.com/en/docs/about-claude/pricing>\n- Prompt caching: <https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching>\n- Context windows: <https://docs.anthropic.com/en/docs/build-with-claude/context-windows>\n- Rate limits: <https://docs.anthropic.com/en/api/rate-limits>", "color": "#ea7317"}, {"id": "providers/gemini.md", "title": "Gemini", "type": "Product", "description": "Google Gemini API token pricing plus implicit and explicit context caching, with break-even guidance.", "tags": [], "resource": "https://ai.google.dev/gemini-api/docs/pricing", "body": "Token pricing and context-caching behavior for Google's Gemini API \u2014 per-model\nrates, the 200K prompt-size tier, and the difference between implicit and explicit\ncaching. Read it alongside the [Claude](#node:providers/claude.md) and\n[OpenAI](#node:providers/gpt.md) pricing notes for a cross-provider comparison. Caching\nis the concrete cost lever behind\n[context engineering](#node:context/context-engineering.md);\n[provider-side tools](#node:harness/provider-tools.md) are billed on top of these token\nrates; and an [LLM gateway](#node:enterprise/llm-gateway.md) is where per-provider\ncosts get compared, routed, and capped.\n\n*Verified against Google documentation on 2026-07-11. Prices are per 1 million tokens unless noted.*\n\n# Representative pricing\n\n## Gemini 3.5 Flash \u2014 Standard\n\n| Token type | Price |\n|---|---:|\n| Input | $1.50 |\n| Cached input | $0.15 |\n| Output, including thinking | $9.00 |\n| Cache storage | $1.00 per 1M tokens per hour |\n\nBatch pricing is $0.75 input and $4.50 output; cached input is $0.075.\n\n## Gemini 3.1 Pro Preview \u2014 Standard\n\n| Prompt size | Input | Cached input | Output, including thinking |\n|---|---:|---:|---:|\n| Up to 200K tokens | $2.00 | $0.20 | $12.00 |\n| Over 200K tokens | $4.00 | $0.40 | $18.00 |\n\nCache storage is $4.50 per 1M tokens per hour.\n\nGoogle lists separate request-wide rates for prompts up to and over 200K tokens; it does not describe the higher tier as marginal pricing applied only to excess tokens. Budget conservatively as a full-request tier \u2014 the same cliff shape [OpenAI has at 272K](#node:providers/gpt.md), just at a lower threshold, and one [Claude's 1M-context models avoid](#node:providers/claude.md).\n\n# Implicit caching\n\nFor Gemini 2.5 and newer models, implicit caching is enabled by default when eligible:\n\n- No cache object or explicit breakpoint is required.\n- A hit is opportunistic, not guaranteed.\n- Minimum eligible prompt size is currently 4,096 tokens for Gemini 3.5 Flash and Gemini 3.1 Pro Preview, and 2,048 for Gemini 2.5 Flash/Pro.\n- The Interactions API currently supports implicit caching only.\n\nPlace stable, repeated material at the beginning of the prompt to improve hit probability.\n\n# Explicit caching\n\nThe `generateContent` API also supports explicit cache objects:\n\n- You create and reference a named cache.\n- Default TTL is 1 hour.\n- TTL can be chosen and updated.\n- Billing includes discounted cached-token reads plus token-hours of storage.\n- There is no [Claude](#node:providers/claude.md)/[OpenAI](#node:providers/gpt.md)-style cache-write multiplier in the published pricing table; storage duration is the main extra cost.\n\nExplicit caching is preferable when reuse is predictable and you need guaranteed cache identity. Implicit caching is simpler but offers no guaranteed savings.\n\n# Context and billing\n\nThe long-context pricing tier is determined by prompt/input size. Output and thinking generated during the request do not retroactively change that tier. If retained in a later conversation turn, they become input and may push that later request over 200K.\n\nUse `countTokens` before expensive requests and inspect cached-token fields in `usageMetadata`.\n\n# Practical recommendations\n\n- Use implicit caching for repeated interactive prompts with stable prefixes.\n- Use explicit caches for large documents reused enough to justify storage.\n- Calculate break-even from cached-read savings versus token-hours of storage.\n- Compact conversations before approaching a model's pricing threshold.\n- Remember that thinking tokens are billed at the output rate.\n\n# Citations\n\n- Pricing: <https://ai.google.dev/gemini-api/docs/pricing>\n- Context caching: <https://ai.google.dev/gemini-api/docs/caching>\n- Interactions API caching: <https://ai.google.dev/gemini-api/docs/interactions>\n- Token counting: <https://ai.google.dev/gemini-api/docs/tokens>", "color": "#ea7317"}, {"id": "providers/gpt.md", "title": "GPT", "type": "Product", "description": "OpenAI GPT API token pricing and prompt caching \u2014 the 272K long-context cliff, cache-write fees, and keep-alive economics.", "tags": [], "resource": "https://developers.openai.com/api/docs/pricing", "body": "Token pricing and prompt-caching behavior for OpenAI's GPT API \u2014 short- and\nlong-context rates, the 272K-token pricing cliff, and cache-write economics. Read\nit alongside the [Claude](#node:providers/claude.md) and [Gemini](#node:providers/gemini.md)\npricing notes for a cross-provider comparison. Caching is the concrete cost lever\nbehind [context engineering](#node:context/context-engineering.md);\n[provider-side tools](#node:harness/provider-tools.md) are billed on top of these token\nrates; and an [LLM gateway](#node:enterprise/llm-gateway.md) is where per-provider\ncosts get compared, routed, and capped.\n\n*Verified against OpenAI documentation on 2026-07-11. Prices below are for GPT-5.6 Sol, Standard processing.*\n\n# Token pricing\n\n## Short context: up to 272,000 input tokens\n\n| Token type | Price / 1M tokens |\n|---|---:|\n| Ordinary uncached input | $5.00 |\n| Cached input read | $0.50 |\n| Cache write | $6.25 |\n| Output, including reasoning tokens | $30.00 |\n\nA token belongs to only one input category: ordinary input, cache read, or cache write. Cache-write tokens are **not** charged both $5 and $6.25.\n\nThe advertised `$5/M input` is the ordinary uncached rate. With automatic caching enabled, an eligible cold prefix **may be written to cache** and those written tokens cost `$6.25/M`. Therefore, a one-off cacheable request can cost more than the headline input rate, but not every input token or request automatically costs $6.25.\n\nApproximate billing:\n\n```text\nordinary_input \u00d7 $5/M\n+ cached_input \u00d7 $0.50/M\n+ cache_write_tokens \u00d7 $6.25/M\n+ output_tokens \u00d7 $30/M\n```\n\nInspect `cached_tokens` and `cache_write_tokens` in API usage data rather than assuming which rate applied.\n\n## Long-context pricing\n\nA request with **more than 272,000 input tokens** uses long-context prices for the **entire request**, not only the excess:\n\n| Token type | Long-context price / 1M |\n|---|---:|\n| Ordinary input | $10.00 |\n| Cached input | $1.00 |\n| Cache write | $12.50 |\n| Output | $45.00 |\n\nThis creates a real pricing cliff at 272,001 input tokens \u2014 a threshold [Claude's 1M-context models do not have](#node:providers/claude.md), and one that [Gemini](#node:providers/gemini.md) sets at a different point (200K).\n\nThe threshold is based on the request's **input tokens**. Output generated during that request does not retroactively trigger long-context pricing. However, if that output is included as conversation history in the next request, it becomes input and can push the next request over 272K.\n\n# How prompt caching works\n\n- Automatic caching still exists. GPT-5.6 defaults to one **implicit** cache breakpoint.\n- Explicit breakpoints can mark stable reusable prefixes.\n- Setting cache mode to `explicit` disables the implicit breakpoint; only provided breakpoints are considered.\n- Use a stable `prompt_cache_key` for requests sharing the same long prefix to improve matching.\n- Cached prefixes remain eligible for reuse for **at least 30 minutes** and may remain longer.\n- Cache reads still count toward token-per-minute limits.\n- Cache writes cost 1.25\u00d7 ordinary input on GPT-5.6-family models; older model families do not have this separate write fee.\n\n# Keep-alive requests\n\nSending a tiny request that reuses a large cached prefix can theoretically be cheaper than allowing the prefix to expire and paying for another cache write:\n\n- Read/write price ratio: `$0.50 / $6.25 = 1/12.5`\n- For a 100K-token prefix: cache read \u2248 `$0.05`; cache write \u2248 `$0.625`\n\nBut OpenAI guarantees only a **minimum 30-minute eligibility period**. Its documentation does not clearly promise that every cache hit resets the guaranteed lifetime. Treat keep-alive as an experiment, not a contractual optimization:\n\n1. Use it only when another real request is likely.\n2. Verify each ping has `cached_tokens > 0` and `cache_write_tokens = 0`.\n3. Stop after a bounded idle period.\n4. Account for rate-limit consumption and small output costs.\n5. Prefer prewarming before a predictable workload over indefinite pings.\n\n# Practical recommendations\n\n- Put stable system instructions, tools, files, or code before dynamic content.\n- Use explicit breakpoints for large prefixes with predictable reuse.\n- Log ordinary, cached, and cache-write tokens separately.\n- Compact or summarize conversations before approaching 272K input tokens.\n- Optimize for **cost per successful task**, not only listed price per token.\n\n# Citations\n\n- Pricing: <https://developers.openai.com/api/docs/pricing>\n- GPT-5.6 Sol model page: <https://developers.openai.com/api/docs/models/gpt-5.6-sol>\n- Prompt caching guide: <https://developers.openai.com/api/docs/guides/prompt-caching>", "color": "#ea7317"}, {"id": "providers/leaderboards.md", "title": "LLM Leaderboards", "type": "Overview", "description": "A curated bookmark set and benchmark map for choosing reliable, independent LLM evaluation sources across capabilities.", "tags": ["leaderboards", "evaluation", "benchmarks", "model-selection"], "resource": "", "body": "A curated set of external LLM leaderboards and benchmarks for picking models, and\na capability-to-benchmark map for verifying results. These are the *public,\ncross-model* evaluation sources \u2014 complementary to the *internal, task-specific*\nevaluation covered by [LangSmith Evals](#node:observability/langsmith-evals.md). Pair\nmodel-quality signals here with the per-provider cost signals in the\n[Claude](#node:providers/claude.md), [GPT](#node:providers/gpt.md), and\n[Gemini](#node:providers/gemini.md) pricing notes when selecting a model.\n\nThere is currently no single LLM leaderboard that is simultaneously:\n\n- comprehensive across capabilities;\n- current across the newest models;\n- independently evaluated;\n- methodologically consistent;\n- broad enough to cover coding agents, tool use, reasoning, knowledge, long context, and real workflows.\n\nThe best approach is to use one broad dashboard for discovery, then verify important results against the benchmark owner's own leaderboard.\n\n# Recommended bookmark set\n\nA compact set that covers most practical needs:\n\n1. [Artificial Analysis](https://artificialanalysis.ai/)\n   Best daily dashboard for quality, price, speed, and independently run evaluations.\n\n2. [BenchLM](https://benchlm.ai/)\n   Best benchmark and model discovery index.\n\n3. [Scale Labs SWE-Bench Pro](https://labs.scale.com/leaderboard/swe_bench_pro_public)\n   Best source for serious repository-level software-engineering evaluation.\n\n4. [Berkeley Function Calling Leaderboard](https://gorilla.cs.berkeley.edu/leaderboard.html)\n   Best source for structured function and tool calling.\n\n5. [LiveBench](https://livebench.ai/)\n   Useful broad and relatively fresh objective evaluation.\n\n6. [Arena](https://arena.ai/leaderboard/text)\n   Useful for human preference and conversational quality.\n\n# Practical benchmark map\n\n| Capability | Primary benchmark or source | Secondary check |\n|---|---|---|\n| Repository software engineering | SWE-Bench Pro | Terminal-Bench |\n| Algorithmic coding | LiveCodeBench | SciCode |\n| Basic function calling | BFCL | Tests against your own API schemas |\n| Multi-step tool workflows | \u03c4\u00b2-bench | EnterpriseOps-Gym / AutomationBench |\n| General knowledge | AA-Omniscience | MMLU-Pro |\n| Difficult reasoning | Humanity's Last Exam | GPQA Diamond |\n| Long-context work | AA Long Context Reasoning | Application-specific retrieval tests |\n| Conversational quality | Arena category scores | Blind manual review |\n| Enterprise task completion | GDPval-AA / AA-Briefcase | Internal workflow evaluation |\n| Cost efficiency | Cost per successful task | Price per token |", "color": "#3b82f6"}, {"id": "security/mitigations/guardrails.md", "title": "Guardrails", "type": "Technique", "description": "Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.", "tags": [], "resource": "", "body": "Guardrails are the deterministic and model-based controls wrapped around an LLM\ncall to keep behavior inside a safe envelope: input filters (jailbreak/\n[injection](#node:security/risks/agent-goal-hijack.md) detection, topic limits), output\nfilters (moderation, PII checks, schema/format validation), and action gates\n(approval required before destructive tool calls). They are policy enforcement,\ndistinct from the model's own alignment. They complement\n[PII masking](#node:security/mitigations/pii-masking.md) on the output path and are\ntypically enforced at the [MCP gateway](#node:enterprise/mcp-gateway.md).", "color": "#7c3aed"}, {"id": "security/mitigations/pii-masking.md", "title": "PII Masking & Anonymization", "type": "Technique", "description": "Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.", "tags": [], "resource": "", "body": "PII masking is the detection and transformation of personal data flowing through\nan AI system \u2014 redaction, pseudonymization, or reversible tokenization \u2014 so that\nsensitive fields never reach a model, a log, or a third party in the clear. It is\nthe privacy counterpart to [guardrails](#node:security/mitigations/guardrails.md) and is\ntypically enforced at the [MCP gateway](#node:enterprise/mcp-gateway.md). In a bank,\nthis is a hard regulatory boundary, not a nice-to-have.", "color": "#7c3aed"}, {"id": "security/risks/agent-goal-hijack.md", "title": "Agent Goal Hijack", "type": "Security risk", "description": "Adversarial input redirects the agent's plan or objective \u2014 OWASP's #1 agentic risk, prompt injection being the primary mechanism.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agent goal hijack is when adversarial input redirects an agent's plan or\nobjective away from the developer's intent. Its primary mechanism is **prompt\ninjection** \u2014 adversarial instructions embedded in content the model reads (a web\npage, a document, a tool result, an email). **Indirect** injection (via data the\nagent retrieves rather than the user's own message) is the dangerous variant for\nautonomous agents. There is no known complete fix; it is a systemic property of\nmodels that follow natural-language instructions.", "color": "#16a34a"}, {"id": "security/risks/cascading-agent-failures.md", "title": "Cascading Agent Failures", "type": "Security risk", "description": "A local failure or compromise propagates across agents and tools into a systemic failure.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Cascading failures are when one bad output, loop, or outage ripples through dependent agents and tools \u2014 a reliability failure that is also a security one.", "color": "#16a34a"}, {"id": "security/risks/human-agent-trust-exploitation.md", "title": "Human-Agent Trust Exploitation", "type": "Security risk", "description": "The agent is used to manipulate the human, or humans over-trust the agent's output.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Trust exploitation runs both ways: an agent weaponized to socially engineer a person, and humans granting unearned trust to fluent but wrong output.", "color": "#16a34a"}, {"id": "security/risks/identity-privilege-abuse.md", "title": "Agent Identity & Privilege Abuse", "type": "Security risk", "description": "The agent's identity or permissions are misused, impersonated, or escalated.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Identity and privilege abuse covers impersonation, token theft, and privilege escalation \u2014 the agent acting with authority it should not have.", "color": "#16a34a"}, {"id": "security/risks/insecure-inter-agent-communication.md", "title": "Insecure Inter-Agent Communication", "type": "Security risk", "description": "Trust, spoofing, or tampering weaknesses in messaging between agents.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "In multi-agent systems, the channels between agents become an attack surface: unauthenticated messages, spoofed peers, and tampered hand-offs.", "color": "#16a34a"}, {"id": "security/risks/memory-context-poisoning.md", "title": "Memory & Context Poisoning", "type": "Security risk", "description": "Malicious content persists in the agent's memory or context and influences later decisions.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Memory and context poisoning plants adversarial content that survives across turns \u2014 the persistent cousin of goal hijack, corrupting future reasoning.", "color": "#16a34a"}, {"id": "security/risks/rogue-agents.md", "title": "Rogue Agents", "type": "Security risk", "description": "Unauthorized or compromised agents operating outside governance and oversight.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Rogue agents are those running outside the sanctioned control plane \u2014 unregistered, compromised, or drifted beyond their mandate.", "color": "#16a34a"}, {"id": "security/risks/supply-chain-compromise.md", "title": "Agentic Supply Chain Compromise", "type": "Security risk", "description": "Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Supply chain compromise is the poisoning of what the agent depends on: a backdoored MCP server, a tampered model, a malicious package, or a spoofed tool.", "color": "#16a34a"}, {"id": "security/risks/tool-misuse.md", "title": "Tool Misuse & Exploitation", "type": "Security risk", "description": "The agent invokes tools in ways they were not intended or authorized for.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Tool misuse is when an agent is driven to call tools \u2014 or chain them \u2014 in ways outside their intended, authorized use, turning legitimate capabilities into an attack.", "color": "#16a34a"}, {"id": "security/risks/unexpected-code-execution.md", "title": "Unexpected Code Execution", "type": "Security risk", "description": "The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Unexpected code execution is when an agent runs attacker-controlled code \u2014 a growing risk as agents gain interpreters and code-mode tools.", "color": "#16a34a"}, {"id": "security/security.md", "title": "Security", "type": "Overview", "description": "How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 risks and the mitigations that contain them.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agentic systems act with real tools and the user's own permissions, so their\nattack surface is the tool, identity, memory, and communication surface \u2014 not\njust the prompt. This area splits into **risks** (how agents are subverted) and\n**mitigations** (what keeps them inside a safe envelope \u2014 minimizing risk, never\nfully eliminating it). The reference model is the OWASP Top 10 for Agentic\nApplications (2026).\n\n# Risks (OWASP Agentic Top 10)\n\n- [Agent Goal Hijack](#node:security/risks/agent-goal-hijack.md)\n- [Tool Misuse & Exploitation](#node:security/risks/tool-misuse.md)\n- [Agent Identity & Privilege Abuse](#node:security/risks/identity-privilege-abuse.md)\n- [Agentic Supply Chain Compromise](#node:security/risks/supply-chain-compromise.md)\n- [Unexpected Code Execution](#node:security/risks/unexpected-code-execution.md)\n- [Memory & Context Poisoning](#node:security/risks/memory-context-poisoning.md)\n- [Insecure Inter-Agent Communication](#node:security/risks/insecure-inter-agent-communication.md)\n- [Cascading Agent Failures](#node:security/risks/cascading-agent-failures.md)\n- [Human-Agent Trust Exploitation](#node:security/risks/human-agent-trust-exploitation.md)\n- [Rogue Agents](#node:security/risks/rogue-agents.md)\n\n# Mitigations\n\n- [Guardrails](#node:security/mitigations/guardrails.md) \u2014 input/output/action policy enforcement around the model.\n- [PII Masking & Anonymization](#node:security/mitigations/pii-masking.md) \u2014 redacting or tokenizing personal data on the way in and out.\n\nMitigations are enforced in practice at the [LLM gateway](#node:enterprise/llm-gateway.md)\nand [MCP gateway](#node:enterprise/mcp-gateway.md), under a zero-trust posture: every\nagent action authenticated, authorized, least-privileged, and logged.\n\n# Resources\n\n- [OWASP Top 10 for Agentic Applications 2026](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)\n- [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)\n- [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)", "color": "#3b82f6"}], "edges": [{"source": "agents/agent.md", "target": "harness/tools.md"}, {"source": "agents/agent.md", "target": "harness/workflows.md"}, {"source": "agents/agent.md", "target": "context/memory.md"}, {"source": "agents/agent.md", "target": "harness/subagents.md"}, {"source": "agents/agent.md", "target": "harness/harness.md"}, {"source": "agents/agent.md", "target": "agents/deep-agents.md"}, {"source": "agents/antigravity.md", "target": "agents/agent.md"}, {"source": "agents/antigravity.md", "target": "harness/harness.md"}, {"source": "agents/claude-code.md", "target": "agents/agent.md"}, {"source": "agents/claude-code.md", "target": "harness/harness.md"}, {"source": "agents/codex.md", "target": "agents/agent.md"}, {"source": "agents/deep-agents.md", "target": "agents/agent.md"}, {"source": "agents/deep-agents.md", "target": "harness/subagents.md"}, {"source": "agents/deep-agents.md", "target": "context/memory.md"}, {"source": "agents/deep-agents.md", "target": "harness/workflows.md"}, {"source": "agents/deep-agents.md", "target": "harness/harness.md"}, {"source": "agents/devin.md", "target": "agent ng-first navigation and on-demand Contents and Graph panels.\n\n## 2026-07-05\n\n* **Reorganization**: Renamed `security/threats/` \u2192 `security/risks/` (type `Threat` \u2192 `Security risk`) and `security/controls/` \u2192 `security/mitigations/` \u2014 \"risk\" and \"mitigation\" are the accurate words (mitigations minimize risk, they don't eliminate it). Updated the Security overview wording and repaired all links.\n* **Creation**: Seeded concrete agent concepts [Claude Code](#node:agents/claude-code.md), [opencode](#node:agents/opencode.md), [Codex](#node:agents/codex.md), [Devin](#node:agents/devin.md), and [Antigravity](#node:agents/antigravity.md).\n* **Reorganization**: Split the agents area \u2014 `harness/` holds the machinery ([harness](#node:harness/harness.md), [subagents](#node:harness/subagents.md), [workflows](#node:harness/workflows.md)); `agents/` holds [agent architecture](#node:agents/agent.md) plus the concrete agents. Moved [Memory](#node:context/memory.md) into `context/`.\n* **Update**: Removed `tags` and `timestamp` from every concept's frontmatter as clutter (the site still renders tags when present).\n* **Update**: Full review pass. Dropped every `# Related` section \u2014 cross-references now read as prose in each concept's body (dropped ones that didn't fit). Balanced [MCP](#node:context/mcp.md) with why it was stateful (one-time negotiation, server-initiated push, local-stdio origin). Fixed the `workflows` description typos; normalized unnecessary title quotes.\n* **Creation**: Added concise concepts [RAG](#node:context/rag.md), [Context Engineering](#node:context/context-engineering.md), [Memory](#node:context/memory.md), [Subagents & Multi-Agent](#node:harness/subagents.md), [Provider-Side Tools](#node:harness/provider-tools.md), and [Frontend Tools](#node:harness/frontend-tools.md) (bare definitions to expand later).\n* **Reorganization**: Folded `evaluation/` into `observability/` (moved LangSmith Evals); kept `tools/` as its own
