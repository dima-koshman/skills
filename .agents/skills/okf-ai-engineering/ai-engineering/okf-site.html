const DATA = {"title": "ai-engineering", "nodes": [{"id": "agents/agent.md", "title": "Agent Architecture", "type": "Architecture Pattern", "description": "The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.", "tags": ["agents", "architecture", "deepagents", "platform"], "resource": "", "body": "Agent is not a well defined term, but in most cases it means an LLM in a loop\nwith tools that can perform actions beyond the standard chat interface.", "color": "#3b82f6"}, {"id": "agents/deepagents.md", "title": "deepagents", "type": "Framework", "description": "LangChain library packaging planning, subagents, memory, and human-in-the-loop on LangGraph.", "tags": ["agents", "deepagents", "langgraph", "framework"], "resource": "https://docs.langchain.com/oss/python/deepagents/overview", "body": "deepagents is the LangChain library that packages production agent patterns \u2014 planning, subagents, durable memory, HITL \u2014 on top of LangGraph.\n\n# Related\n\n- [Agent Architecture](#node:agents/agent.md)\n- [Agent Harness](#node:agents/harness.md)\n- [Programmatic Tools & Code Mode](#node:agents/programmatic-tools.md)", "color": "#16a34a"}, {"id": "agents/harness.md", "title": "Agent Harness", "type": "Architecture Pattern", "description": "The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.", "tags": ["agents", "harness", "runtime", "architecture"], "resource": "", "body": "The harness is everything around the model call that makes an agent run \u2014 tool dispatch, state and memory, sandboxing, retries, and stop conditions.\n\n# Related\n\n- [Agent Architecture](#node:agents/agent.md)\n- [deepagents](#node:agents/deepagents.md)\n- [Programmatic Tools & Code Mode](#node:agents/programmatic-tools.md)", "color": "#3b82f6"}, {"id": "agents/programmatic-tools.md", "title": "Programmatic Tools & Code Mode", "type": "Technique", "description": "Letting agents write and run code \u2014 interpreters, dynamic workflows \u2014 instead of only fixed tool calls.", "tags": ["agents", "code-mode", "tools", "technique"], "resource": "", "body": "Programmatic tools give an agent a way to make tool calls in a scripted way, allowing for reduced token usage and orchestration of long running tasks.\n\nExamples of programmatic tools implementations:\n\n- [LangChain Interpreters](https://docs.langchain.com/oss/python/deepagents/interpreters)\n- [Claude Workflows](https://code.claude.com/docs/en/workflows)\n\n# Related\n\n- [Agent Harness](#node:agents/harness.md)\n- [Agent Architecture](#node:agents/agent.md)\n- [Unexpected Code Execution](#node:security/threats/asi05-unexpected-code-execution.md)", "color": "#ca8a04"}, {"id": "ai-engineering.md", "title": "AI Engineering", "type": "Overview", "description": "Map of the concepts behind building enterprise-grade AI services \u2014 context, gateways, agents, observability, evaluation, and security.", "tags": ["overview", "ai-engineering", "enterprise", "platform"], "resource": "", "body": "# Related\n\n- **Context** \u2014 the protocols this builds on: [MCP](#node:context/mcp.md) and the\n  [Open Knowledge Format](#node:context/okf.md).\n- **Enterprise** \u2014 the control plane: the [LLM Gateway](#node:enterprise/llm-gateway.md)\n  and the [MCP Gateway](#node:enterprise/mcp-gateway.md).\n- **Agents** \u2014 [agent architecture](#node:agents/agent.md),\n  [deepagents](#node:agents/deepagents.md), the [harness](#node:agents/harness.md), and\n  [programmatic tools](#node:agents/programmatic-tools.md).\n- **Observability** \u2014 tracing with [LangSmith](#node:observability/langsmith.md) and\n  [Langfuse](#node:observability/langfuse.md).\n- **Evaluation** \u2014 [LangSmith Evals](#node:evaluation/langsmith-evals.md).\n- **Security** \u2014 [threats and controls](#node:security/security.md): the OWASP Agentic\n  Top 10 and the guardrails and masking that contain them.\n\n# Resources\n\n- [Cognition blog](https://cognition.com/blog)\n- [LangChain blog](https://www.langchain.com/blog)\n- [Anthropic Engineering blog](https://www.anthropic.com/engineering)\n- [The Agentic Operating Model \u2014 LangChain](https://www.langchain.com/resources/the-agentic-operating-model)", "color": "#7c3aed"}, {"id": "context/mcp.md", "title": "Model Context Protocol (MCP)", "type": "Protocol", "description": "Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.", "tags": ["mcp", "protocol", "platform", "integration"], "resource": "https://modelcontextprotocol.io", "body": "MCP is a JSON-RPC-based protocol that standardizes the\nboundary between an LLM client and external capabilities, mainly **tools** but also supports **resources** and **prompts**.\n\nIts drawback is the stateful nature, but there is an initiative to make it stateless.\n\n# Related\n\nConsumed by [agent architectures](#node:agents/agent.md); secured and\nmultiplexed by an [LLM gateway](#node:enterprise/llm-gateway.md); distinct from\n[OKF](#node:context/okf.md), which is static knowledge rather than live\ntools.\n\n# Resources\n\n- [MCP specification](https://modelcontextprotocol.io)\n- [FastMCP](https://gofastmcp.com)", "color": "#0891b2"}, {"id": "context/okf.md", "title": "Open Knowledge Format (OKF)", "type": "Knowledge Format", "description": "Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.", "tags": ["knowledge", "standards", "agents"], "resource": "https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf", "body": "OKF represents knowledge \u2014 the metadata and curated context around data and\nsystems \u2014 as a directory of markdown files with YAML frontmatter. One concept\nper file; the file path is the concept's identity. No schema registry, no\ncentral authority, no required tooling. This very bundle is an OKF bundle.\n\n# Relationship with skills\n\nOKF is *knowledge* (declarative facts), distinct from an agent **skill**\n(procedural capability) and from [MCP](#node:context/mcp.md) (a transport for tools\nand resources). An agent could consume an OKF bundle as its knowledge base while\na skill provides the procedure to traverse it and MCP exposes the live tools.\n\n# Resources\n\n- [OKF specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)", "color": "#dc2626"}, {"id": "enterprise/llm-gateway.md", "title": "LLM Gateway", "type": "Architecture Pattern", "description": "A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.", "tags": ["platform", "gateway", "security", "enterprise"], "resource": "", "body": "An LLM gateway is the control plane between AI clients and the\nmodels they use. It centralizes cross-cutting concerns \u2014 authentication,\nauthorization, rate limiting, routing/failover, content\npolicy, and audit \u2014 so that individual apps and agents stay thin.\n\nExamples:\n\n- LiteLLM", "color": "#3b82f6"}, {"id": "enterprise/mcp-gateway.md", "title": "MCP Gateway", "type": "Architecture Pattern", "description": "An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.", "tags": ["enterprise", "mcp", "gateway", "platform"], "resource": "", "body": "An MCP gateway is the control point in front of many MCP servers \u2014 one authenticated endpoint applying permissions, secret injection, anonymization, and audit.\n\n# Related\n\n- [MCP](#node:context/mcp.md)\n- [LLM Gateway](#node:enterprise/llm-gateway.md)\n- [Guardrails](#node:security/controls/guardrails.md)\n- [PII Masking & Anonymization](#node:security/controls/pii-masking.md)\n- [Agent Identity & Privilege Abuse](#node:security/threats/asi03-identity-privilege-abuse.md)", "color": "#3b82f6"}, {"id": "evaluation/langsmith-evals.md", "title": "LangSmith Evals", "type": "Tool", "description": "Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.", "tags": ["evaluation", "evals", "langsmith", "tool"], "resource": "https://docs.langchain.com/oss/python/langchain/test/evals", "body": "LangSmith's evaluation tooling runs datasets, LLM-as-judge and custom evaluators, and experiments over traces \u2014 the operational side of evals in this stack.\n\n# Related\n\n- [LangSmith](#node:observability/langsmith.md)", "color": "#db2777"}, {"id": "observability/langfuse.md", "title": "Langfuse", "type": "Tool", "description": "Open-source LLM observability and tracing, OpenTelemetry-friendly.", "tags": ["observability", "tracing", "langfuse", "open-source", "tool"], "resource": "https://langfuse.com", "body": "Langfuse is an open-source LLM observability platform \u2014 self-hostable tracing, metrics, and evals, a vendor-neutral alternative on the same OTel backbone.\n\n# Related\n\n- [LangSmith](#node:observability/langsmith.md)", "color": "#db2777"}, {"id": "observability/langsmith.md", "title": "LangSmith", "type": "Tool", "description": "LangChain's tracing and evaluation platform for LLM/agent observability.", "tags": ["observability", "tracing", "langsmith", "tool"], "resource": "https://www.langchain.com/langsmith", "body": "LangSmith is LangChain's managed platform for tracing, monitoring, and evaluating LLM apps and agents \u2014 the observability backend used across this work.\n\n# Related\n\n- [Langfuse](#node:observability/langfuse.md)\n- [LangSmith Evals](#node:evaluation/langsmith-evals.md)", "color": "#db2777"}, {"id": "security/controls/guardrails.md", "title": "Guardrails", "type": "Control", "description": "Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.", "tags": ["security", "control", "policy", "moderation"], "resource": "", "body": "Guardrails are the deterministic and model-based controls wrapped around an LLM\ncall to keep behavior inside a safe envelope: input filters (jailbreak/\n[injection](#node:security/threats/asi01-agent-goal-hijack.md) detection, topic limits), output\nfilters (moderation, PII checks, schema/format validation), and action gates\n(approval required before destructive tool calls). They are policy enforcement,\ndistinct from the model's own alignment.\n\n# Related\n\nMitigate [prompt injection](#node:security/threats/asi01-agent-goal-hijack.md); complement\n[PII masking](#node:security/controls/pii-masking.md) on the output path.", "color": "#ea7317"}, {"id": "security/controls/pii-masking.md", "title": "PII Masking & Anonymization", "type": "Control", "description": "Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.", "tags": ["security", "control", "privacy", "pii"], "resource": "", "body": "PII masking is the detection and transformation of personal data flowing through\nan AI system \u2014 redaction, pseudonymization, or reversible tokenization \u2014 so that\nsensitive fields never reach a model, a log, or a third party in the clear. In a\nbank, this is a hard regulatory boundary, not a nice-to-have.", "color": "#ea7317"}, {"id": "security/security.md", "title": "Security", "type": "Overview", "description": "How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 threats and the controls that contain them.", "tags": ["security", "overview", "owasp", "agents"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agentic systems act with real tools and the user's own permissions, so their\nattack surface is the tool, identity, memory, and communication surface \u2014 not\njust the prompt. This area splits into **threats** (how agents are subverted) and\n**controls** (what keeps them inside a safe envelope). The reference model is the\nOWASP Top 10 for Agentic Applications (2026).\n\n# Threats (OWASP Agentic Top 10)\n\n- [ASI01: Agent Goal Hijack](#node:security/threats/asi01-agent-goal-hijack.md)\n- [ASI02: Tool Misuse & Exploitation](#node:security/threats/asi02-tool-misuse.md)\n- [ASI03: Agent Identity & Privilege Abuse](#node:security/threats/asi03-identity-privilege-abuse.md)\n- [ASI04: Agentic Supply Chain Compromise](#node:security/threats/asi04-supply-chain-compromise.md)\n- [ASI05: Unexpected Code Execution](#node:security/threats/asi05-unexpected-code-execution.md)\n- [ASI06: Memory & Context Poisoning](#node:security/threats/asi06-memory-context-poisoning.md)\n- [ASI07: Insecure Inter-Agent Communication](#node:security/threats/asi07-insecure-inter-agent-communication.md)\n- [ASI08: Cascading Agent Failures](#node:security/threats/asi08-cascading-agent-failures.md)\n- [ASI09: Human-Agent Trust Exploitation](#node:security/threats/asi09-human-agent-trust-exploitation.md)\n- [ASI10: Rogue Agents](#node:security/threats/asi10-rogue-agents.md)\n\n# Controls\n\n- [Guardrails](#node:security/controls/guardrails.md) \u2014 input/output/action policy enforcement around the model.\n- [PII Masking & Anonymization](#node:security/controls/pii-masking.md) \u2014 redacting or tokenizing personal data on the way in and out.\n\nControls are enforced in practice at the [LLM gateway](#node:enterprise/llm-gateway.md)\nand [MCP gateway](#node:enterprise/mcp-gateway.md), under a zero-trust posture: every\nagent action authenticated, authorized, least-privileged, and logged.\n\n# Resources\n\n- [OWASP Top 10 for Agentic Applications 2026](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)\n- [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)\n- [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)", "color": "#7c3aed"}, {"id": "security/threats/asi01-agent-goal-hijack.md", "title": "ASI01: Agent Goal Hijack", "type": "Threat", "description": "Adversarial input redirects the agent's plan or objective \u2014 OWASP's", "tags": ["security", "threat", "agents", "owasp", "asi01"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agent goal hijack is when adversarial input redirects an agent's plan or\nobjective away from the developer's intent. Its primary mechanism is **prompt\ninjection** \u2014 adversarial instructions embedded in content the model reads (a web\npage, a document, a tool result, an email). **Indirect** injection (via data the\nagent retrieves rather than the user's own message) is the dangerous variant for\nautonomous agents. There is no known complete fix; it is a systemic property of\nmodels that follow natural-language instructions.", "color": "#9333ea"}, {"id": "security/threats/asi02-tool-misuse.md", "title": "ASI02: Tool Misuse & Exploitation", "type": "Threat", "description": "The agent invokes tools in ways they were not intended or authorized for.", "tags": ["security", "threat", "tools", "owasp", "asi02"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Tool misuse is when an agent is driven to call tools \u2014 or chain them \u2014 in ways outside their intended, authorized use, turning legitimate capabilities into an attack.", "color": "#9333ea"}, {"id": "security/threats/asi03-identity-privilege-abuse.md", "title": "ASI03: Agent Identity & Privilege Abuse", "type": "Threat", "description": "The agent's identity or permissions are misused, impersonated, or escalated.", "tags": ["security", "threat", "identity", "owasp", "asi03"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Identity and privilege abuse covers impersonation, token theft, and privilege escalation \u2014 the agent acting with authority it should not have.", "color": "#9333ea"}, {"id": "security/threats/asi04-supply-chain-compromise.md", "title": "ASI04: Agentic Supply Chain Compromise", "type": "Threat", "description": "Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.", "tags": ["security", "threat", "supply-chain", "owasp", "asi04"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Supply chain compromise is the poisoning of what the agent depends on: a backdoored MCP server, a tampered model, a malicious package, or a spoofed tool.", "color": "#9333ea"}, {"id": "security/threats/asi05-unexpected-code-execution.md", "title": "ASI05: Unexpected Code Execution", "type": "Threat", "description": "The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.", "tags": ["security", "threat", "rce", "owasp", "asi05"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Unexpected code execution is when an agent runs attacker-controlled code \u2014 a growing risk as agents gain interpreters and code-mode tools.", "color": "#9333ea"}, {"id": "security/threats/asi06-memory-context-poisoning.md", "title": "ASI06: Memory & Context Poisoning", "type": "Threat", "description": "Malicious content persists in the agent's memory or context and influences later decisions.", "tags": ["security", "threat", "memory", "owasp", "asi06"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Memory and context poisoning plants adversarial content that survives across turns \u2014 the persistent cousin of goal hijack, corrupting future reasoning.", "color": "#9333ea"}, {"id": "security/threats/asi07-insecure-inter-agent-communication.md", "title": "ASI07: Insecure Inter-Agent Communication", "type": "Threat", "description": "Trust, spoofing, or tampering weaknesses in messaging between agents.", "tags": ["security", "threat", "multi-agent", "owasp", "asi07"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "In multi-agent systems, the channels between agents const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));

/* ---------- graph ---------- */
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [
    ...DATA.nodes.map(n => ({ data: { id: n.id, label: n.title, color: n.color } })),
    ...DATA.edges.map(e => ({ data: { id: e.source + '->' + e.target, source: e.source, target: e.target } })),
  ],
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'label': 'data(label)', 'color': '#1f2328',
        'font-size': '8px', 'text-wrap': 'wrap', 'text-max-width': '80px',
        'text-valign': 'bottom', 'text-margin-y': 3, 'width': 15, 'height': 15,
        'border-width': 1.5, 'border-color': '#ffffff' } },
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#c8d1da', 'target-arrow-color': '#c8d1da',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .7 } },
    { selector: 'node.sel', style: { 'border-color': '#0969da', 'border-width': 3, 'font-size': '10px', 'font-weight': 'bold', 'width': 20, 'height': 20 } },
    { selector: '.faded', style: { 'opacity': .12 } },
    { selector: 'node.hidden', style: { 'display': 'none' } },
  ],
  wheelSensitivity: 0.2,
});

function graphLayout() {
  return { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true,
           idealEdgeLength: 150, nodeRepulsion: 22000, nodeOverlap: 60,
           gravity: 0.2, componentSpacing: 160, numIter: 1500, padding: 40 };
}

// Run the force layout, then a deterministic pass that pushes any still-
// overlapping nodes apart using their label-inclusive bounding boxes, so labels
// never sit on top of each other regardless of the force layout's result.
function runLayout() {
  const layout = cy.layout(graphLayout());
  layout.one('layoutstop', () => requestAnimationFrame(() => separateOverlaps()));
  layout.run();
}

function separateOverlaps(iterations = 80, pad = 10) {
  const nodes = cy.nodes();
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ba = a.boundingBox({ includeLabels: true });
        const bb = b.boundingBox({ includeLabels: true });
        const overlapX = Math.min(ba.x2, bb.x2) - Math.max(ba.x1, bb.x1) + pad;
        const overlapY = Math.min(ba.y2, bb.y2) - Math.max(ba.y1, bb.y1) + pad;
        if (overlapX > 0 && overlapY > 0) {
          let dx = (ba.x1 + ba.x2) / 2 - (bb.x1 + bb.x2) / 2;
          let dy = (ba.y1 + ba.y2) / 2 - (bb.y1 + bb.y2) / 2;
          const dist = Math.hypot(dx, dy) || 0.01;
          const push = Math.min(overlapX, overlapY) / 2;
          dx /= dist; dy /= dist;
          a.position({ x: a.position('x') + dx * push, y: a.position('y') + dy * push });
          b.position({ x: b.position('x') - dx * push, y: b.position('y') - dy * push });
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  cy.fit(undefined, 30);
}

cy.on('tap', 'node', ev => {
  // Clicking the already-selected node toggles the selection off.
  if (ev.target.hasClass('sel')) clearHighlight(); else openConcept(ev.target.id());
});
cy.on('tap', 'edge', ev => openEdgeLink(ev.target.id()));           // open the source doc at the link that made this edge
cy.on('tap', ev => { if (ev.target === cy) clearHighlight(); });    // click empty space = deselect node, keep the doc open
document.getElementById('graph').addEventListener('dblclick', () => {  // double-click anywhere = reset zoom to fit all
  cy.animate({ fit: { eles: cy.elements(), padding: 30 } }, { duration: 300 });
});

let activeType = null;

// Reflect the active type (if any) onto the legend chips and the nav tree.
function paintTypeState() {
  document.querySelectorAll('#legend .legend-item').forEach(el =>
    el.classList.toggle('active', el.dataset.type === activeType));
  document.querySelectorAll('#nav a[data-id]').forEach(a =>
    a.classList.toggle('typematch', !!activeType && byId[a.dataset.id].type === activeType));
}

function highlight(id) {
  const node = cy.getElementById(id);
  activeType = null;
  cy.elements().addClass('faded');
  cy.nodes().removeClass('sel');
  const near = node.closedNeighborhood();
  near.removeClass('faded');
  node.addClass('sel');
  paintTypeState();
  caption.textContent = node.data('label') + ' — ' + node.connectedEdges().length + ' links';
}

// Highlight every concept of one type across the graph and the nav tree.
function highlightType(type) {
  activeType = type;
  cy.nodes().removeClass('sel');
  cy.elements().addClass('faded');
  const matching = cy.nodes().filter(n => byId[n.id()].type === type);
  matching.removeClass('faded');
  paintTypeState();
  caption.textContent = type + ' — ' + matching.length + ' concepts';
}

function clearHighlight() {
  activeType = null;
  cy.elements().removeClass('faded');
  cy.nodes().removeClass('sel');
  paintTypeState();
  caption.textContent = cy.nodes().length + ' concepts · ' + cy.edges().length + ' links';
}

function relayout() {
  // Only resize/refit on view changes — never re-run the force layout, which
  // would reshuffle node positions and make the graph jump on every click.
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

function focusOn(id) {
  // Zoom and recenter to the selected node plus its immediate links, instead of
  // refitting the entire graph.
  const node = cy.getElementById(id);
  requestAnimationFrame(() => {
    cy.resize();
    if (node.nonempty()) cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 60 } }, { duration: 300 });
    else cy.fit(undefined, 30);
  });
}

/* ---------- reader ---------- */
// Wire a rendered markdown container: in-bundle links navigate the graph,
// external links open in a new tab.
function wireDocLinks(container) {
  container.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  container.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

function renderDoc(markdown) {
  doc.innerHTML = marked.parse(markdown);
  wireDocLinks(doc);
  doc.scrollTop = 0;
}

function openConcept(id) {
  const n = byId[id];
  if (!n) return;
  main.classList.remove('graph-only');
  const resourceHtml = n.resource
    ? `<span class="resource">🔗 <a href="${escapeAttr(n.resource)}" title="${escapeAttr(n.resource)}" target="_blank" rel="noopener">${escapeHtml(n.resource)}</a></span>` : '';
  const tagsHtml = (n.tags && n.tags.length)
    ? `<span class="tags-inline">${n.tags.map(t => `<code>${escapeHtml(t)}</code>`).join('')}</span>` : '';
  const summaryHtml = n.description ? `<p class="summary">${escapeHtml(n.description)}</p>` : '';
  doc.innerHTML =
    `<h1>${escapeHtml(n.title)}</h1>` +
    `<div class="meta">` +
      resourceHtml +
      `<span class="meta-right">${tagsHtml}` +
        `<span class="badge" style="background:${n.color}">${escapeHtml(n.type)}</span>` +
      `</span>` +
    `</div>` + summaryHtml;
  const bodyHtml = document.createElement('div');
  bodyHtml.className = 'prose';
  bodyHtml.innerHTML = marked.parse(n.body);
  doc.appendChild(bodyHtml);
  wireDocLinks(bodyHtml);
  doc.scrollTop = 0;
  setActiveNav(id);
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  highlight(id);
  focusOn(id);
}

function openIndex() {
  // The bundle-root index.md is the landing page: catalog in the reader, whole graph.
  main.classList.remove('graph-only');
  const body = document.createElement('div');
  body.className = 'prose';
  body.innerHTML = DATA.index ? marked.parse(DATA.index) : '';
  doc.innerHTML = '';
  doc.appendChild(body);
  wireDocLinks(body);
  doc.scrollTop = 0;
  setActiveNav('index');
  clearHighlight();
  history.replaceState(null, '', '#index');
  relayout();
}

function openEdgeLink(edgeId) {
  // Open the edge's source concept and scroll to / flash the specific link in
  // its markdown that produced this edge.
  const sep = edgeId.indexOf('->');
  const source = edgeId.slice(0, sep), target = edgeId.slice(sep + 2);
  openConcept(source);
  const link = doc.querySelector(`a[href="#node:${target}"]`);
  if (link) {
    link.scrollIntoView({ behavior: 'smooth', block: 'center' });
    link.classList.add('flash');
    setTimeout(() => link.classList.remove('flash'), 1600);
  }
}

function openLog() {
  if (!DATA.log) return;
  main.classList.remove('graph-only');
  renderDoc(DATA.log);
  setActiveNav('log');
  clearHighlight();
  history.replaceState(null, '', '#log');
  relayout();
}

function showGraphOnly() {
  main.classList.add('graph-only');
  setActiveNav(null);
  clearHighlight();
  history.replaceState(null, '', location.pathname);
  relayout();
}

/* ---------- sidebar tree ---------- */
function buildTree(nodes) {
  const root = { dirs: {}, files: [] };
  nodes.forEach(n => {
    const parts = n.id.split('/');
    let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
      cur = cur.dirs[parts[i]];
    }
    cur.files.push(n);
  });
  return root;
}

function renderTree(tree) {
  const ul = document.createElement('ul');
  // Concept pages first, then subdirectories (so a directory's own overview sits
  // above its children).
  tree.files.sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(n.id);
    a.dataset.id = n.id;
    a.innerHTML = `<span class="dot" style="background:${n.color}"></span><span>${escapeHtml(n.title)}</span>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(n.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
  Object.keys(tree.dirs).sort().forEach(name => {
    const li = document.createElement('li');
    li.className = 'dir';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name.replace(/[-_]/g, ' ');
    li.appendChild(label);
    li.appendChild(renderTree(tree.dirs[name]));
    ul.appendChild(li);
  });
  return ul;
}

function setActiveNav(id) {
  document.querySelectorAll('#nav a, #loglink a').forEach(a => a.classList.remove('active'));
  if (id === 'log') { const l = document.querySelector('#loglink a'); l && l.classList.add('active'); return; }
  if (id === 'index') { const h = document.querySelector('#nav a.homelink'); h && h.classList.add('active'); return; }
  if (!id) return;
  const a = document.querySelector(`#nav a[data-id="${cssEscape(id)}"]`);
  a && a.classList.add('active');
}

const nav = document.getElementById('nav');
if (DATA.index) {
  const home = document.createElement('a');
  home.href = '#index';
  home.className = 'homelink';
  home.innerHTML = '🏠 <span>Index</span>';
  home.addEventListener('click', ev => { ev.preventDefault(); openIndex(); });
  nav.appendChild(home);
}
nav.appendChild(renderTree(buildTree(DATA.nodes)));
if (DATA.log) {
  const link = document.createElement('a');
  link.href = '#log';
  link.innerHTML = '📓 <span>Change log</span>';
  link.addEventListener('click', ev => { ev.preventDefault(); openLog(); });
  document.getElementById('loglink').appendChild(link);
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  DATA.nodes.forEach(n => {
    const hay = (n.title + ' ' + n.description + ' ' + n.type + ' ' + n.tags.join(' ')).toLowerCase();
    const hit = !q || hay.includes(q);
    const navA = document.querySelector(`#nav a[data-id="${cssEscape(n.id)}"]`);
    navA && navA.classList.toggle('hidden', !hit);
    if (main.classList.contains('graph-only')) cy.getElementById(n.id).toggleClass('faded', !!q && !hit);
  });
});

/* ---------- legend ---------- */
function buildLegend() {
  const legend = document.getElementById('legend');
  const title = document.createElement('span');
  title.className = 'legend-title';
  title.textContent = 'Types';
  legend.appendChild(title);
  DATA.types.forEach(t => {
    const item = document.createElement('button');
    item.className = 'legend-item';
    item.dataset.type = t.name;
    item.innerHTML = `<span class="sw" style="background:${t.color}"></span>${escapeHtml(t.name)}`;
    item.addEventListener('click', () => {
      if (activeType === t.name) clearHighlight(); else highlightType(t.name);
    });
    legend.appendChild(item);
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&'); }

/* ---------- initial state ---------- */
runLayout();
buildLegend();
clearHighlight();
const start = decodeURIComponent(location.hash.slice(1));
if (start === 'log') openLog();
else if (byId[start]) openConcept(start);
else if (DATA.index) openIndex();
else showGraphOnly();
</script>
</body>
</html>
