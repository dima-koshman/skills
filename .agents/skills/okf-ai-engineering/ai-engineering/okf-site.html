const DATA = {"title": "ai-engineering", "nodes": [{"id": "agents/A2A.md", "title": "Agent2Agent", "type": "Standard", "description": "An open protocol enabling communication and interoperability between opaque agentic applications.", "tags": [], "resource": "https://a2a-protocol.org", "body": "A2A is a protocol for cross agent communication, though I'm not sold on its usefulness - why not just use tools to call other agents?\nAnd if all communication is plain text, what's the need for a protocol?", "color": "#dc2626"}, {"id": "agents/ACP.md", "title": "Agent Client Protocol", "type": "Standard", "description": "ACP standardizes communication between code editors/IDEs and coding agents.", "tags": [], "resource": "https://agentclientprotocol.com/", "body": "Protocol only useful for IDEs.", "color": "#dc2626"}, {"id": "agents/agent.md", "title": "Agent", "type": "Overview", "description": "The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.", "tags": [], "resource": "", "body": "Agent is not a well-defined term, but in most cases it means an **LLM in a loop\nwith tools**: the model picks the next action, calls a [tool](#node:tools/tools.md),\nobserves the result, and repeats until the task is done. What distinguishes an\nagent from a fixed pipeline is that the *model* \u2014 not hard-coded logic \u2014 directs\nthe control flow; when the flow can be fixed instead, a\n[workflow](#node:harness/workflows.md) is the leaner option. The recurring ingredients\nare the loop, planning (decomposing a goal into steps), tool use,\n[memory](#node:context/memory.md) (carrying context across steps), and often\n[subagents](#node:harness/subagents.md) for delegating focused subtasks. The loop is\ndriven by an [agent harness](#node:harness/harness.md); frameworks like\n[deepagents](#node:agents/deep-agents.md) package these patterns.", "color": "#3b82f6"}, {"id": "agents/antigravity.md", "title": "Antigravity", "type": "Product", "description": "Google's agent-first development platform built on Gemini \u2014 an IDE, desktop app, and CLI sharing one agent harness.", "tags": [], "resource": "https://antigravity.google", "body": "Antigravity is Google's agent-first development platform built on Gemini: an IDE, a\ndesktop app, and a CLI that share a common [agent](#node:agents/agent.md)\n[harness](#node:harness/harness.md), where agents operate across the editor, terminal,\nand browser to build software from a prompt.", "color": "#ea7317"}, {"id": "agents/claude-code.md", "title": "Claude Code", "type": "Product", "description": "Anthropic's coding agent \u2014 Claude in a loop with file, shell, and code tools, available as CLI, IDE extension, and SDK.", "tags": [], "resource": "https://code.claude.com/docs", "body": "Claude Code is Anthropic's coding [agent](#node:agents/agent.md): a terminal-native\n[harness](#node:harness/harness.md) running Claude.\n\nClaude code usage can be traced via LangSmith using this [plugin](https://docs.langchain.com/langsmith/trace-claude-code).", "color": "#ea7317"}, {"id": "agents/codex.md", "title": "Codex", "type": "Product", "description": "OpenAI's coding agent \u2014 an open-source terminal CLI plus cloud environments, powered by OpenAI's coding models.", "tags": [], "resource": "https://openai.com/codex/", "body": "Codex is OpenAI's coding [agent](#node:agents/agent.md): an open-source terminal CLI\nplus cloud environments and IDE integration, powered by OpenAI's frontier coding\nmodels. It runs tasks end-to-end \u2014 features, refactors, migrations \u2014 with agents\nworking in parallel across git worktrees.", "color": "#ea7317"}, {"id": "agents/deep-agents.md", "title": "Deep Agents", "type": "Product", "description": "Opinionated LangChain package for high level agent patterns.", "tags": [], "resource": "https://docs.langchain.com/oss/python/deepagents/overview", "body": "Deep Agents is the LangChain library that packages production [agent](#node:agents/agent.md) patterns \u2014 planning, [subagents](#node:harness/subagents.md), durable [memory](#node:context/memory.md), human-in-the-loop, and [workflows](#node:harness/workflows.md) \u2014 on top of LangGraph, which serves as its [harness](#node:harness/harness.md).", "color": "#ea7317"}, {"id": "agents/devin.md", "title": "Devin", "type": "Product", "description": "Cognition's autonomous AI software engineer \u2014 a cloud agent that executes coding tasks end-to-end in its own sandbox.", "tags": [], "resource": "https://devin.ai", "body": "Devin is Cognition's autonomous AI software engineer: a cloud-based\n[agent](#node:agents/agent.md) that plans and executes coding tasks end-to-end and\nasynchronously in its own isolated sandbox \u2014 closer to a delegated engineer than a\nlocal pair-programmer.", "color": "#ea7317"}, {"id": "agents/opencode.md", "title": "OpenCode", "type": "Product", "description": "Open-source, terminal-native, model-agnostic coding agent \u2014 a vendor-neutral alternative to Claude Code.", "tags": [], "resource": "https://opencode.ai", "body": "OpenCode is an open-source, terminal-native coding [agent](#node:agents/agent.md) (by\nthe SST team) that is model-agnostic \u2014 it connects to many model providers rather\nthan a single vendor, runs locally, and stores its sessions on disk. A\nvendor-neutral counterpart to [Claude Code](#node:agents/claude-code.md). Can be used with Codex or Antigravity subscriptions, but not with Claude.\n\nOpenCode usage can be traced via LangSmith using this [plugin](https://docs.langchain.com/langsmith/trace-with-opencode).", "color": "#ea7317"}, {"id": "ai-engineering.md", "title": "AI Engineering", "type": "Overview", "description": "Personal knowledge base for AI engineering concepts.", "tags": [], "resource": "", "body": "# Map\n\n- **Context** \u2014 how the model gets its context: [MCP](#node:context/mcp.md), the\n  [Open Knowledge Format](#node:context/okf.md), [RAG](#node:context/rag.md),\n  [context engineering](#node:context/context-engineering.md), and\n  [memory](#node:context/memory.md).\n- **Tools** \u2014 the [tools](#node:tools/tools.md) primitive, plus\n  [provider-side](#node:tools/provider-tools.md) and [frontend](#node:tools/frontend-tools.md) tools.\n- **Enterprise** \u2014 the control plane: the [LLM Gateway](#node:enterprise/llm-gateway.md)\n  and the [MCP Gateway](#node:enterprise/mcp-gateway.md).\n- **Agents** \u2014 what an agent is ([agent architecture](#node:agents/agent.md)) and the\n  concrete ones: [deepagents](#node:agents/deep-agents.md),\n  [Claude Code](#node:agents/claude-code.md), [opencode](#node:agents/opencode.md),\n  [Codex](#node:agents/codex.md), [Devin](#node:agents/devin.md), and\n  [Antigravity](#node:agents/antigravity.md).\n- **Harness** \u2014 the machinery that runs them: the [harness](#node:harness/harness.md),\n  [subagents](#node:harness/subagents.md), and [workflows](#node:harness/workflows.md).\n- **Observability & evaluation** \u2014 tracing and evals with\n  [LangSmith](#node:observability/langsmith.md), [Langfuse](#node:observability/langfuse.md),\n  and [LangSmith Evals](#node:observability/langsmith-evals.md).\n- **Security** \u2014 [risks and mitigations](#node:security/security.md): the OWASP Agentic\n  Top 10 and the guardrails and masking that minimize them.\n\n# Resources\n\nFor discovering new information:\n\n- [Cognition blog](https://cognition.com/blog)\n- [LangChain blog](https://www.langchain.com/blog)\n- [Anthropic Engineering blog](https://www.anthropic.com/engineering)\n- [FastMCP](https://gofastmcp.com)\n\nNice general resources:\n\n- [The Agentic Operating Model \u2014 LangChain](https://www.langchain.com/resources/the-agentic-operating-model)", "color": "#3b82f6"}, {"id": "context/context-engineering.md", "title": "Context Engineering", "type": "Technique", "description": "Deliberately assembling what goes into the model's context window \u2014 instructions, tools, retrieved data, memory, and history.", "tags": [], "resource": "", "body": "Context engineering is the practice of deliberately assembling everything the\nmodel sees for a given step \u2014 system instructions, [tool](#node:tools/tools.md)\ndefinitions, [retrieved](#node:context/rag.md) data, [memory](#node:context/memory.md), and\nconversation history \u2014 and managing the limited context window. It is the broader\nsuccessor discipline to prompt engineering.", "color": "#7c3aed"}, {"id": "context/mcp.md", "title": "Model Context Protocol (MCP)", "type": "Standard", "description": "Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.", "tags": [], "resource": "https://modelcontextprotocol.io", "body": "MCP is a JSON-RPC-based protocol that standardizes the boundary between an LLM\nclient and external capabilities \u2014 mainly **tools**, but it also supports\n**resources** and **prompts**. Its [tools](#node:tools/tools.md) are consumed by\n[agent architectures](#node:agents/agent.md) and, in production, fronted by an\n[MCP gateway](#node:enterprise/mcp-gateway.md) that multiplexes and secures many\nservers.\n\nIt was designed **stateful**: a session opens with an initialization handshake\nthat negotiates protocol version and capabilities once, over a persistent\nconnection the server can also push back on \u2014 sampling, elicitation, progress,\nand resource/tool-list-change notifications. That bidirectional, session-oriented\nmodel fit MCP's local-first origin, where a client launches a local server over\nstdio and the connection is naturally long-lived.\n\nThat same statefulness is its main drawback for remote, at-scale deployments: the\nhandshake and per-session state force sticky sessions and complicate serverless\nand horizontal scaling. A stateless-by-default redesign was requested in\n[SEP-1442](https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1442)\nand accepted as\n[SEP-2575](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2575)\n(merged May 2026), targeting the 2026-07-28 spec revision \u2014 worth tracking as it\nlands.\n\n# Resources\n\n- [MCP specification](https://modelcontextprotocol.io)\n- [FastMCP](https://gofastmcp.com)\n- [SEP-2575: Make MCP Stateless](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2575) (merged; targets the 2026-07-28 spec)", "color": "#dc2626"}, {"id": "context/memory.md", "title": "Memory", "type": "Technique", "description": "How an agent carries state across steps and sessions \u2014 short-term context plus durable long-term stores.", "tags": [], "resource": "", "body": "Memory is how an agent retains information beyond a single model call: short-term\nworking memory in the context window, and long-term memory persisted externally\n(often a vector store) and retrieved when relevant. It lets an agent accumulate\nstate across steps and sessions \u2014 and is a target for\n[poisoning](#node:security/risks/memory-context-poisoning.md).", "color": "#7c3aed"}, {"id": "context/okf.md", "title": "Open Knowledge Format (OKF)", "type": "Standard", "description": "Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.", "tags": [], "resource": "https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf", "body": "OKF represents knowledge \u2014 the metadata and curated context around data and\nsystems \u2014 as a directory of markdown files with YAML frontmatter. One concept\nper file; the file path is the concept's identity. No schema registry, no\ncentral authority, no required tooling. This very bundle is an OKF bundle.\n\n# Relationship with skills\n\nOKF is *knowledge* (declarative facts), distinct from an agent **skill**\n(procedural capability) and from [MCP](#node:context/mcp.md) (a transport for tools\nand resources). An agent could consume an OKF bundle as its knowledge base while\na skill provides the procedure to traverse it and MCP exposes the live tools.\n\n# Resources\n\n- [OKF specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)", "color": "#dc2626"}, {"id": "context/rag.md", "title": "RAG", "type": "Technique", "description": "Retrieval-augmented generation \u2014 fetching relevant documents at query time and adding them to the model's context.", "tags": [], "resource": "", "body": "While strictly speaking retrieval-augmented generation doesn't have to be based on vector embeddings and semantic similarity search, in practice that's what is usually implied when people mention RAG. Powerful technique, but doesn't suit all use cases - doesn't work well for structured or semi-structured data or data that changes frequently - embeddings are not directly linked to original text and require re-indexing. Additionally, it requires a lot of maintenance and complex setup - need to normalize text, deal with structured data, chunking, etc.\n\nRAG is one of the techniques used in\n[context engineering](#node:context/context-engineering.md).", "color": "#7c3aed"}, {"id": "enterprise/llm-gateway.md", "title": "LLM Gateway", "type": "Technique", "description": "A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.", "tags": [], "resource": "", "body": "An LLM gateway is the control plane between AI clients and the\nmodels they use. It centralizes cross-cutting concerns \u2014 authentication,\nauthorization, rate limiting, routing/failover, content\npolicy, and audit \u2014 so that individual apps and agents stay thin. It is the\nmodel-side counterpart to the [MCP gateway](#node:enterprise/mcp-gateway.md) and a\nnatural enforcement point for [guardrails](#node:security/mitigations/guardrails.md).\n\nExamples:\n\n- LiteLLM", "color": "#7c3aed"}, {"id": "enterprise/mcp-gateway.md", "title": "MCP Gateway", "type": "Technique", "description": "An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.", "tags": [], "resource": "", "body": "An MCP gateway is the control point in front of many [MCP](#node:context/mcp.md) servers \u2014 one authenticated endpoint applying permissions, secret injection, [anonymization](#node:security/mitigations/pii-masking.md), [guardrails](#node:security/mitigations/guardrails.md), and audit. It is the tool-side counterpart to the [LLM gateway](#node:enterprise/llm-gateway.md) and the main control against [agent identity & privilege abuse](#node:security/risks/identity-privilege-abuse.md).", "color": "#7c3aed"}, {"id": "harness/harness.md", "title": "Agent Harness", "type": "Overview", "description": "The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.", "tags": [], "resource": "", "body": "The harness is the runtime that drives the agent loop around the model: it parses each model response, dispatches the tool calls, feeds results back, manages context and memory, enforces sandboxing and limits (retries, max steps, budgets), and decides when to stop. It is the concrete implementation of an [agent architecture](#node:agents/agent.md) \u2014 the model and the tools plug into it, and it is what runs a [workflow](#node:harness/workflows.md) or a full agent loop. Frameworks like [deepagents](#node:agents/deep-agents.md) ship a ready-made harness.", "color": "#3b82f6"}, {"id": "harness/subagents.md", "title": "Subagents", "type": "Technique", "description": "Delegating focused subtasks to separate agent instances, and orchestrating multiple agents together.", "tags": [], "resource": "", "body": "Subagents are separate agent instances spawned to handle a focused subtask with\ntheir own context, keeping the parent's context clean; multi-agent systems\ncoordinate several such agents, often under a supervisor. The pattern adds a new\nattack surface \u2014 see\n[insecure inter-agent communication](#node:security/risks/insecure-inter-agent-communication.md).", "color": "#7c3aed"}, {"id": "harness/workflows.md", "title": "Workflows", "type": "Technique", "description": "Workflows let an agent orchestrate its tool calls programmatically \u2014 scripted tool use for lower token cost and long-running tasks.", "tags": [], "resource": "", "body": "Workflows give an [agent](#node:agents/agent.md) a way to make tool calls in a scripted way, allowing for reduced token usage and orchestration of long running tasks. They become especially powerful with access to a [subagent](#node:harness/subagents.md)-spawning tool. Because they run model-written code inside the [harness](#node:harness/harness.md), they raise [unexpected code execution](#node:security/risks/unexpected-code-execution.md) risk.\n\nExamples of workflow implementations:\n\n- [Claude Workflows](https://code.claude.com/docs/en/workflows)\n- [LangChain Interpreters](https://docs.langchain.com/oss/python/deepagents/interpreters)", "color": "#7c3aed"}, {"id": "observability/langfuse.md", "title": "Langfuse", "type": "Product", "description": "Open-source LLM observability and tracing, OpenTelemetry-friendly.", "tags": [], "resource": "https://langfuse.com", "body": "Langfuse is an open-source LLM observability platform \u2014 self-hostable tracing, metrics, and evals, a vendor-neutral alternative to [LangSmith](#node:observability/langsmith.md) on the same OTel backbone.", "color": "#ea7317"}, {"id": "observability/langsmith-evals.md", "title": "LangSmith Evals", "type": "Product", "description": "Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.", "tags": [], "resource": "https://docs.langchain.com/oss/python/langchain/test/evals", "body": "[LangSmith](#node:observability/langsmith.md)'s evaluation tooling runs datasets, LLM-as-judge and custom evaluators, and experiments over traces \u2014 the operational side of evals in this stack.", "color": "#ea7317"}, {"id": "observability/langsmith.md", "title": "LangSmith", "type": "Product", "description": "LangChain's tracing and evaluation platform for LLM/agent observability.", "tags": [], "resource": "https://www.langchain.com/langsmith", "body": "LangSmith is LangChain's managed platform for tracing, monitoring, and [evaluating](#node:observability/langsmith-evals.md) LLM apps and agents \u2014 the observability backend used across this work. [Langfuse](#node:observability/langfuse.md) is the open-source alternative.", "color": "#ea7317"}, {"id": "security/mitigations/guardrails.md", "title": "Guardrails", "type": "Technique", "description": "Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.", "tags": [], "resource": "", "body": "Guardrails are the deterministic and model-based controls wrapped around an LLM\ncall to keep behavior inside a safe envelope: input filters (jailbreak/\n[injection](#node:security/risks/agent-goal-hijack.md) detection, topic limits), output\nfilters (moderation, PII checks, schema/format validation), and action gates\n(approval required before destructive tool calls). They are policy enforcement,\ndistinct from the model's own alignment. They complement\n[PII masking](#node:security/mitigations/pii-masking.md) on the output path and are\ntypically enforced at the [MCP gateway](#node:enterprise/mcp-gateway.md).", "color": "#7c3aed"}, {"id": "security/mitigations/pii-masking.md", "title": "PII Masking & Anonymization", "type": "Technique", "description": "Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.", "tags": [], "resource": "", "body": "PII masking is the detection and transformation of personal data flowing through\nan AI system \u2014 redaction, pseudonymization, or reversible tokenization \u2014 so that\nsensitive fields never reach a model, a log, or a third party in the clear. It is\nthe privacy counterpart to [guardrails](#node:security/mitigations/guardrails.md) and is\ntypically enforced at the [MCP gateway](#node:enterprise/mcp-gateway.md). In a bank,\nthis is a hard regulatory boundary, not a nice-to-have.", "color": "#7c3aed"}, {"id": "security/risks/agent-goal-hijack.md", "title": "Agent Goal Hijack", "type": "Security risk", "description": "Adversarial input redirects the agent's plan or objective \u2014 OWASP's #1 agentic risk, prompt injection being the primary mechanism.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agent goal hijack is when adversarial input redirects an agent's plan or\nobjective away from the developer's intent. Its primary mechanism is **prompt\ninjection** \u2014 adversarial instructions embedded in content the model reads (a web\npage, a document, a tool result, an email). **Indirect** injection (via data the\nagent retrieves rather than the user's own message) is the dangerous variant for\nautonomous agents. There is no known complete fix; it is a systemic property of\nmodels that follow natural-language instructions.", "color": "#16a34a"}, {"id": "security/risks/cascading-agent-failures.md", "title": "Cascading Agent Failures", "type": "Security risk", "description": "A local failure or compromise propagates across agents and tools into a systemic failure.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Cascading failures are when one bad output, loop, or outage ripples through dependent agents and tools \u2014 a reliability failure that is also a security one.", "color": "#16a34a"}, {"id": "security/risks/human-agent-trust-exploitation.md", "title": "Human-Agent Trust Exploitation", "type": "Security risk", "description": "The agent is used to manipulate the human, or humans over-trust the agent's output.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Trust exploitation runs both ways: an agent weaponized to socially engineer a person, and humans granting unearned trust to fluent but wrong output.", "color": "#16a34a"}, {"id": "security/risks/identity-privilege-abuse.md", "title": "Agent Identity & Privilege Abuse", "type": "Security risk", "description": "The agent's identity or permissions are misused, impersonated, or escalated.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Identity and privilege abuse covers impersonation, token theft, and privilege escalation \u2014 the agent acting with authority it should not have.", "color": "#16a34a"}, {"id": "security/risks/insecure-inter-agent-communication.md", "title": "Insecure Inter-Agent Communication", "type": "Security risk", "description": "Trust, spoofing, or tampering weaknesses in messaging between agents.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "In multi-agent systems, the channels between agents become an attack surface: unauthenticated messages, spoofed peers, and tampered hand-offs.", "color": "#16a34a"}, {"id": "security/risks/memory-context-poisoning.md", "title": "Memory & Context Poisoning", "type": "Security risk", "description": "Malicious content persists in the agent's memory or context and influences later decisions.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Memory and context poisoning plants adversarial content that survives across turns \u2014 the persistent cousin of goal hijack, corrupting future reasoning.", "color": "#16a34a"}, {"id": "security/risks/rogue-agents.md", "title": "Rogue Agents", "type": "Security risk", "description": "Unauthorized or compromised agents operating outside governance and oversight.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Rogue agents are those running outside the sanctioned control plane \u2014 unregistered, compromised, or drifted beyond their mandate.", "color": "#16a34a"}, {"id": "security/risks/supply-chain-compromise.md", "title": "Agentic Supply Chain Compromise", "type": "Security risk", "description": "Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Supply chain compromise is the poisoning of what the agent depends on: a backdoored MCP server, a tampered model, a malicious package, or a spoofed tool.", "color": "#16a34a"}, {"id": "security/risks/tool-misuse.md", "title": "Tool Misuse & Exploitation", "type": "Security risk", "description": "The agent invokes tools in ways they were not intended or authorized for.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Tool misuse is when an agent is driven to call tools \u2014 or chain them \u2014 in ways outside their intended, authorized use, turning legitimate capabilities into an attack.", "color": "#16a34a"}, {"id": "security/risks/unexpected-code-execution.md", "title": "Unexpected Code Execution", "type": "Security risk", "description": "The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Unexpected code execution is when an agent runs attacker-controlled code \u2014 a growing risk as agents gain interpreters and code-mode tools.", "color": "#16a34a"}, {"id": "security/security.md", "title": "Security", "type": "Overview", "description": "How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 risks and the mitigations that contain them.", "tags": [], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agentic systems act with real tools and the user's own permissions, so their\nattack surface is the tool, identity, memory, and communication surface \u2014 not\njust the prompt. This area splits into **risks** (how agents are subverted) and\n**mitigations** (what keeps them inside a safe envelope \u2014 minimizing risk, never\nfully eliminating it). The reference model is the OWASP Top 10 for Agentic\nApplications (2026).\n\n# Risks (OWASP Agentic Top 10)\n\n- [Agent Goal Hijack](#node:security/risks/agent-goal-hijack.md)\n- [Tool Misuse & Exploitation](#node:security/risks/tool-misuse.md)\n- [Agent Identity & Privilege Abuse](#node:security/risks/identity-privilege-abuse.md)\n- [Agentic Supply Chain Compromise](#node:security/risks/supply-chain-compromise.md)\n- [Unexpected Code Execution](#node:security/risks/unexpected-code-execution.md)\n- [Memory & Context Poisoning](#node:security/risks/memory-context-poisoning.md)\n- [Insecure Inter-Agent Communication](#node:security/risks/insecure-inter-agent-communication.md)\n- [Cascading Agent Failures](#node:security/risks/cascading-agent-failures.md)\n- [Human-Agent Trust Exploitation](#node:security/risks/human-agent-trust-exploitation.md)\n- [Rogue Agents](#node:security/risks/rogue-agents.md)\n\n# Mitigations\n\n- [Guardrails](#node:security/mitigations/guardrails.md) \u2014 input/output/action policy enforcement around the model.\n- [PII Masking & Anonymization](#node:security/mitigations/pii-masking.md) \u2014 redacting or tokenizing personal data on the way in and out.\n\nMitigations are enforced in practice at the [LLM gateway](#node:enterprise/llm-gateway.md)\nand [MCP gateway](#node:enterprise/mcp-gateway.md), under a zero-trust posture: every\nagent action authenticated, authorized, least-privileged, and logged.\n\n# Resources\n\n- [OWASP Top 10 for Agentic Applications 2026](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)\n- [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)\n- [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)", "color": "#3b82f6"}, {"id": "tools/frontend-tools.md", "title": "Frontend Tools", "type": "Technique", "description": "Client-side tools executed in the frontend, typically for UI interactions \u2014 a newer, less standardized category.", "tags": [], "resource": "", "body": "Frontend [tools](#node:tools/tools.md) run on the client's frontend rather than its\nbackend, typically to drive UI interactions (rendering components, reading UI\nstate). It is a much newer and less standardized category than backend tools.\nExamples:\n\n- [Google's A2UI](https://a2ui.org)\n- [LangChain's headless tools](https://docs.langchain.com/oss/python/langchain/frontend/headless-tools)\n- [FastMCP's implementation of MCP apps](https://gofastmcp.com/apps/fastmcp-app)", "color": "#7c3aed"}, {"id": "tools/provider-tools.md", "title": "Provider-Side Tools", "type": "Technique", "description": "Tools defined and executed by the model provider \u2014 built-in web search, code execution \u2014 that clients just enable.", "tags": [], "resource": "", "body": "Provider-side [tools](#node:tools/tools.md) are defined and executed by the model\nprovider rather than the client \u2014 built-in capabilities like web search, code\nexecution, or computer use that a client simply enables in its API call. The\nprovider runs them and returns results inline, so the client never sees or hosts the implementation.", "color": "#7c3aed"}, {"id": "tools/tools.md", "title": "Tools", "type": "Overview", "description": "The primitive that turns an LLM into an agent \u2014 functions the model can call to act on and read from its environment.", "tags": [], "resource": "", "body": "Tools are the main thing needed to convert an LLM into a capable agent. Without\nthem, most agent actions would end after one turn; with them, agents can interact\nwith the environment, fetch new context to condition their output on, and perform\ncomplex tasks. They are like control statements in programming languages.\nAdditionally, tools are generic and can be used for almost any use case \u2014 ranging\nfrom direct actions like querying a database to meta operations like\n[workflow](#node:harness/workflows.md) orchestration or recursive\n[subagent](#node:harness/subagents.md) calling. Tools are exposed to models through\nprovider APIs and protocols like [MCP](#node:context/mcp.md).\n\n# Where tools run\n\nTools for LLMs can be generally organized by where they execute:\n\n- **Client-side tools** \u2014 executed by the client.\n  - **Backend tools** \u2014 executed on the client's backend; the majority of tools\n    fall into this category.\n  - **[Frontend tools](#node:tools/frontend-tools.md)** \u2014 executed on the client's\n    frontend, typically for UI interactions; a newer, less standardized category.\n- **[Provider-side tools](#node:tools/provider-tools.md)** \u2014 defined and executed by the\n  model provider (built-in web search, code execution, etc.); clients just enable\n  them in API calls.", "color": "#3b82f6"}], "edges": [{"source": "agents/agent.md", "target": "tools/tools.md"}, {"source": "agents/agent.md", "target": "harness/workflows.md"}, {"source": "agents/agent.md", "target": "context/memory.md"}, {"source": "agents/agent.md", "target": "harness/subagents.md"}, {"source": "agents/agent.md", "target": "harness/harness.md"}, {"source": "agents/agent.md", "target": "agents/deep-agents.md"}, {"source": "agents/antigravity.md", "target": "agents/agent.md"}, {"source": "agents/antigravity.md", "target": "harness/harness.md"}, {"source": "agents/claude-code.md", "target": "agents/agent.md"}, {"source": "agents/claude-code.md", "target": "harness/harness.md"}, {"source": "agents/codex.md", "target": "agents/agent.md"}, {"source": "agents/deep-agents.md", "target": "agents/agent.md"}, {"source": "agents/deep-agents.md", "target": "harness/subagents.md"}, {"source": "agents/deep-agents.md", "target": "context/memory.md"}, {"source": "agents/deep-agents.md", "target": "harness/workflows.md"}, {"source": "agents/deep-agents.md", "target": "harness/harness.md"}, {"source": "agents/devin.md", "target": "agents/agent.md"}, {"source": "agents/opencode.md", "target": "agents/agent.md"}, {"source": "agents/opencode.md", "target": "agents/claude-code.md"}, {"source": "ai-engineering.md", "target": "context/mcp.md"}, {"source": "ai-engineering.md", "target": "context/okf.md"}, {"source": "ai-engineering.md", "target": "context/rag.md"}, {"source": "ai-engineering.md", "target": "context/context-engineering.md"}, {"source": "ai-engineering.md", "target": "context/memory.md"}, {"source": "ai-engineering.md", "target": "tools/tools.md"}, {"source": "ai-engineering.md", "target": "tools/provider-tools.md"}, {"source": "ai-engineering.md", "target": "tools/frontend-tools.md"}, {"source": "ai-engineering.md", "target": "enterprise/llm-gateway.md"}, {"source": "ai-engineering.md", "target": "enterprise/mcp-gateway.md"}, {"source": "ai-engineering.md", "target": "agents/agent.md"}, {"source": "ai-engineering.md", "target": "agents/deep-agents.md"}, {"source": "ai-engineering.md", "target": "agents/claude-code.md"}, {"source": "ai-engineering.md", "target": "agents/opencode.md"}, {"source": "ai-engineering.md", "target": "agents/codex.md"}, {"source": "ai-engineering.md", "target": "agents/devin.md"}, {"source": "ai-engineering.md", "target": "agents/antigravity.md"}, {"source": "ai-engineering.md", "target": "harness/harness.md"}, {"source": "ai-engineering.md", "target": "harness/subagents.md"}, {"source": "ai-engineering.md", "target": "harness/workflows.md"}, {"source": "ai-engineering.md", "target": "observability/langsmith.md"}, {"source": "ai-engineering.md", "target": "observability/langfuse.md"}, {"source": "ai-engineering.md", "target": "observability/langsmith-evals.md"}, {"source": "ai-engineering.md", "target": "security/security.md"}, {"source": "context/context-engineering.md", "target": "tools/tools.md"}, {"source": "context/context-engineering.md", "target": "context/rag.md"}, {"source": "context/context-engineering.md", "target": "context/memory.md"}, {"source": "context/mcp.md", "target": "tools/tools.md"}, {"source": "context/mcp.md", "target": "agents/agent.md"}, {"source": "context/mcp.md", "target": "enterprise/mcp-gateway.md"}, {"source": "context/memory.md", "target": "security/risks/memory-context-poisoning.md"}, {"source": "context/okf.md", "target": "context/mcp.md"}, {"source": "context/rag.md", "target": "context/context-engineering.md"}, {"source": "enterprise/llm-gateway.md", "target": "enterprise/mcp-gateway.md"}, {"source": "enterprise/llm-gateway.md", "target": "security/mitigations/guardrails.md"}, {"source": "enterprise/mcp-gateway.md", "target": "context/mcp.md"}, {"source": "enterprise/mcp-gateway.md", "target": "security/mitigations/pii-masking.md"}, {"source": "enterprise/mcp-gateway.md", "target": "security/mitigations/guardrails.md"}, {"source": "enterprise/mcp-gateway.md", "target": "enterprise/llm-gateway.md"}, {"source": "enterprise/mcp-gateway.md", "target": "security/risks/identity-privilege-abuse.md"}, {"source": "harness/harness.md", "target": "agents/agent.md"}, {"source": "harness/harness.md", "target": "harness/workflows.md"}, {"source": "harness/harness.md", "target": "agents/deep-agents.md"}, {"source": "harness/subagents.md", "target": "security/risks/insecure-inter-agent-communication.md"}, {"source": "harness/workflows.md", "target": "agents/agent.md"}, {"source": "harness/workflows.md", "target": "harness/subagents.md"}, {"source": "harness/workflows.md", "target": "harness/harness.md"}, {"source": "harness/workflows.md", "target": "security/risks/unexpected-code-execution.md"}, {"source": "observability/langfuse.md", "target": "observability/langsmith.md"}, {"source": "observability/langsmith-evals.md", "target": "observability/langsmith.md"}, {"source": "observability/langsmith.md", "target": "observability/langsmith-evals.md"}, {"source": "observability/langsmith.md", "target": "observability/langfuse.md"}, {"source": "security/mitigations/guardrails.md", "target": "security/risks/agent-goal-hijack.md"}, {"source": "security/mitigations/guardrails.md", "target": "security/mitigations/pii-masking.md"}, {"source": "security/mitigations/guardrails.md", "target": "enterprise/mcp-gateway.md"}, {"source": "security/mitigations/pii-masking.md", "target": "security/mitigations/guardrails.md"}, {"source": "security/mitigations/pii-masking.md", "target": "enterprise/mcp-gateway.md"}, {"source": "security/security.md", "target": "security/risks/agent-goal-hijack.md"}, {"source": "security/security.md", "target": "security/risks/tool-misuse.md"}, {"source": "security/security.md", "target": "security/risks/identity-privilege-abuse.md"}, {"source": "security/security.md", "target": "security/risks/supply-chain-compromise.md"}, {"source": "security/security.md", "target": "security/risks/unexpected-code-execution.md"}, {"source": "security/security.md", "target": "security/risks/memory-context-poisoning.md"}, {"source": "security/security.md", "target": "security/risks/insecure-inter-agent-communication.md"}, {"source": "security/security.md", "target": "security/risks/cascading-agent-failures.md"}, {"source": "security/security.md", "target": "security/risks/human-agent-trust-exploitation.md"}, {"source": "security/security.md", "target": "security/risks/rogue-agents.md"}, {"source": "security/security.md", "target": "security/mitigations/guardrails.md"}, {"source": "security/security.md", "target": "security/mitigations/pii-masking.md"}, {"source": "security/security.md", "target": "enterprise/llm-gateway.md"}, {"source": "security/security.md", "target": "enterprise/mcp-gateway.md"}, {"source": "tools/frontend-tools.md", "target": "tools/tools.md"}, {"source": "tools/provider-tools.md", "target": "tools/tools.md" bservability/`, `evaluation/`, and `security/` \u2014 renamed the session-specific `meta/` to `context/` and moved every concept to its new home.\n* **Creation**: Adopted the [OWASP Agentic Top 10](#node:security/risks/agent-goal-hijack.md) as `security/threats/` (ASI01\u2013ASI10; the former Prompt Injection concept became [Agent Goal Hijack](#node:security/risks/agent-goal-hijack.md)); moved [Guardrails](#node:security/mitigations/guardrails.md) and [PII Masking](#node:security/mitigations/pii-masking.md) to `security/controls/`.\n* **Creation**: Scaffolded new concepts \u2014 [MCP Gateway](#node:enterprise/mcp-gateway.md), [deepagents](#node:agents/deep-agents.md), [Agent Harness](#node:harness/harness.md), [Workflows](#node:harness/workflows.md), [LangSmith](#node:observability/langsmith.md), [Langfuse](#node:observability/langfuse.md), and [LangSmith Evals](#node:observability/langsmith-evals.md) \u2014 frontmatter and cross-links complete, bodies to be filled in.\n* **Reorganization**: Moved the bundle into `.agents/skills/okf-ai-engineering/` and converted `README.md` to `SKILL.md` (added skill `name` and `description`), making the knowledge base a discoverable, distributable skill while keeping it a conformant OKF bundle.\n* **Update**: Filled the ASI02\u2013ASI10 threat bodies (enterprise framing + design considerations with cross-links). The vendor/tooling concepts (LangSmith, Langfuse, LangSmith Evals, deepagents, Agent Harness, Programmatic Tools, MCP Gateway) remain scaffolds pending domain input.\n\n## 2026-07-04\n\n* **Initialization**: Created the AI-engineering concept bundle \u2014 a cross-linked, vendor-neutral knowledge graph tuned to enterprise AI-platform work (platform + gateway + PII masker).\n* **Creation**: Added meta concept [Open Knowledge Format](#node:context/okf.md).\n* **Creation**: Added platform concepts [MCP](#node:context/mcp.md), [LLM Gateway](#node:enterprise/llm-gateway.md), and [Agent Architecture](#node:agents/agent.md).\n* **Creation**: Added security concepts [Prompt Injection](#node:security/risks/agent-goal-hijack.md), [Guardrails](#node:security/mitigations/guardrails.md), and [PII Masking & Anonymization](#node:security/mitigations/pii-masking.md).\n* **Creation**: Added lifecycle concepts AI Observability & Tracing and Evals & LLM-as-Judge (later removed; observability/evals now live as the vendor-tool concepts).\n* **Update**: Switched PDF citations to canonical source URLs (Anthropic, LangChain, OWASP) so the bundle stays pure markdown and portable; local PDFs are no longer bundle dependencies.\n* **Creation**: Added a root `SKILL.md` (`type: Overview`) as the knowledge-base landing page.\n* **Update**: Restyled every concept body to clearer sections \u2014 `In an enterprise platform` and `Design considerations` \u2014 replacing the ambiguous \"Why it matters\" / \"Key decisions\" headings.\n", "index": "# Overview\n\n* [Agent](#node:agents/agent.md) - The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.\n* [Agent Harness](#node:harness/harness.md) - The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.\n* [AI Engineering](#node:ai-engineering.md) - Personal knowledge base for AI engineering concepts.\n* [Security](#node:security/security.md) - How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 risks and the mitigations that contain them.\n* [Tools](#node:tools/tools.md) - The primitive that turns an LLM into an agent \u2014 functions the model can call to act on and read from its environment.\n\n# Product\n\n* [Antigravity](#node:agents/antigravity.md) - Google's agent-first development platform built on Gemini \u2014 an IDE, desktop app, and CLI sharing one agent harness.\n* [Claude Code](#node:agents/claude-code.md) - Anthropic's coding agent \u2014 Claude in a loop with file, shell, and code tools, available as CLI, IDE extension, and SDK.\n* [Codex](#node:agents/codex.md) - OpenAI's coding agent \u2014 an open-source terminal CLI plus cloud environments, powered by OpenAI's coding models.\n* [Deep Agents](#node:agents/deep-agents.md) - Opinionated LangChain package for high level agent patterns.\n* [Devin](#node:agents/devin.md) - Cognition's autonomous AI software engineer \u2014 a cloud agent that executes coding tasks end-to-end in its own sandbox.\n* [Langfuse](#node:observability/langfuse.md) - Open-source LLM observability and tracing, OpenTelemetry-friendly.\n* [LangSmith](#node:observability/langsmith.md) - LangChain's tracing and evaluation platform for LLM/agent observability.\n* [LangSmith Evals](#node:observability/langsmith-evals.md) - Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.\n* [OpenCode](#node:agents/opencode.md) - Open-source, terminal-native, model-agnostic coding agent \u2014 a vendor-neutral alternative to Claude Code.\n\n# Security risk\n\n* [Agent Goal Hijack](#node:security/risks/agent-goal-hijack.md) - Adversarial input redirects the agent's plan or objective \u2014 OWASP's #1 agentic risk, prompt injection being the primary mechanism.\n* [Agent Identity & Privilege Abuse](#node:security/risks/identity-privilege-abuse.md) - The agent's identity or permissions are misused, impersonated, or escalated.\n* [Agentic Supply Chain Compromise](#node:security/risks/supply-chain-compromise.md) - Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.\n* [Cascading Agent Failures](#node:security/risks/cascading-agent-failures.md) - A local failure or compromise propagates across agents and tools into a systemic failure.\n* [Human-Agent Trust Exploitation](#node:security/risks/human-agent-trust-exploitation.md) - The agent is used to manipulate the human, or humans over-trust the agent's output.\n* [Insecure Inter-Agent Communication](#node:security/risks/insecure-inter-agent-communication.md) - Trust, spoofing, or tampering weaknesses in messaging between agents.\n* [Memory & Context Poisoning](#node:security/risks/memory-context-poisoning.md) - Malicious content persists in the agent's memory or context and influences later decisions.\n* [Rogue Agents](#node:security/risks/rogue-agents.md) - Unauthorized or compromised agents operating outside governance and oversight.\n* [Tool Misuse & Exploitation](#node:security/risks/tool-misuse.md) - The agent invokes tools in ways they were not intended or authorized for.\n* [Unexpected Code Execution](#node:security/risks/unexpected-code-execution.md) - The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.\n\n# Standard\n\n* [Agent Client Protocol](#node:agents/ACP.md) - ACP standardizes communication between code editors/IDEs and coding agents.\n* [Agent2Agent](#node:agents/A2A.md) - An open protocol enabling communication and interoperability between opaque agentic applications.\n* [Model Context Protocol (MCP)](#node:context/mcp.md) - Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.\n* [Open Knowledge Format (OKF)](#node:context/okf.md) - Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.\n\n# Technique\n\n* [Context Engineering](#node:context/context-engineering.md) - Deliberately assembling what goes into the model's context window \u2014 instructions, tools, retrieved data, memory, and history.\n* [Frontend Tools](#node:tools/frontend-tools.md) - Client-side tools executed in the frontend, typically for UI interactions \u2014 a newer, less standardized category.\n* [Guardrails](#node:security/mitigations/guardrails.md) - Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.\n* [LLM Gateway](#node:enterprise/llm-gateway.md) - A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.\n* [MCP Gateway](#node:enterprise/mcp-gateway.md) - An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.\n* [Memory](#node:context/memory.md) - How an agent carries state across steps and sessions \u2014 short-term context plus durable long-term stores.\n* [PII Masking & Anonymization](#node:security/mitigations/pii-masking.md) - Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.\n* [Provider-Side Tools](#node:tools/provider-tools.md) - Tools defined and executed by the model provider \u2014 built-in web search, code execution \u2014 that clients just enable.\n* [RAG](#node:context/rag.md) - Retrieval-augmented generation \u2014 fetching relevant documents at query time and adding them to the model's context.\n* [Subagents](#node:harness/subagents.md) - Delegating focused subtasks to separate agent instances, and orchestrating multiple agents together.\n* [Workflows](#node:harness/workflows.md) - Workflows let an agent orchestrate its tool calls programmatically \u2014 scripted tool use for lower token cost and long-running tasks."};
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const main = document.getElementById('main');
const doc = document.getElementById('doc');
const caption = document.getElementById('graph-caption');

/* ---------- graph ---------- */
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [
    ...DATA.nodes.map(n => ({ data: { id: n.id, label: n.title, color: n.color } })),
    ...DATA.edges.map(e => ({ data: { id: e.source + '->' + e.target, source: e.source, target: e.target } })),
  ],
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'label': 'data(label)', 'color': '#1f2328',
        'font-size': '8px', 'text-wrap': 'wrap', 'text-max-width': '80px',
        'text-valign': 'bottom', 'text-margin-y': 3, 'width': 15, 'height': 15,
        'border-width': 1.5, 'border-color': '#ffffff' } },
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#c8d1da', 'target-arrow-color': '#c8d1da',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .7 } },
    { selector: 'node.sel', style: { 'border-color': '#0969da', 'border-width': 3, 'font-size': '10px', 'font-weight': 'bold', 'width': 20, 'height': 20 } },
    { selector: '.faded', style: { 'opacity': .12 } },
    { selector: 'node.hidden', style: { 'display': 'none' } },
  ],
  wheelSensitivity: 0.2,
});

function graphLayout() {
  return { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true,
           idealEdgeLength: 150, nodeRepulsion: 22000, nodeOverlap: 60,
           gravity: 0.2, componentSpacing: 160, numIter: 1500, padding: 40 };
}

// Run the force layout, then a deterministic pass that pushes any still-
// overlapping nodes apart using their label-inclusive bounding boxes, so labels
// never sit on top of each other regardless of the force layout's result.
function runLayout() {
  const layout = cy.layout(graphLayout());
  layout.one('layoutstop', () => requestAnimationFrame(() => separateOverlaps()));
  layout.run();
}

function separateOverlaps(iterations = 80, pad = 10) {
  const nodes = cy.nodes();
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ba = a.boundingBox({ includeLabels: true });
        const bb = b.boundingBox({ includeLabels: true });
        const overlapX = Math.min(ba.x2, bb.x2) - Math.max(ba.x1, bb.x1) + pad;
        const overlapY = Math.min(ba.y2, bb.y2) - Math.max(ba.y1, bb.y1) + pad;
        if (overlapX > 0 && overlapY > 0) {
          let dx = (ba.x1 + ba.x2) / 2 - (bb.x1 + bb.x2) / 2;
          let dy = (ba.y1 + ba.y2) / 2 - (bb.y1 + bb.y2) / 2;
          const dist = Math.hypot(dx, dy) || 0.01;
          const push = Math.min(overlapX, overlapY) / 2;
          dx /= dist; dy /= dist;
          a.position({ x: a.position('x') + dx * push, y: a.position('y') + dy * push });
          b.position({ x: b.position('x') - dx * push, y: b.position('y') - dy * push });
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  cy.fit(undefined, 30);
}

cy.on('tap', 'node', ev => {
  // Clicking the already-selected node toggles the selection off.
  if (ev.target.hasClass('sel')) clearHighlight(); else openConcept(ev.target.id());
});
cy.on('tap', 'edge', ev => openEdgeLink(ev.target.id()));           // open the source doc at the link that made this edge
cy.on('tap', ev => { if (ev.target === cy) clearHighlight(); });    // click empty space = deselect node, keep the doc open
document.getElementById('graph').addEventListener('dblclick', () => {  // double-click anywhere = reset zoom to fit all
  cy.animate({ fit: { eles: cy.elements(), padding: 30 } }, { duration: 300 });
});

let activeType = null;

// Reflect the active type (if any) onto the legend chips and the nav tree.
function paintTypeState() {
  document.querySelectorAll('#legend .legend-item').forEach(el =>
    el.classList.toggle('active', el.dataset.type === activeType));
  document.querySelectorAll('#nav a[data-id]').forEach(a =>
    a.classList.toggle('typematch', !!activeType && byId[a.dataset.id].type === activeType));
}

function highlight(id) {
  const node = cy.getElementById(id);
  activeType = null;
  cy.elements().addClass('faded');
  cy.nodes().removeClass('sel');
  const near = node.closedNeighborhood();
  near.removeClass('faded');
  node.addClass('sel');
  paintTypeState();
  caption.textContent = node.data('label') + ' — ' + node.connectedEdges().length + ' links';
}

// Highlight every concept of one type across the graph and the nav tree.
function highlightType(type) {
  activeType = type;
  cy.nodes().removeClass('sel');
  cy.elements().addClass('faded');
  const matching = cy.nodes().filter(n => byId[n.id()].type === type);
  matching.removeClass('faded');
  paintTypeState();
  caption.textContent = type + ' — ' + matching.length + ' concepts';
}

function clearHighlight() {
  activeType = null;
  cy.elements().removeClass('faded');
  cy.nodes().removeClass('sel');
  paintTypeState();
  caption.textContent = cy.nodes().length + ' concepts · ' + cy.edges().length + ' links';
}

function relayout() {
  // Only resize/refit on view changes — never re-run the force layout, which
  // would reshuffle node positions and make the graph jump on every click.
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

function focusOn(id) {
  // Zoom and recenter to the selected node plus its immediate links, instead of
  // refitting the entire graph.
  const node = cy.getElementById(id);
  requestAnimationFrame(() => {
    cy.resize();
    if (node.nonempty()) cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 60 } }, { duration: 300 });
    else cy.fit(undefined, 30);
  });
}

/* ---------- reader ---------- */
// Wire a rendered markdown container: in-bundle links navigate the graph,
// external links open in a new tab.
function wireDocLinks(container) {
  container.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  container.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

function renderDoc(markdown) {
  doc.innerHTML = marked.parse(markdown);
  wireDocLinks(doc);
  doc.scrollTop = 0;
}

function openConcept(id) {
  const n = byId[id];
  if (!n) return;
  main.classList.remove('graph-only');
  const resourceHtml = n.resource
    ? `<span class="resource">🔗 <a href="${escapeAttr(n.resource)}" title="${escapeAttr(n.resource)}" target="_blank" rel="noopener">${escapeHtml(n.resource)}</a></span>` : '';
  const tagsHtml = (n.tags && n.tags.length)
    ? `<span class="tags-inline">${n.tags.map(t => `<code>${escapeHtml(t)}</code>`).join('')}</span>` : '';
  const summaryHtml = n.description ? `<p class="summary">${escapeHtml(n.description)}</p>` : '';
  doc.innerHTML =
    `<h1>${escapeHtml(n.title)}</h1>` +
    `<div class="meta">` +
      resourceHtml +
      `<span class="meta-right">${tagsHtml}` +
        `<span class="badge" style="background:${n.color}">${escapeHtml(n.type)}</span>` +
      `</span>` +
    `</div>` + summaryHtml;
  const bodyHtml = document.createElement('div');
  bodyHtml.className = 'prose';
  bodyHtml.innerHTML = marked.parse(n.body);
  doc.appendChild(bodyHtml);
  wireDocLinks(bodyHtml);
  doc.scrollTop = 0;
  setActiveNav(id);
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  highlight(id);
  focusOn(id);
}

function openIndex() {
  // The bundle-root index.md is the landing page: catalog in the reader, whole graph.
  main.classList.remove('graph-only');
  const body = document.createElement('div');
  body.className = 'prose';
  body.innerHTML = DATA.index ? marked.parse(DATA.index) : '';
  doc.innerHTML = '';
  doc.appendChild(body);
  wireDocLinks(body);
  doc.scrollTop = 0;
  setActiveNav('index');
  clearHighlight();
  history.replaceState(null, '', '#index');
  relayout();
}

function openEdgeLink(edgeId) {
  // Open the edge's source concept and scroll to / flash the specific link in
  // its markdown that produced this edge.
  const sep = edgeId.indexOf('->');
  const source = edgeId.slice(0, sep), target = edgeId.slice(sep + 2);
  openConcept(source);
  const link = doc.querySelector(`a[href="#node:${target}"]`);
  if (link) {
    link.scrollIntoView({ behavior: 'smooth', block: 'center' });
    link.classList.add('flash');
    setTimeout(() => link.classList.remove('flash'), 1600);
  }
}

function openLog() {
  if (!DATA.log) return;
  main.classList.remove('graph-only');
  renderDoc(DATA.log);
  setActiveNav('log');
  clearHighlight();
  history.replaceState(null, '', '#log');
  relayout();
}

function showGraphOnly() {
  main.classList.add('graph-only');
  setActiveNav(null);
  clearHighlight();
  history.replaceState(null, '', location.pathname);
  relayout();
}

/* ---------- sidebar tree ---------- */
function buildTree(nodes) {
  const root = { dirs: {}, files: [] };
  nodes.forEach(n => {
    const parts = n.id.split('/');
    let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
      cur = cur.dirs[parts[i]];
    }
    cur.files.push(n);
  });
  return root;
}

function renderTree(tree) {
  const ul = document.createElement('ul');
  // Concept pages first, then subdirectories (so a directory's own overview sits
  // above its children).
  tree.files.sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(n.id);
    a.dataset.id = n.id;
    a.innerHTML = `<span class="dot" style="background:${n.color}"></span><span>${escapeHtml(n.title)}</span>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(n.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
  Object.keys(tree.dirs).sort().forEach(name => {
    const li = document.createElement('li');
    li.className = 'dir';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name.replace(/[-_]/g, ' ');
    li.appendChild(label);
    li.appendChild(renderTree(tree.dirs[name]));
    ul.appendChild(li);
  });
  return ul;
}

function setActiveNav(id) {
  document.querySelectorAll('#nav a, #loglink a').forEach(a => a.classList.remove('active'));
  if (id === 'log') { const l = document.querySelector('#loglink a'); l && l.classList.add('active'); return; }
  if (id === 'index') { const h = document.querySelector('#nav a.homelink'); h && h.classList.add('active'); return; }
  if (!id) return;
  const a = document.querySelector(`#nav a[data-id="${cssEscape(id)}"]`);
  a && a.classList.add('active');
}

const nav = document.getElementById('nav');
if (DATA.index) {
  const home = document.createElement('a');
  home.href = '#index';
  home.className = 'homelink';
  home.innerHTML = '🏠 <span>Index</span>';
  home.addEventListener('click', ev => { ev.preventDefault(); openIndex(); });
  nav.appendChild(home);
}
nav.appendChild(renderTree(buildTree(DATA.nodes)));
if (DATA.log) {
  const link = document.createElement('a');
  link.href = '#log';
  link.innerHTML = '📓 <span>Change log</span>';
  link.addEventListener('click', ev => { ev.preventDefault(); openLog(); });
  document.getElementById('loglink').appendChild(link);
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  DATA.nodes.forEach(n => {
    const hay = (n.title + ' ' + n.description + ' ' + n.type + ' ' + n.tags.join(' ')).toLowerCase();
    const hit = !q || hay.includes(q);
    const navA = document.querySelector(`#nav a[data-id="${cssEscape(n.id)}"]`);
    navA && navA.classList.toggle('hidden', !hit);
    if (main.classList.contains('graph-only')) cy.getElementById(n.id).toggleClass('faded', !!q && !hit);
  });
});

/* ---------- legend ---------- */
function buildLegend() {
  const legend = document.getElementById('legend');
  const title = document.createElement('span');
  title.className = 'legend-title';
  title.textContent = 'Types';
  legend.appendChild(title);
  DATA.types.forEach(t => {
    const item = document.createElement('button');
    item.className = 'legend-item';
    item.dataset.type = t.name;
    item.innerHTML = `<span class="sw" style="background:${t.color}"></span>${escapeHtml(t.name)}`;
    item.addEventListener('click', () => {
      if (activeType === t.name) clearHighlight(); else highlightType(t.name);
    });
    legend.appendChild(item);
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&'); }

/* ---------- initial state ---------- */
runLayout();
buildLegend();
clearHighlight();
const start = decodeURIComponent(location.hash.slice(1));
if (start === 'log') openLog();
else if (byId[start]) openConcept(start);
else if (DATA.index) openIndex();
else showGraphOnly();
</script>
</body>
</html>
