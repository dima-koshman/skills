o `security/controls/`.\n* **Creation**: Scaffolded new concepts \u2014 [MCP Gateway](#node:enterprise/mcp-gateway.md), [deepagents](#node:agents/deep-agents.md), [Agent Harness](#node:harness/harness.md), [Workflows](#node:harness/workflows.md), [LangSmith](#node:observability/langsmith.md), [Langfuse](#node:observability/langfuse.md), and [LangSmith Evals](#node:observability/langsmith-evals.md) \u2014 frontmatter and cross-links complete, bodies to be filled in.\n* **Reorganization**: Moved the bundle into `.agents/skills/okf-ai-engineering/` and converted `README.md` to `SKILL.md` (added skill `name` and `description`), making the knowledge base a discoverable, distributable skill while keeping it a conformant OKF bundle.\n* **Update**: Filled the ASI02\u2013ASI10 threat bodies (enterprise framing + design considerations with cross-links). The vendor/tooling concepts (LangSmith, Langfuse, LangSmith Evals, deepagents, Agent Harness, Programmatic Tools, MCP Gateway) remain scaffolds pending domain input.\n\n## 2026-07-04\n\n* **Initialization**: Created the AI-engineering concept bundle \u2014 a cross-linked, vendor-neutral knowledge graph tuned to enterprise AI-platform work (platform + gateway + PII masker).\n* **Creation**: Added meta concept [Open Knowledge Format](#node:context/okf.md).\n* **Creation**: Added platform concepts [MCP](#node:context/mcp.md), [LLM Gateway](#node:enterprise/llm-gateway.md), and [Agent Architecture](#node:agents/agent.md).\n* **Creation**: Added security concepts [Prompt Injection](#node:security/risks/agent-goal-hijack.md), [Guardrails](#node:security/mitigations/guardrails.md), and [PII Masking & Anonymization](#node:security/mitigations/pii-masking.md).\n* **Creation**: Added lifecycle concepts AI Observability & Tracing and Evals & LLM-as-Judge (later removed; observability/evals now live as the vendor-tool concepts).\n* **Update**: Switched PDF citations to canonical source URLs (Anthropic, LangChain, OWASP) so the bundle stays pure markdown and portable; local PDFs are no longer bundle dependencies.\n* **Creation**: Added a root `SKILL.md` (`type: Overview`) as the knowledge-base landing page.\n* **Update**: Restyled every concept body to clearer sections \u2014 `In an enterprise platform` and `Design considerations` \u2014 replacing the ambiguous \"Why it matters\" / \"Key decisions\" headings.\n", "index": "* [AI Engineering](#node:ai-engineering.md) `[Overview]` - Personal knowledge base for AI engineering concepts.\n\n# agents\n\n* [Agent](#node:agents/agent.md) `[Overview]` - The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.\n* [Agent Client Protocol](#node:agents/ACP.md) `[Standard]` - ACP standardizes communication between code editors/IDEs and coding agents.\n* [Agent2Agent](#node:agents/A2A.md) `[Standard]` - An protocol designed by Google enabling communication and interoperability between opaque agentic applications.\n* [Antigravity](#node:agents/antigravity.md) `[Product]` - Google's agent-first development platform built on Gemini \u2014 an IDE, desktop app, and CLI sharing one agent harness.\n* [Claude Code](#node:agents/claude-code.md) `[Product]` - Anthropic's coding agent \u2014 Claude in a loop with file, shell, and code tools, available as CLI, IDE extension, and SDK.\n* [Codex](#node:agents/codex.md) `[Product]` - OpenAI's coding agent \u2014 an open-source terminal CLI plus cloud environments, powered by OpenAI's coding models.\n* [Deep Agents](#node:agents/deep-agents.md) `[Product]` - Opinionated LangChain package for high level agent patterns.\n* [Devin](#node:agents/devin.md) `[Product]` - Cognition's autonomous AI software engineer \u2014 a cloud agent that executes coding tasks end-to-end in its own sandbox.\n* [OpenCode](#node:agents/opencode.md) `[Product]` - Open-source, terminal-native, model-agnostic coding agent \u2014 a vendor-neutral alternative to Claude Code.\n* [Peer Agents](#node:agents/peer-agents.md) `[Technique]` - Independently governed agents that own goals and coordinate as peers rather than through a permanent parent.\n\n# context\n\n* [Context Engineering](#node:context/context-engineering.md) `[Technique]` - Deliberately assembling what goes into the model's context window \u2014 instructions, tools, retrieved data, memory, and history.\n* [Memory](#node:context/memory.md) `[Technique]` - How an agent carries state across steps and sessions \u2014 short-term context plus durable long-term stores.\n* [Model Context Protocol (MCP)](#node:context/mcp.md) `[Standard]` - Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.\n* [Open Knowledge Format (OKF)](#node:context/okf.md) `[Standard]` - Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.\n* [OpenWiki](#node:context/openwiki.md) `[Product]` - LangChain's early-stage CLI for generating and maintaining agent-facing Markdown wikis from local knowledge sources.\n* [RAG](#node:context/rag.md) `[Technique]` - Retrieval-augmented generation \u2014 fetching relevant documents at query time and adding them to the model's context.\n\n# development\n\n* [Observability-Driven AI-Assisted Development](#node:development/observability-driven-development.md) `[Technique]` - A development loop where AI agents use real runtime telemetry as evidence for diagnosis, remediation, and verification.\n\n# enterprise\n\n* [LLM Gateway](#node:enterprise/llm-gateway.md) `[Technique]` - A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.\n* [MCP Gateway](#node:enterprise/mcp-gateway.md) `[Technique]` - An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.\n\n# harness\n\n* [Agent Harness](#node:harness/harness.md) `[Overview]` - The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.\n* [Frontend Tools](#node:harness/frontend-tools.md) `[Technique]` - Client-side tools executed in the frontend, typically for UI interactions \u2014 a newer, less standardized category.\n* [Provider-Side Tools](#node:harness/provider-tools.md) `[Technique]` - Tools defined and executed by the model provider \u2014 built-in web search, code execution \u2014 that clients just enable.\n* [Subagents](#node:harness/subagents.md) `[Technique]` - Delegating focused subtasks to separate agent instances, and orchestrating multiple agents together.\n* [Tools](#node:harness/tools.md) `[Overview]` - The primitive that turns an LLM into an agent \u2014 functions the model can call to act on and read from its environment.\n* [Workflows](#node:harness/workflows.md) `[Technique]` - Workflows let an agent orchestrate its tool calls programmatically \u2014 scripted tool use for lower token cost and long-running tasks.\n\n# observability\n\n* [Langfuse](#node:observability/langfuse.md) `[Product]` - Open-source LLM observability and tracing, OpenTelemetry-friendly.\n* [LangSmith](#node:observability/langsmith.md) `[Product]` - LangChain's tracing and evaluation platform for LLM/agent observability.\n* [LangSmith Evals](#node:observability/langsmith-evals.md) `[Product]` - Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.\n\n# providers\n\n* [Claude](#node:providers/claude.md) `[Product]` - Anthropic Claude API token pricing and prompt-caching mechanics \u2014 cache multipliers, TTLs, and cost-optimization guidance.\n* [Gemini](#node:providers/gemini.md) `[Product]` - Google Gemini API token pricing plus implicit and explicit context caching, with break-even guidance.\n* [GPT](#node:providers/gpt.md) `[Product]` - OpenAI GPT API token pricing and prompt caching \u2014 the 272K long-context cliff, cache-write fees, and keep-alive economics.\n* [LLM Leaderboards](#node:providers/leaderboards.md) `[Overview]` - A curated bookmark set and benchmark map for choosing reliable, independent LLM evaluation sources across capabilities.\n\n# security\n\n* [Security](#node:security/security.md) `[Overview]` - How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 risks and the mitigations that contain them.\n\n## mitigations\n\n* [Guardrails](#node:security/mitigations/guardrails.md) `[Technique]` - Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.\n* [PII Masking & Anonymization](#node:security/mitigations/pii-masking.md) `[Technique]` - Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.\n\n## risks\n\n* [Agent Goal Hijack](#node:security/risks/agent-goal-hijack.md) `[Security risk]` - Adversarial input redirects the agent's plan or objective \u2014 OWASP's #1 agentic risk, prompt injection being the primary mechanism.\n* [Agent Identity & Privilege Abuse](#node:security/risks/identity-privilege-abuse.md) `[Security risk]` - The agent's identity or permissions are misused, impersonated, or escalated.\n* [Agentic Supply Chain Compromise](#node:security/risks/supply-chain-compromise.md) `[Security risk]` - Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.\n* [Cascading Agent Failures](#node:security/risks/cascading-agent-failures.md) `[Security risk]` - A local failure or compromise propagates across agents and tools into a systemic failure.\n* [Human-Agent Trust Exploitation](#node:security/risks/human-agent-trust-exploitation.md) `[Security risk]` - The agent is used to manipulate the human, or humans over-trust the agent's output.\n* [Insecure Inter-Agent Communication](#node:security/risks/insecure-inter-agent-communication.md) `[Security risk]` - Trust, spoofing, or tampering weaknesses in messaging between agents.\n* [Memory & Context Poisoning](#node:security/risks/memory-context-poisoning.md) `[Security risk]` - Malicious content persists in the agent's memory or context and influences later decisions.\n* [Rogue Agents](#node:security/risks/rogue-agents.md) `[Security risk]` - Unauthorized or compromised agents operating outside governance and oversight.\n* [Tool Misuse & Exploitation](#node:security/risks/tool-misuse.md) `[Security risk]` - The agent invokes tools in ways they were not intended or authorized for.\n* [Unexpected Code Execution](#node:security/risks/unexpected-code-execution.md) `[Security risk]` - The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path."};
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const main = document.getElementById('main');
const doc = document.getElementById('doc');
const caption = document.getElementById('graph-caption');
const navToggle = document.getElementById('nav-toggle');
const graphToggle = document.getElementById('graph-toggle');

function closeMobilePanels() {
  document.body.classList.remove('nav-open');
  main.classList.remove('mobile-graph');
  navToggle.setAttribute('aria-expanded', 'false');
  graphToggle.setAttribute('aria-expanded', 'false');
}

navToggle.addEventListener('click', () => {
  const willOpen = !document.body.classList.contains('nav-open');
  closeMobilePanels();
  document.body.classList.toggle('nav-open', willOpen);
  navToggle.setAttribute('aria-expanded', String(willOpen));
});

graphToggle.addEventListener('click', () => {
  const willOpen = !main.classList.contains('mobile-graph');
  closeMobilePanels();
  main.classList.toggle('mobile-graph', willOpen);
  graphToggle.setAttribute('aria-expanded', String(willOpen));
  if (willOpen) relayout();
});

/* ---------- graph ---------- */
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [
    ...DATA.nodes.map(n => ({ data: { id: n.id, label: n.title, color: n.color } })),
    ...DATA.edges.map(e => ({ data: { id: e.source + '->' + e.target, source: e.source, target: e.target } })),
  ],
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'label': 'data(label)', 'color': '#1f2328',
        'font-size': '8px', 'text-wrap': 'wrap', 'text-max-width': '80px',
        'text-valign': 'bottom', 'text-margin-y': 3, 'width': 15, 'height': 15,
        'border-width': 1.5, 'border-color': '#ffffff' } },
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#c8d1da', 'target-arrow-color': '#c8d1da',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .7 } },
    { selector: 'node.sel', style: { 'border-color': '#0969da', 'border-width': 3, 'font-size': '10px', 'font-weight': 'bold', 'width': 20, 'height': 20 } },
    { selector: '.faded', style: { 'opacity': .12 } },
    { selector: 'node.hidden', style: { 'display': 'none' } },
  ],
  wheelSensitivity: 0.2,
});

function graphLayout() {
  return { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true,
           idealEdgeLength: 150, nodeRepulsion: 22000, nodeOverlap: 60,
           gravity: 0.2, componentSpacing: 160, numIter: 1500, padding: 40 };
}

// Run the force layout, then a deterministic pass that pushes any still-
// overlapping nodes apart using their label-inclusive bounding boxes, so labels
// never sit on top of each other regardless of the force layout's result.
function runLayout() {
  const layout = cy.layout(graphLayout());
  layout.one('layoutstop', () => requestAnimationFrame(() => separateOverlaps()));
  layout.run();
}

function separateOverlaps(iterations = 80, pad = 10) {
  const nodes = cy.nodes();
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ba = a.boundingBox({ includeLabels: true });
        const bb = b.boundingBox({ includeLabels: true });
        const overlapX = Math.min(ba.x2, bb.x2) - Math.max(ba.x1, bb.x1) + pad;
        const overlapY = Math.min(ba.y2, bb.y2) - Math.max(ba.y1, bb.y1) + pad;
        if (overlapX > 0 && overlapY > 0) {
          let dx = (ba.x1 + ba.x2) / 2 - (bb.x1 + bb.x2) / 2;
          let dy = (ba.y1 + ba.y2) / 2 - (bb.y1 + bb.y2) / 2;
          const dist = Math.hypot(dx, dy) || 0.01;
          const push = Math.min(overlapX, overlapY) / 2;
          dx /= dist; dy /= dist;
          a.position({ x: a.position('x') + dx * push, y: a.position('y') + dy * push });
          b.position({ x: b.position('x') - dx * push, y: b.position('y') - dy * push });
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  cy.fit(undefined, 30);
}

cy.on('tap', 'node', ev => {
  // Clicking the already-selected node toggles the selection off.
  if (ev.target.hasClass('sel')) clearHighlight(); else openConcept(ev.target.id());
});
cy.on('tap', 'edge', ev => openEdgeLink(ev.target.id()));           // open the source doc at the link that made this edge
cy.on('tap', ev => { if (ev.target === cy) clearHighlight(); });    // click empty space = deselect node, keep the doc open
document.getElementById('graph').addEventListener('dblclick', () => {  // double-click anywhere = reset zoom to fit all
  cy.animate({ fit: { eles: cy.elements(), padding: 30 } }, { duration: 300 });
});

let activeType = null;

// Reflect the active type (if any) onto the legend chips and the nav tree.
function paintTypeState() {
  document.querySelectorAll('#legend .legend-item').forEach(el =>
    el.classList.toggle('active', el.dataset.type === activeType));
  document.querySelectorAll('#nav a[data-id]').forEach(a =>
    a.classList.toggle('typematch', !!activeType && byId[a.dataset.id].type === activeType));
}

function highlight(id) {
  const node = cy.getElementById(id);
  activeType = null;
  cy.elements().addClass('faded');
  cy.nodes().removeClass('sel');
  const near = node.closedNeighborhood();
  near.removeClass('faded');
  node.addClass('sel');
  paintTypeState();
  caption.textContent = node.data('label') + ' — ' + node.connectedEdges().length + ' links';
}

// Highlight every concept of one type across the graph and the nav tree.
function highlightType(type) {
  activeType = type;
  cy.nodes().removeClass('sel');
  cy.elements().addClass('faded');
  const matching = cy.nodes().filter(n => byId[n.id()].type === type);
  matching.removeClass('faded');
  paintTypeState();
  caption.textContent = type + ' — ' + matching.length + ' concepts';
}

function clearHighlight() {
  activeType = null;
  cy.elements().removeClass('faded');
  cy.nodes().removeClass('sel');
  paintTypeState();
  caption.textContent = cy.nodes().length + ' concepts · ' + cy.edges().length + ' links';
}

function relayout() {
  // Only resize/refit on view changes — never re-run the force layout, which
  // would reshuffle node positions and make the graph jump on every click.
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

function focusOn(id) {
  // Zoom and recenter to the selected node plus its immediate links, instead of
  // refitting the entire graph.
  const node = cy.getElementById(id);
  requestAnimationFrame(() => {
    cy.resize();
    if (node.nonempty()) cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 60 } }, { duration: 300 });
    else cy.fit(undefined, 30);
  });
}

/* ---------- reader ---------- */
// Wire a rendered markdown container: in-bundle links navigate the graph,
// external links open in a new tab.
function wireDocLinks(container) {
  container.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  container.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

function renderDoc(markdown) {
  doc.innerHTML = marked.parse(markdown);
  wireDocLinks(doc);
  doc.scrollTop = 0;
}

function openConcept(id) {
  const n = byId[id];
  if (!n) return;
  closeMobilePanels();
  main.classList.remove('graph-only');
  const resourceHtml = n.resource
    ? `<span class="resource">🔗 <a href="${escapeAttr(n.resource)}" title="${escapeAttr(n.resource)}" target="_blank" rel="noopener">${escapeHtml(n.resource)}</a></span>` : '';
  const tagsHtml = (n.tags && n.tags.length)
    ? `<span class="tags-inline">${n.tags.map(t => `<code>${escapeHtml(t)}</code>`).join('')}</span>` : '';
  const summaryHtml = n.description ? `<p class="summary">${escapeHtml(n.description)}</p>` : '';
  doc.innerHTML =
    `<h1>${escapeHtml(n.title)}</h1>` +
    `<div class="meta">` +
      resourceHtml +
      `<span class="meta-right">${tagsHtml}` +
        `<span class="badge" style="background:${n.color}">${escapeHtml(n.type)}</span>` +
      `</span>` +
    `</div>` + summaryHtml;
  const bodyHtml = document.createElement('div');
  bodyHtml.className = 'prose';
  bodyHtml.innerHTML = marked.parse(n.body);
  doc.appendChild(bodyHtml);
  wireDocLinks(bodyHtml);
  doc.scrollTop = 0;
  setActiveNav(id);
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  highlight(id);
  focusOn(id);
}

function openIndex() {
  // The bundle-root index.md is the landing page: catalog in the reader, whole graph.
  closeMobilePanels();
  main.classList.remove('graph-only');
  const body = document.createElement('div');
  body.className = 'prose';
  body.innerHTML = DATA.index ? marked.parse(DATA.index) : '';
  doc.innerHTML = '';
  doc.appendChild(body);
  wireDocLinks(body);
  doc.scrollTop = 0;
  setActiveNav('index');
  clearHighlight();
  history.replaceState(null, '', '#index');
  relayout();
}

function openEdgeLink(edgeId) {
  // Open the edge's source concept and scroll to / flash the specific link in
  // its markdown that produced this edge.
  const sep = edgeId.indexOf('->');
  const source = edgeId.slice(0, sep), target = edgeId.slice(sep + 2);
  openConcept(source);
  const link = doc.querySelector(`a[href="#node:${target}"]`);
  if (link) {
    link.scrollIntoView({ behavior: 'smooth', block: 'center' });
    link.classList.add('flash');
    setTimeout(() => link.classList.remove('flash'), 1600);
  }
}

function openLog() {
  if (!DATA.log) return;
  closeMobilePanels();
  main.classList.remove('graph-only');
  renderDoc(DATA.log);
  setActiveNav('log');
  clearHighlight();
  history.replaceState(null, '', '#log');
  relayout();
}

function showGraphOnly() {
  main.classList.add('graph-only');
  setActiveNav(null);
  clearHighlight();
  history.replaceState(null, '', location.pathname);
  relayout();
}

/* ---------- sidebar tree ---------- */
function buildTree(nodes) {
  const root = { dirs: {}, files: [] };
  nodes.forEach(n => {
    const parts = n.id.split('/');
    let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
      cur = cur.dirs[parts[i]];
    }
    cur.files.push(n);
  });
  return root;
}

function renderTree(tree) {
  const ul = document.createElement('ul');
  // Concept pages first, then subdirectories (so a directory's own overview sits
  // above its children).
  tree.files.sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(n.id);
    a.dataset.id = n.id;
    a.innerHTML = `<span class="dot" style="background:${n.color}"></span><span>${escapeHtml(n.title)}</span>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(n.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
  Object.keys(tree.dirs).sort().forEach(name => {
    const li = document.createElement('li');
    li.className = 'dir';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name.replace(/[-_]/g, ' ');
    li.appendChild(label);
    li.appendChild(renderTree(tree.dirs[name]));
    ul.appendChild(li);
  });
  return ul;
}

function setActiveNav(id) {
  document.querySelectorAll('#nav a, #loglink a').forEach(a => a.classList.remove('active'));
  if (id === 'log') { const l = document.querySelector('#loglink a'); l && l.classList.add('active'); return; }
  if (id === 'index') { const h = document.querySelector('#nav a.homelink'); h && h.classList.add('active'); return; }
  if (!id) return;
  const a = document.querySelector(`#nav a[data-id="${cssEscape(id)}"]`);
  a && a.classList.add('active');
}

const nav = document.getElementById('nav');
if (DATA.index) {
  const home = document.createElement('a');
  home.href = '#index';
  home.className = 'homelink';
  home.innerHTML = '🏠 <span>Index</span>';
  home.addEventListener('click', ev => { ev.preventDefault(); openIndex(); });
  nav.appendChild(home);
}
nav.appendChild(renderTree(buildTree(DATA.nodes)));
if (DATA.log) {
  const link = document.createElement('a');
  link.href = '#log';
  link.innerHTML = '📓 <span>Change log</span>';
  link.addEventListener('click', ev => { ev.preventDefault(); openLog(); });
  document.getElementById('loglink').appendChild(link);
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', ev => {
  if (window.matchMedia('(max-width: 860px)').matches) {
    closeMobilePanels();
    document.body.classList.add('nav-open');
    navToggle.setAttribute('aria-expanded', 'true');
  }
  const q = ev.target.value.trim().toLowerCase();
  DATA.nodes.forEach(n => {
    const hay = (n.title + ' ' + n.description + ' ' + n.type + ' ' + n.tags.join(' ')).toLowerCase();
    const hit = !q || hay.includes(q);
    const navA = document.querySelector(`#nav a[data-id="${cssEscape(n.id)}"]`);
    navA && navA.classList.toggle('hidden', !hit);
    if (main.classList.contains('graph-only')) cy.getElementById(n.id).toggleClass('faded', !!q && !hit);
  });
});

/* ---------- legend ---------- */
function buildLegend() {
  const legend = document.getElementById('legend');
  const title = document.createElement('span');
  title.className = 'legend-title';
  title.textContent = 'Types';
  legend.appendChild(title);
  DATA.types.forEach(t => {
    const item = document.createElement('button');
    item.className = 'legend-item';
    item.dataset.type = t.name;
    item.innerHTML = `<span class="sw" style="background:${t.color}"></span>${escapeHtml(t.name)}`;
    item.addEventListener('click', () => {
      if (activeType === t.name) clearHighlight(); else highlightType(t.name);
    });
    legend.appendChild(item);
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&'); }

/* ---------- initial state ---------- */
runLayout();
buildLegend();
clearHighlight();
const start = decodeURIComponent(location.hash.slice(1));
if (start === 'log') openLog();
else if (byId[start]) openConcept(start);
else if (DATA.index) openIndex();
else showGraphOnly();
</script>
</body>
