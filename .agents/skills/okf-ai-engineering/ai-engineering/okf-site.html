<script>
const DATA = {"title": "ai-engineering", "nodes": [{"id": "agents/agent.md", "title": "Agent Architecture", "type": "Architecture Pattern", "description": "The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.", "tags": ["agents", "architecture", "deepagents", "platform"], "resource": "", "body": "Agent is not a well-defined term, but in most cases it means an **LLM in a loop\nwith tools**: the model picks the next action, calls a [tool](#node:tools/tools.md),\nobserves the result, and repeats until the task is done. What distinguishes an\nagent from a fixed pipeline is that the *model* \u2014 not hard-coded logic \u2014 directs\nthe control flow; when the flow can be fixed instead, a\n[workflow](#node:agents/workflows.md) is the leaner option. The recurring ingredients\nare the loop, planning (decomposing a goal into steps), tool use,\n[memory](#node:agents/memory.md) (carrying context across steps), and often\n[subagents](#node:agents/subagents.md) for delegating focused subtasks. The loop is\ndriven by an [agent harness](#node:agents/harness.md); frameworks like\n[deepagents](#node:agents/deepagents.md) package these patterns.", "color": "#3b82f6"}, {"id": "agents/deepagents.md", "title": "deepagents", "type": "Framework", "description": "Opinionated LangChain package for high level agent patterns.", "tags": ["agents", "deepagents", "langgraph", "framework"], "resource": "https://docs.langchain.com/oss/python/deepagents/overview", "body": "deepagents is the LangChain library that packages production [agent](#node:agents/agent.md) patterns \u2014 planning, [subagents](#node:agents/subagents.md), durable [memory](#node:agents/memory.md), human-in-the-loop, and [workflows](#node:agents/workflows.md) \u2014 on top of LangGraph, which serves as its [harness](#node:agents/harness.md).", "color": "#dc2626"}, {"id": "agents/harness.md", "title": "Agent Harness", "type": "Architecture Pattern", "description": "The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.", "tags": ["agents", "harness", "runtime", "architecture"], "resource": "", "body": "The harness is the runtime that drives the agent loop around the model: it parses each model response, dispatches the tool calls, feeds results back, manages context and memory, enforces sandboxing and limits (retries, max steps, budgets), and decides when to stop. It is the concrete implementation of an [agent architecture](#node:agents/agent.md) \u2014 the model and the tools plug into it, and it is what runs a [workflow](#node:agents/workflows.md) or a full agent loop. Frameworks like [deepagents](#node:agents/deepagents.md) ship a ready-made harness.", "color": "#3b82f6"}, {"id": "agents/memory.md", "title": "Memory", "type": "Concept", "description": "How an agent carries state across steps and sessions \u2014 short-term context plus durable long-term stores.", "tags": ["agents", "memory", "state"], "resource": "", "body": "Memory is how an agent retains information beyond a single model call: short-term\nworking memory in the context window, and long-term memory persisted externally\n(often a vector store) and retrieved when relevant. It lets an agent accumulate\nstate across steps and sessions \u2014 and is a target for\n[poisoning](#node:security/threats/memory-context-poisoning.md).", "color": "#ea7317"}, {"id": "agents/subagents.md", "title": "Subagents & Multi-Agent", "type": "Architecture Pattern", "description": "Delegating focused subtasks to separate agent instances, and orchestrating multiple agents together.", "tags": ["agents", "subagents", "multi-agent", "orchestration"], "resource": "", "body": "Subagents are separate agent instances spawned to handle a focused subtask with\ntheir own context, keeping the parent's context clean; multi-agent systems\ncoordinate several such agents, often under a supervisor. The pattern adds a new\nattack surface \u2014 see\n[insecure inter-agent communication](#node:security/threats/insecure-inter-agent-communication.md).", "color": "#3b82f6"}, {"id": "agents/workflows.md", "title": "Workflows", "type": "Technique", "description": "Workflows let an agent orchestrate its tool calls programmatically \u2014 scripted tool use for lower token cost and long-running tasks.", "tags": ["agents", "workflows", "code-mode", "tools", "technique"], "resource": "", "body": "Workflows give an [agent](#node:agents/agent.md) a way to make tool calls in a scripted way, allowing for reduced token usage and orchestration of long running tasks. They become especially powerful with access to a [subagent](#node:agents/subagents.md)-spawning tool. Because they run model-written code inside the [harness](#node:agents/harness.md), they raise [unexpected code execution](#node:security/threats/unexpected-code-execution.md) risk.\n\nExamples of workflow implementations:\n\n- [Claude Workflows](https://code.claude.com/docs/en/workflows)\n- [LangChain Interpreters](https://docs.langchain.com/oss/python/deepagents/interpreters)", "color": "#9333ea"}, {"id": "ai-engineering.md", "title": "AI Engineering", "type": "Overview", "description": "Personal knowledge base for AI engineering concepts.", "tags": ["overview", "ai-engineering", "enterprise", "platform"], "resource": "", "body": "# Map\n\n- **Context** \u2014 how the model gets its context: [MCP](#node:context/mcp.md), the\n  [Open Knowledge Format](#node:context/okf.md), [RAG](#node:context/rag.md), and\n  [context engineering](#node:context/context-engineering.md).\n- **Tools** \u2014 the [tools](#node:tools/tools.md) primitive, plus\n  [provider-side](#node:tools/provider-tools.md) and [frontend](#node:tools/frontend-tools.md) tools.\n- **Enterprise** \u2014 the control plane: the [LLM Gateway](#node:enterprise/llm-gateway.md)\n  and the [MCP Gateway](#node:enterprise/mcp-gateway.md).\n- **Agents** \u2014 [agent architecture](#node:agents/agent.md), the\n  [harness](#node:agents/harness.md), [memory](#node:agents/memory.md),\n  [subagents](#node:agents/subagents.md), [workflows](#node:agents/workflows.md), and\n  [deepagents](#node:agents/deepagents.md).\n- **Observability & evaluation** \u2014 tracing and evals with\n  [LangSmith](#node:observability/langsmith.md), [Langfuse](#node:observability/langfuse.md),\n  and [LangSmith Evals](#node:observability/langsmith-evals.md).\n- **Security** \u2014 [threats and controls](#node:security/security.md): the OWASP Agentic\n  Top 10 and the guardrails and masking that contain them.\n\n# Resources\n\nFor discovering new information:\n\n- [Cognition blog](https://cognition.com/blog)\n- [LangChain blog](https://www.langchain.com/blog)\n- [Anthropic Engineering blog](https://www.anthropic.com/engineering)\n\nNice general resources:\n\n- [The Agentic Operating Model \u2014 LangChain](https://www.langchain.com/resources/the-agentic-operating-model)", "color": "#0891b2"}, {"id": "context/context-engineering.md", "title": "Context Engineering", "type": "Technique", "description": "Deliberately assembling what goes into the model's context window \u2014 instructions, tools, retrieved data, memory, and history.", "tags": ["context", "prompting", "technique"], "resource": "", "body": "Context engineering is the practice of deliberately assembling everything the\nmodel sees for a given step \u2014 system instructions, [tool](#node:tools/tools.md)\ndefinitions, [retrieved](#node:context/rag.md) data, [memory](#node:agents/memory.md), and\nconversation history \u2014 and managing the limited context window. It is the broader\nsuccessor discipline to prompt engineering.", "color": "#9333ea"}, {"id": "context/mcp.md", "title": "Model Context Protocol (MCP)", "type": "Protocol", "description": "Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.", "tags": ["mcp", "protocol", "platform", "integration"], "resource": "https://modelcontextprotocol.io", "body": "MCP is a JSON-RPC-based protocol that standardizes the boundary between an LLM\nclient and external capabilities \u2014 mainly **tools**, but it also supports\n**resources** and **prompts**. Its [tools](#node:tools/tools.md) are consumed by\n[agent architectures](#node:agents/agent.md) and, in production, fronted by an\n[MCP gateway](#node:enterprise/mcp-gateway.md) that multiplexes and secures many\nservers.\n\nIt was designed **stateful**: a session opens with an initialization handshake\nthat negotiates protocol version and capabilities once, over a persistent\nconnection the server can also push back on \u2014 sampling, elicitation, progress,\nand resource/tool-list-change notifications. That bidirectional, session-oriented\nmodel fit MCP's local-first origin, where a client launches a local server over\nstdio and the connection is naturally long-lived.\n\nThat same statefulness is its main drawback for remote, at-scale deployments: the\nhandshake and per-session state force sticky sessions and complicate serverless\nand horizontal scaling. A stateless-by-default redesign was requested in\n[SEP-1442](https://github.com/modelcontextprotocol/modelcontextprotocol/issues/1442)\nand accepted as\n[SEP-2575](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2575)\n(merged May 2026), targeting the 2026-07-28 spec revision \u2014 worth tracking as it\nlands.\n\n# Resources\n\n- [MCP specification](https://modelcontextprotocol.io)\n- [FastMCP](https://gofastmcp.com)\n- [SEP-2575: Make MCP Stateless](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/2575) (merged; targets the 2026-07-28 spec)", "color": "#ca8a04"}, {"id": "context/okf.md", "title": "Open Knowledge Format (OKF)", "type": "Knowledge Format", "description": "Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.", "tags": ["knowledge", "standards", "agents"], "resource": "https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf", "body": "OKF represents knowledge \u2014 the metadata and curated context around data and\nsystems \u2014 as a directory of markdown files with YAML frontmatter. One concept\nper file; the file path is the concept's identity. No schema registry, no\ncentral authority, no required tooling. This very bundle is an OKF bundle.\n\n# Relationship with skills\n\nOKF is *knowledge* (declarative facts), distinct from an agent **skill**\n(procedural capability) and from [MCP](#node:context/mcp.md) (a transport for tools\nand resources). An agent could consume an OKF bundle as its knowledge base while\na skill provides the procedure to traverse it and MCP exposes the live tools.\n\n# Resources\n\n- [OKF specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)", "color": "#7c3aed"}, {"id": "context/rag.md", "title": "RAG", "type": "Technique", "description": "Retrieval-augmented generation \u2014 fetching relevant documents at query time and adding them to the model's context.", "tags": ["rag", "retrieval", "context", "technique"], "resource": "", "body": "Retrieval-augmented generation fetches relevant external data \u2014 usually from a\nvector store over embeddings \u2014 at query time and injects it into the model's\ncontext, so answers are grounded in current, private, or domain-specific\nknowledge rather than only the model's training. It is one input to\n[context engineering](#node:context/context-engineering.md).", "color": "#9333ea"}, {"id": "enterprise/llm-gateway.md", "title": "LLM Gateway", "type": "Architecture Pattern", "description": "A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.", "tags": ["platform", "gateway", "security", "enterprise"], "resource": "", "body": "An LLM gateway is the control plane between AI clients and the\nmodels they use. It centralizes cross-cutting concerns \u2014 authentication,\nauthorization, rate limiting, routing/failover, content\npolicy, and audit \u2014 so that individual apps and agents stay thin. It is the\nmodel-side counterpart to the [MCP gateway](#node:enterprise/mcp-gateway.md) and a\nnatural enforcement point for [guardrails](#node:security/controls/guardrails.md).\n\nExamples:\n\n- LiteLLM", "color": "#3b82f6"}, {"id": "enterprise/mcp-gateway.md", "title": "MCP Gateway", "type": "Architecture Pattern", "description": "An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.", "tags": ["enterprise", "mcp", "gateway", "platform"], "resource": "", "body": "An MCP gateway is the control point in front of many [MCP](#node:context/mcp.md) servers \u2014 one authenticated endpoint applying permissions, secret injection, [anonymization](#node:security/controls/pii-masking.md), [guardrails](#node:security/controls/guardrails.md), and audit. It is the tool-side counterpart to the [LLM gateway](#node:enterprise/llm-gateway.md) and the main control against [agent identity & privilege abuse](#node:security/threats/identity-privilege-abuse.md).", "color": "#3b82f6"}, {"id": "observability/langfuse.md", "title": "Langfuse", "type": "Tool", "description": "Open-source LLM observability and tracing, OpenTelemetry-friendly.", "tags": ["observability", "tracing", "langfuse", "open-source", "tool"], "resource": "https://langfuse.com", "body": "Langfuse is an open-source LLM observability platform \u2014 self-hostable tracing, metrics, and evals, a vendor-neutral alternative to [LangSmith](#node:observability/langsmith.md) on the same OTel backbone.", "color": "#64748b"}, {"id": "observability/langsmith-evals.md", "title": "LangSmith Evals", "type": "Tool", "description": "Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.", "tags": ["evaluation", "evals", "langsmith", "tool"], "resource": "https://docs.langchain.com/oss/python/langchain/test/evals", "body": "[LangSmith](#node:observability/langsmith.md)'s evaluation tooling runs datasets, LLM-as-judge and custom evaluators, and experiments over traces \u2014 the operational side of evals in this stack.", "color": "#64748b"}, {"id": "observability/langsmith.md", "title": "LangSmith", "type": "Tool", "description": "LangChain's tracing and evaluation platform for LLM/agent observability.", "tags": ["observability", "tracing", "langsmith", "tool"], "resource": "https://www.langchain.com/langsmith", "body": "LangSmith is LangChain's managed platform for tracing, monitoring, and [evaluating](#node:observability/langsmith-evals.md) LLM apps and agents \u2014 the observability backend used across this work. [Langfuse](#node:observability/langfuse.md) is the open-source alternative.", "color": "#64748b"}, {"id": "security/controls/guardrails.md", "title": "Guardrails", "type": "Control", "description": "Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.", "tags": ["security", "control", "policy", "moderation"], "resource": "", "body": "Guardrails are the deterministic and model-based controls wrapped around an LLM\ncall to keep behavior inside a safe envelope: input filters (jailbreak/\n[injection](#node:security/threats/agent-goal-hijack.md) detection, topic limits), output\nfilters (moderation, PII checks, schema/format validation), and action gates\n(approval required before destructive tool calls). They are policy enforcement,\ndistinct from the model's own alignment. They complement\n[PII masking](#node:security/controls/pii-masking.md) on the output path and are\ntypically enforced at the [MCP gateway](#node:enterprise/mcp-gateway.md).", "color": "#16a34a"}, {"id": "security/controls/pii-masking.md", "title": "PII Masking & Anonymization", "type": "Control", "description": "Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.", "tags": ["security", "control", "privacy", "pii"], "resource": "", "body": "PII masking is the detection and transformation of personal data flowing through\nan AI system \u2014 redaction, pseudonymization, or reversible tokenization \u2014 so that\nsensitive fields never reach a model, a log, or a third party in the clear. It is\nthe privacy counterpart to [guardrails](#node:security/controls/guardrails.md) and is\ntypically enforced at the [MCP gateway](#node:enterprise/mcp-gateway.md). In a bank,\nthis is a hard regulatory boundary, not a nice-to-have.", "color": "#16a34a"}, {"id": "security/security.md", "title": "Security", "type": "Overview", "description": "How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 threats and the controls that contain them.", "tags": ["security", "overview", "owasp", "agents"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agentic systems act with real tools and the user's own permissions, so their\nattack surface is the tool, identity, memory, and communication surface \u2014 not\njust the prompt. This area splits into **threats** (how agents are subverted) and\n**controls** (what keeps them inside a safe envelope). The reference model is the\nOWASP Top 10 for Agentic Applications (2026).\n\n# Threats (OWASP Agentic Top 10)\n\n- [Agent Goal Hijack](#node:security/threats/agent-goal-hijack.md)\n- [Tool Misuse & Exploitation](#node:security/threats/tool-misuse.md)\n- [Agent Identity & Privilege Abuse](#node:security/threats/identity-privilege-abuse.md)\n- [Agentic Supply Chain Compromise](#node:security/threats/supply-chain-compromise.md)\n- [Unexpected Code Execution](#node:security/threats/unexpected-code-execution.md)\n- [Memory & Context Poisoning](#node:security/threats/memory-context-poisoning.md)\n- [Insecure Inter-Agent Communication](#node:security/threats/insecure-inter-agent-communication.md)\n- [Cascading Agent Failures](#node:security/threats/cascading-agent-failures.md)\n- [Human-Agent Trust Exploitation](#node:security/threats/human-agent-trust-exploitation.md)\n- [Rogue Agents](#node:security/threats/rogue-agents.md)\n\n# Controls\n\n- [Guardrails](#node:security/controls/guardrails.md) \u2014 input/output/action policy enforcement around the model.\n- [PII Masking & Anonymization](#node:security/controls/pii-masking.md) \u2014 redacting or tokenizing personal data on the way in and out.\n\nControls are enforced in practice at the [LLM gateway](#node:enterprise/llm-gateway.md)\nand [MCP gateway](#node:enterprise/mcp-gateway.md), under a zero-trust posture: every\nagent action authenticated, authorized, least-privileged, and logged.\n\n# Resources\n\n- [OWASP Top 10 for Agentic Applications 2026](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)\n- [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)\n- [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)", "color": "#0891b2"}, {"id": "security/threats/agent-goal-hijack.md", "title": "Agent Goal Hijack", "type": "Threat", "description": "Adversarial input redirects the agent's plan or objective \u2014 OWASP's #1 agentic risk, prompt injection being the primary mechanism.", "tags": ["security", "threat", "agents", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agent goal hijack is when adversarial input redirects an agent's plan or\nobjective away from the developer's intent. Its primary mechanism is **prompt\ninjection** \u2014 adversarial instructions embedded in content the model reads (a web\npage, a document, a tool result, an email). **Indirect** injection (via data the\nagent retrieves rather than the user's own message) is the dangerous variant for\nautonomous agents. There is no known complete fix; it is a systemic property of\nmodels that follow natural-language instructions.", "color": "#db2777"}, {"id": "security/threats/cascading-agent-failures.md", "title": "Cascading Agent Failures", "type": "Threat", "description": "A local failure or compromise propagates across agents and tools into a systemic failure.", "tags": ["security", "threat", "reliability", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Cascading failures are when one bad output, loop, or outage ripples through dependent agents and tools \u2014 a reliability failure that is also a security one.", "color": "#db2777"}, {"id": "security/threats/human-agent-trust-exploitation.md", "title": "Human-Agent Trust Exploitation", "type": "Threat", "description": "The agent is used to manipulate the human, or humans over-trust the agent's output.", "tags": ["security", "threat", "human-factors", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Trust exploitation runs both ways: an agent weaponized to socially engineer a person, and humans granting unearned trust to fluent but wrong output.", "color": "#db2777"}, {"id": "security/threats/identity-privilege-abuse.md", "title": "Agent Identity & Privilege Abuse", "type": "Threat", "description": "The agent's identity or permissions are misused, impersonated, or escalated.", "tags": ["security", "threat", "identity", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Identity and privilege abuse covers impersonation, token theft, and privilege escalation \u2014 the agent acting with authority it should not have.", "color": "#db2777"}, {"id": "security/threats/insecure-inter-agent-communication.md", "title": "Insecure Inter-Agent Communication", "type": "Threat", "description": "Trust, spoofing, or tampering weaknesses in messaging between agents.", "tags": ["security", "threat", "multi-agent", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "In multi-agent systems, the channels between agents become an attack surface: unauthenticated messages, spoofed peers, and tampered hand-offs.", "color": "#db2777"}, {"id": "security/threats/memory-context-poisoning.md", "title": "Memory & Context Poisoning", "type": "Threat", "description": "Malicious content persists in the agent's memory or context and influences later decisions.", "tags": ["security", "threat", "memory", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Memory and context poisoning plants adversarial content that survives across turns \u2014 the persistent cousin of goal hijack, corrupting future reasoning.", "color": "#db2777"}, {"id": "security/threats/rogue-agents.md", "title": "Rogue Agents", "type": "Threat", "description": "Unauthorized or compromised agents operating outside governance and oversight.", "tags": ["security", "threat", "governance", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Rogue agents are those running outside the sanctioned control plane \u2014 unregistered, compromised, or drifted beyond their mandate.", "color": "#db2777"}, {"id": "security/threats/supply-chain-compromise.md", "title": "Agentic Supply Chain Compromise", "type": "Threat", "description": "Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.", "tags": ["security", "threat", "supply-chain", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Supply chain compromise is the poisoning of what the agent depends on: a backdoored MCP server, a tampered model, a malicious package, or a spoofed tool.", "color": "#db2777"}, {"id": "security/threats/tool-misuse.md", "title": "Tool Misuse & Exploitation", "type": "Threat", "description": "The agent invokes tools in ways they were not intended or authorized for.", "tags": ["security", "threat", "tools", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Tool misuse is when an agent is driven to call tools \u2014 or chain them \u2014 in ways outside their intended, authorized use, turning legitimate capabilities into an attack.", "color": "#db2777"}, {"id": "security/threats/unexpected-code-execution.md", "title": "Unexpected Code Execution", "type": "Threat", "description": "The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.", "tags": ["security", "threat", "rce", "owasp"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Unexpected code execution is when an agent runs attacker-controlled code \u2014 a growing risk as agents gain interpreters and code-mode tools.", "color": "#db2777"}, {"id": "tools/frontend-tools.md", "title": "Frontend Tools", "type": "Concept", "description": "Client-side tools executed in the frontend, typically for UI interactions \u2014 a newer, less standardized category.", "tags": ["tools", "frontend", "ui"], "resource": "", "body": "Frontend [tools](#node:tools/tools.md) run on the client's frontend rather than its\nbackend, typically to drive UI interactions (rendering components, reading UI\nstate). It is a much newer and less standardized category than backend tools.\nExamples:\n\n- [Google's A2UI](https://a2ui.org)\n- [LangChain's headless tools](https://docs.langchain.com/oss/python/langchain/frontend/headless-tools)\n- [FastMCP's implementation of MCP apps](https://gofastmcp.com/apps/fastmcp-app)", "color": "#ea7317"}, {"id": "tools/provider-tools.md", "title": "Provider-Side Tools", "type": "Concept", "description": "Tools defined and executed by the model provider \u2014 built-in web search, code execution \u2014 that clients just enable.", "tags": ["tools", "provider", "primitive"], "resource": "", "body": "Provider-side [tools](#node:tools/tools.md) are defined and executed by the model\nprovider rather than the client \u2014 built-in capabilities like web search, code\nexecution, or computer use that a client simply enables in its API call. The\nprovider runs them and returns results inline, so the client never sees or hosts\nthe implementation.", "color": "#ea7317"}, {"id": "tools/tools.md", "title": "Tools", "type": "Concept", "description": "The primitive that turns an LLM into an agent \u2014 functions the model can call to act on and read from its environment.", "tags": ["tools", "agents", "mcp", "primitive"], "resource": "", "body": "Tools are the main thing needed to convert an LLM into a capable agent. Without\nthem, most agent actions would end after one turn; with them, agents can interact\nwith the environment, fetch new context to condition their output on, and perform\ncomplex tasks. They are like control statements in programming languages.\nAdditionally, tools are generic and can be used for almost any use case \u2014 ranging\nfrom direct actions like querying a database to meta operations like\n[workflow](#node:agents/workflows.md) orchestration or recursive\n[subagent](#node:agents/subagents.md) calling. Tools are exposed to models through\nprovider APIs and protocols like [MCP](#node:context/mcp.md).\n\n# Where tools run\n\nTools for LLMs can be generally organized by where they execute:\n\n- **Client-side tools** \u2014 executed by the client.\n  - **Backend tools** \u2014 executed on the client's backend; the majority of tools\n    fall into this category.\n  - **[Frontend tools](#node:tools/frontend-tools.md)** \u2014 executed on the client's\n    frontend, typically for UI interactions; a newer, less standardized category.\n- **[Provider-side tools](#node:tools/provider-tools.md)** \u2014 defined and executed by the\n  model provider (built-in web search, code execution, etc.); clients just enable\n  them in API calls.", "color": "#ea7317"}], "edges": [{"source": "agents/agent.md", "target": "tools/tools.md"}, {"source": "agents/agent.md", "target": "agents/workflows.md"}, {"source": "agents/agent.md", "target": "agents/memory.md"}, {"source": "agents/agent.md", "target": "agents/subagents.md"}, {"source": "agents/agent.md", "target": "agents/harness.md"}, {"source": "agents/agent.md", "target": "agents/deepagents.md"}, {"source": "agents/deepagents.md", "target": "agents/agent.md"}, {"source": "agents/deepagents.md", "target": "agents/subagents.md"}, {"source": "agents/deepagents.md", "target": "agents/memory.md"}, {"source": "agents/deepagents.md", "target": "agents/workflows.md"}, {"source": "agents/deepagents.md", "target": "agents/harness.md"}, {"source": "agents/harness.md", "target": "agents/agent.md"}, {"source": "agents/harness.md", "target": "agents/workflows.md"}, {"source": "agents/harness.md", "target": "agents/deepagents.md"}, {"source": "agents/memory.md", "target": "security/threats/memory-context-poisoning.md"}, {"source": "agents/subagents.md", "target": "security/threats/insecure-inter-agent-communication.md"}, {"source": "agents/workflows.md", "target": "agents/agent.md"}, {"source": "agents/workflows.md", "target": "agents/subagents.md"}, {"source": "agents/workflows.md", "target": "agents/harness.md"}, {"source": "agents/workflows.md", "target": "security/threats/unexpected-code-execution.md"}, {"source": "ai-engineering.md", "target": "context/mcp.md"}, {"source": "ai-engineering.md", "target": "context/okf.md"}, {"source": "ai-engineering.md", "target": "context/rag.md"}, {"source": "ai-engineering.md", "target": "context/context-engineering.md"}, {"source": "ai-engineering.md", "target": "tools/tools.md"}, {"source": "ai-engineering.md", "target": "tools/provider-tools.md"}, {"source": "ai-engineering.md", "target": "tools/frontend-tools.md"}, {"source": "ai-engineering.md", "target": "enterprise/llm-gateway.md"}, {"source": "ai-engineering.md", "target": "enterprise/mcp-gateway.md"}, {"source": "ai-engineering.md" bservability/langsmith-evals.md"}, {"source": "observability/langsmith.md", "target": "observability/langfuse.md"}, {"source": "security/controls/guardrails.md", "target": "security/threats/agent-goal-hijack.md"}, {"source": "security/controls/guardrails.md", "target": "security/controls/pii-masking.md"}, {"source": "security/controls/guardrails.md", "target": "enterprise/mcp-gateway.md"}, {"source": "security/controls/pii-masking.md", "target": "security/controls/guardrails.md"}, {"source": "security/controls/pii-masking.md", "target": "enterprise/mcp-gateway.md"}, {"source": "security/security.md", "target": "security/threats/agent-goal-hijack.md"}, {"source": "security/security.md", "target": "security/threats/tool-misuse.md"}, {"source": "security/security.md", "target": "security/threats/identity-privilege-abuse.md"}, {"source": "security/security.md", "target": "security/threats/supply-chain-compromise.md"}, {"source": "security/security.md", "target": "security/threats/unexpected-code-execution.md"}, {"source": "security/security.md", "target": "security/threats/memory-context-poisoning.md"}, {"source": "security/security.md", "target": "security/threats/insecure-inter-agent-communication.md"}, {"source": "security/security.md", "target": "security/threats/cascading-agent-failures.md"}, {"source": "security/security.md", "target": "security/threats/human-agent-trust-exploitation.md"}, {"source": "security/security.md", "target": "security/threats/rogue-agents.md"}, {"source": "security/security.md", "target": "security/controls/guardrails.md"}, {"source": "security/security.md", "target": "security/controls/pii-masking.md"}, {"source": "security/security.md", "target": "enterprise/llm-gateway.md"}, {"source": "security/security.md", "target": "enterprise/mcp-gateway.md"}, {"source": "tools/frontend-tools.md", "target": "tools/tools.md"}, {"source": "tools/provider-tools.md", "target": "tools/tools.md"}, {"source": "tools/tools.md", "target": "agents/workflows.md"}, {"source": "tools/tools.md", "target": "agents/subagents.md"}, {"source": "tools/tools.md", "target": "context/mcp.md"}, {"source": "tools/tools.md", "target": "tools/frontend-tools.md"}, {"source": "tools/tools.md", "target": "tools/provider-tools.md"}], "types": [{"name": "Architecture Pattern", "color": "#3b82f6"}, {"name": "Concept", "color": "#ea7317"}, {"name": "Control", "color": "#16a34a"}, {"name": "Framework", "color": "#dc2626"}, {"name": "Knowledge Format", "color": "#7c3aed"}, {"name": "Overview", "color": "#0891b2"}, {"name": "Protocol", "color": "#ca8a04"}, {"name": "Technique", "color": "#9333ea"}, {"name": "Threat", "color": "#db2777"}, {"name": "Tool", "color": "#64748b"}], "log": "# Directory Update Log\n\n## 2026-07-05\n\n* **Update**: Full review pass. Dropped every `# Related` section \u2014 cross-references now read as prose in each concept's body (dropped ones that didn't fit). Balanced [MCP](#node:context/mcp.md) with why it was stateful (one-time negotiation, server-initiated push, local-stdio origin). Fixed the `workflows` description typos; normalized unnecessary title quotes.\n* **Creation**: Added concise concepts [RAG](#node:context/rag.md), [Context Engineering](#node:context/context-engineering.md), [Memory](#node:agents/memory.md), [Subagents & Multi-Agent](#node:agents/subagents.md), [Provider-Side Tools](#node:tools/provider-tools.md), and [Frontend Tools](#node:tools/frontend-tools.md) (bare definitions to expand later).\n* **Reorganization**: Folded `evaluation/` into `observability/` (moved LangSmith Evals); kept `tools/` as its own area and split out provider-side and frontend tools.\n\n* **Update**: Expanded [Agent Architecture](#node:agents/agent.md) (what distinguishes an agent \u2014 the model directs control flow \u2014 plus its ingredients) and added a `# Related` section wiring it to the harness, workflows, tools, and deepagents.\n* **Update**: [MCP](#node:context/mcp.md) \u2014 recorded the stateless-by-default F prose style.\n* **Reorganization**: Split the skill from the bundle \u2014 the OKF bundle now lives in `okf/` with `SKILL.md` beside it, so the directory is both a proper agent skill and a fully spec-compliant OKF bundle (no reserved-filename special-casing for `SKILL.md`/`README.md`).\n* **Update**: Site generator \u2014 added a clickable type-color **legend** above the graph (selecting a type highlights all its concepts in the graph and the nav tree), surfaced each concept's `description` on its page, and made the bundle `index.md` the HTML landing page.\n* **Update**: Refactored `SKILL.md` into a lean agent-facing skill (routing + how-to) rather than a site landing description.\n* **Update**: Formatting pass across concepts \u2014 citations rendered as markdown lists (line breaks), and level-2 body headings promoted to level-1 for consistency with `# Citations`. Added a repo-root `.markdownlint.json` disabling MD025/MD041, which OKF's multi-`#` convention intentionally trips.\n* **Reorganization**: Restructured the bundle into `context/`, `enterprise/`, `agents/`, `observability/`, `evaluation/`, and `security/` \u2014 renamed the session-specific `meta/` to `context/` and moved every concept to its new home.\n* **Creation**: Adopted the [OWASP Agentic Top 10](#node:security/threats/agent-goal-hijack.md) as `security/threats/` (ASI01\u2013ASI10; the former Prompt Injection concept became [Agent Goal Hijack](#node:security/threats/agent-goal-hijack.md)); moved [Guardrails](#node:security/controls/guardrails.md) and [PII Masking](#node:security/controls/pii-masking.md) to `security/controls/`.\n* **Creation**: Scaffolded new concepts \u2014 [MCP Gateway](#node:enterprise/mcp-gateway.md), [deepagents](#node:agents/deepagents.md), [Agent Harness](#node:agents/harness.md), [Workflows](#node:agents/workflows.md), [LangSmith](#node:observability/langsmith.md), [Langfuse](#node:observability/langfuse.md), and [LangSmith Evals](#node:observability/langsmith-evals.md) \u2014 frontmatter and cross-links complete, bodies to be filled in.\n* **Reorganization**: Moved the bundle into `.agents/skills/okf-ai-engineering/` and converted `README.md` to `SKILL.md` (added skill `name` and `description`), making the knowledge base a discoverable, distributable skill while keeping it a conformant OKF bundle.\n* **Update**: Filled the ASI02\u2013ASI10 threat bodies (enterprise framing + design considerations with cross-links). The vendor/tooling concepts (LangSmith, Langfuse, LangSmith Evals, deepagents, Agent Harness, Programmatic Tools, MCP Gateway) remain scaffolds pending domain input.\n\n## 2026-07-04\n\n* **Initialization**: Created the AI-engineering concept bundle \u2014 a cross-linked, vendor-neutral knowledge graph tuned to enterprise AI-platform work (platform + gateway + PII masker).\n* **Creation**: Added meta concept [Open Knowledge Format](#node:context/okf.md).\n* **Creation**: Added platform concepts [MCP](#node:context/mcp.md), [LLM Gateway](#node:enterprise/llm-gateway.md), and [Agent Architecture](#node:agents/agent.md).\n* **Creation**: Added security concepts [Prompt Injection](#node:security/threats/agent-goal-hijack.md), [Guardrails](#node:security/controls/guardrails.md), and [PII Masking & Anonymization](#node:security/controls/pii-masking.md).\n* **Creation**: Added lifecycle concepts AI Observability & Tracing and Evals & LLM-as-Judge (later removed; observability/evals now live as the vendor-tool concepts).\n* **Update**: Switched PDF citations to canonical source URLs (Anthropic, LangChain, OWASP) so the bundle stays pure markdown and portable; local PDFs are no longer bundle dependencies.\n* **Creation**: Added a root `SKILL.md` (`type: Overview`) as the knowledge-base landing page.\n* **Update**: Restyled every concept body to clearer sections \u2014 `In an enterprise platform` and `Design considerations` \u2014 replacing the ambiguous \"Why it matters\" / \"Key decisions\" headings.\n", "index": "# Architecture Pattern\n\n* [Agent Architecture](#node:agents/agent.md) - The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.\n* [Agent Harness](#node:agents/harness.md) - The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.\n* [LLM Gateway](#node:enterprise/llm-gateway.md) - A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.\n* [MCP Gateway](#node:enterprise/mcp-gateway.md) - An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.\n* [Subagents & Multi-Agent](#node:agents/subagents.md) - Delegating focused subtasks to separate agent instances, and orchestrating multiple agents together.\n\n# Concept\n\n* [Frontend Tools](#node:tools/frontend-tools.md) - Client-side tools executed in the frontend, typically for UI interactions \u2014 a newer, less standardized category.\n* [Memory](#node:agents/memory.md) - How an agent carries state across steps and sessions \u2014 short-term context plus durable long-term stores.\n* [Provider-Side Tools](#node:tools/provider-tools.md) - Tools defined and executed by the model provider \u2014 built-in web search, code execution \u2014 that clients just enable.\n* [Tools](#node:tools/tools.md) - The primitive that turns an LLM into an agent \u2014 functions the model can call to act on and read from its environment.\n\n# Control\n\n* [Guardrails](#node:security/controls/guardrails.md) - Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.\n* [PII Masking & Anonymization](#node:security/controls/pii-masking.md) - Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.\n\n# Framework\n\n* [deepagents](#node:agents/deepagents.md) - Opinionated LangChain package for high level agent patterns.\n\n# Knowledge Format\n\n* [Open Knowledge Format (OKF)](#node:context/okf.md) - Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.\n\n# Overview\n\n* [AI Engineering](#node:ai-engineering.md) - Personal knowledge base for AI engineering concepts.\n* [Security](#node:security/security.md) - How enterprise agent platforms are attacked and defended \u2014 the OWASP Agentic Top 10 threats and the controls that contain them.\n\n# Protocol\n\n* [Model Context Protocol (MCP)](#node:context/mcp.md) - Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.\n\n# Technique\n\n* [Context Engineering](#node:context/context-engineering.md) - Deliberately assembling what goes into the model's context window \u2014 instructions, tools, retrieved data, memory, and history.\n* [RAG](#node:context/rag.md) - Retrieval-augmented generation \u2014 fetching relevant documents at query time and adding them to the model's context.\n* [Workflows](#node:agents/workflows.md) - Workflows let an agent orchestrate its tool calls programmatically \u2014 scripted tool use for lower token cost and long-running tasks.\n\n# Threat\n\n* [Agent Goal Hijack](#node:security/threats/agent-goal-hijack.md) - Adversarial input redirects the agent's plan or objective \u2014 OWASP's #1 agentic risk, prompt injection being the primary mechanism.\n* [Agent Identity & Privilege Abuse](#node:security/threats/identity-privilege-abuse.md) - The agent's identity or permissions are misused, impersonated, or escalated.\n* [Agentic Supply Chain Compromise](#node:security/threats/supply-chain-compromise.md) - Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.\n* [Cascading Agent Failures](#node:security/threats/cascading-agent-failures.md) - A local failure or compromise propagates across agents and tools into a systemic failure.\n* [Human-Agent Trust Exploitation](#node:security/threats/human-agent-trust-exploitation.md) - The agent is used to manipulate the human, or humans over-trust the agent's output.\n* [Insecure Inter-Agent Communication](#node:security/threats/insecure-inter-agent-communication.md) - Trust, spoofing, or tampering weaknesses in messaging between agents.\n* [Memory & Context Poisoning](#node:security/threats/memory-context-poisoning.md) - Malicious content persists in the agent's memory or context and influences later decisions.\n* [Rogue Agents](#node:security/threats/rogue-agents.md) - Unauthorized or compromised agents operating outside governance and oversight.\n* [Tool Misuse & Exploitation](#node:security/threats/tool-misuse.md) - The agent invokes tools in ways they were not intended or authorized for.\n* [Unexpected Code Execution](#node:security/threats/unexpected-code-execution.md) - The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.\n\n# Tool\n\n* [Langfuse](#node:observability/langfuse.md) - Open-source LLM observability and tracing, OpenTelemetry-friendly.\n* [LangSmith](#node:observability/langsmith.md) - LangChain's tracing and evaluation platform for LLM/agent observability.\n* [LangSmith Evals](#node:observability/langsmith-evals.md) - Dataset and evaluator tooling in LangSmith for offline and online agent evaluation."};
const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const main = document.getElementById('main');
const doc = document.getElementById('doc');
const caption = document.getElementById('graph-caption');

/* ---------- graph ---------- */
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [
    ...DATA.nodes.map(n => ({ data: { id: n.id, label: n.title, color: n.color } })),
    ...DATA.edges.map(e => ({ data: { id: e.source + '->' + e.target, source: e.source, target: e.target } })),
  ],
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'label': 'data(label)', 'color': '#1f2328',
        'font-size': '8px', 'text-wrap': 'wrap', 'text-max-width': '80px',
        'text-valign': 'bottom', 'text-margin-y': 3, 'width': 15, 'height': 15,
        'border-width': 1.5, 'border-color': '#ffffff' } },
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#c8d1da', 'target-arrow-color': '#c8d1da',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .7 } },
    { selector: 'node.sel', style: { 'border-color': '#0969da', 'border-width': 3, 'font-size': '10px', 'font-weight': 'bold', 'width': 20, 'height': 20 } },
    { selector: '.faded', style: { 'opacity': .12 } },
    { selector: 'node.hidden', style: { 'display': 'none' } },
  ],
  wheelSensitivity: 0.2,
});

function graphLayout() {
  return { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true,
           idealEdgeLength: 150, nodeRepulsion: 22000, nodeOverlap: 60,
           gravity: 0.2, componentSpacing: 160, numIter: 1500, padding: 40 };
}

// Run the force layout, then a deterministic pass that pushes any still-
// overlapping nodes apart using their label-inclusive bounding boxes, so labels
// never sit on top of each other regardless of the force layout's result.
function runLayout() {
  const layout = cy.layout(graphLayout());
  layout.one('layoutstop', () => requestAnimationFrame(() => separateOverlaps()));
  layout.run();
}

function separateOverlaps(iterations = 80, pad = 10) {
  const nodes = cy.nodes();
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ba = a.boundingBox({ includeLabels: true });
        const bb = b.boundingBox({ includeLabels: true });
        const overlapX = Math.min(ba.x2, bb.x2) - Math.max(ba.x1, bb.x1) + pad;
        const overlapY = Math.min(ba.y2, bb.y2) - Math.max(ba.y1, bb.y1) + pad;
        if (overlapX > 0 && overlapY > 0) {
          let dx = (ba.x1 + ba.x2) / 2 - (bb.x1 + bb.x2) / 2;
          let dy = (ba.y1 + ba.y2) / 2 - (bb.y1 + bb.y2) / 2;
          const dist = Math.hypot(dx, dy) || 0.01;
          const push = Math.min(overlapX, overlapY) / 2;
          dx /= dist; dy /= dist;
          a.position({ x: a.position('x') + dx * push, y: a.position('y') + dy * push });
          b.position({ x: b.position('x') - dx * push, y: b.position('y') - dy * push });
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  cy.fit(undefined, 30);
}

cy.on('tap', 'node', ev => {
  // Clicking the already-selected node toggles the selection off.
  if (ev.target.hasClass('sel')) clearHighlight(); else openConcept(ev.target.id());
});
cy.on('tap', 'edge', ev => openEdgeLink(ev.target.id()));           // open the source doc at the link that made this edge
cy.on('tap', ev => { if (ev.target === cy) clearHighlight(); });    // click empty space = deselect node, keep the doc open
document.getElementById('graph').addEventListener('dblclick', () => {  // double-click anywhere = reset zoom to fit all
  cy.animate({ fit: { eles: cy.elements(), padding: 30 } }, { duration: 300 });
});

let activeType = null;

// Reflect the active type (if any) onto the legend chips and the nav tree.
function paintTypeState() {
  document.querySelectorAll('#legend .legend-item').forEach(el =>
    el.classList.toggle('active', el.dataset.type === activeType));
  document.querySelectorAll('#nav a[data-id]').forEach(a =>
    a.classList.toggle('typematch', !!activeType && byId[a.dataset.id].type === activeType));
}

function highlight(id) {
  const node = cy.getElementById(id);
  activeType = null;
  cy.elements().addClass('faded');
  cy.nodes().removeClass('sel');
  const near = node.closedNeighborhood();
  near.removeClass('faded');
  node.addClass('sel');
  paintTypeState();
  caption.textContent = node.data('label') + ' — ' + node.connectedEdges().length + ' links';
}

// Highlight every concept of one type across the graph and the nav tree.
function highlightType(type) {
  activeType = type;
  cy.nodes().removeClass('sel');
  cy.elements().addClass('faded');
  const matching = cy.nodes().filter(n => byId[n.id()].type === type);
  matching.removeClass('faded');
  paintTypeState();
  caption.textContent = type + ' — ' + matching.length + ' concepts';
}

function clearHighlight() {
  activeType = null;
  cy.elements().removeClass('faded');
  cy.nodes().removeClass('sel');
  paintTypeState();
  caption.textContent = cy.nodes().length + ' concepts · ' + cy.edges().length + ' links';
}

function relayout() {
  // Only resize/refit on view changes — never re-run the force layout, which
  // would reshuffle node positions and make the graph jump on every click.
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

function focusOn(id) {
  // Zoom and recenter to the selected node plus its immediate links, instead of
  // refitting the entire graph.
  const node = cy.getElementById(id);
  requestAnimationFrame(() => {
    cy.resize();
    if (node.nonempty()) cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 60 } }, { duration: 300 });
    else cy.fit(undefined, 30);
  });
}

/* ---------- reader ---------- */
// Wire a rendered markdown container: in-bundle links navigate the graph,
// external links open in a new tab.
function wireDocLinks(container) {
  container.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  container.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

function renderDoc(markdown) {
  doc.innerHTML = marked.parse(markdown);
  wireDocLinks(doc);
  doc.scrollTop = 0;
}

function openConcept(id) {
  const n = byId[id];
  if (!n) return;
  main.classList.remove('graph-only');
  const resourceHtml = n.resource
    ? `<span class="resource">🔗 <a href="${escapeAttr(n.resource)}" title="${escapeAttr(n.resource)}" target="_blank" rel="noopener">${escapeHtml(n.resource)}</a></span>` : '';
  const tagsHtml = (n.tags && n.tags.length)
    ? `<span class="tags-inline">${n.tags.map(t => `<code>${escapeHtml(t)}</code>`).join('')}</span>` : '';
  const summaryHtml = n.description ? `<p class="summary">${escapeHtml(n.description)}</p>` : '';
  doc.innerHTML =
    `<h1>${escapeHtml(n.title)}</h1>` +
    `<div class="meta">` +
      resourceHtml +
      `<span class="meta-right">${tagsHtml}` +
        `<span class="badge" style="background:${n.color}">${escapeHtml(n.type)}</span>` +
      `</span>` +
    `</div>` + summaryHtml;
  const bodyHtml = document.createElement('div');
  bodyHtml.className = 'prose';
  bodyHtml.innerHTML = marked.parse(n.body);
  doc.appendChild(bodyHtml);
  wireDocLinks(bodyHtml);
  doc.scrollTop = 0;
  setActiveNav(id);
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  highlight(id);
  focusOn(id);
}

function openIndex() {
  // The bundle-root index.md is the landing page: catalog in the reader, whole graph.
  main.classList.remove('graph-only');
  const body = document.createElement('div');
  body.className = 'prose';
  body.innerHTML = DATA.index ? marked.parse(DATA.index) : '';
  doc.innerHTML = '';
  doc.appendChild(body);
  wireDocLinks(body);
  doc.scrollTop = 0;
  setActiveNav('index');
  clearHighlight();
  history.replaceState(null, '', '#index');
  relayout();
}

function openEdgeLink(edgeId) {
  // Open the edge's source concept and scroll to / flash the specific link in
  // its markdown that produced this edge.
  const sep = edgeId.indexOf('->');
  const source = edgeId.slice(0, sep), target = edgeId.slice(sep + 2);
  openConcept(source);
  const link = doc.querySelector(`a[href="#node:${target}"]`);
  if (link) {
    link.scrollIntoView({ behavior: 'smooth', block: 'center' });
    link.classList.add('flash');
    setTimeout(() => link.classList.remove('flash'), 1600);
  }
}

function openLog() {
  if (!DATA.log) return;
  main.classList.remove('graph-only');
  renderDoc(DATA.log);
  setActiveNav('log');
  clearHighlight();
  history.replaceState(null, '', '#log');
  relayout();
}

function showGraphOnly() {
  main.classList.add('graph-only');
  setActiveNav(null);
  clearHighlight();
  history.replaceState(null, '', location.pathname);
  relayout();
}

/* ---------- sidebar tree ---------- */
function buildTree(nodes) {
  const root = { dirs: {}, files: [] };
  nodes.forEach(n => {
    const parts = n.id.split('/');
    let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
      cur = cur.dirs[parts[i]];
    }
    cur.files.push(n);
  });
  return root;
}

function renderTree(tree) {
  const ul = document.createElement('ul');
  // Concept pages first, then subdirectories (so a directory's own overview sits
  // above its children).
  tree.files.sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(n.id);
    a.dataset.id = n.id;
    a.innerHTML = `<span class="dot" style="background:${n.color}"></span><span>${escapeHtml(n.title)}</span>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(n.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
  Object.keys(tree.dirs).sort().forEach(name => {
    const li = document.createElement('li');
    li.className = 'dir';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name.replace(/[-_]/g, ' ');
    li.appendChild(label);
    li.appendChild(renderTree(tree.dirs[name]));
    ul.appendChild(li);
  });
  return ul;
}

function setActiveNav(id) {
  document.querySelectorAll('#nav a, #loglink a').forEach(a => a.classList.remove('active'));
  if (id === 'log') { const l = document.querySelector('#loglink a'); l && l.classList.add('active'); return; }
  if (id === 'index') { const h = document.querySelector('#nav a.homelink'); h && h.classList.add('active'); return; }
  if (!id) return;
  const a = document.querySelector(`#nav a[data-id="${cssEscape(id)}"]`);
  a && a.classList.add('active');
}

const nav = document.getElementById('nav');
if (DATA.index) {
  const home = document.createElement('a');
  home.href = '#index';
  home.className = 'homelink';
  home.innerHTML = '🏠 <span>Index</span>';
  home.addEventListener('click', ev => { ev.preventDefault(); openIndex(); });
  nav.appendChild(home);
}
nav.appendChild(renderTree(buildTree(DATA.nodes)));
if (DATA.log) {
  const link = document.createElement('a');
  link.href = '#log';
  link.innerHTML = '📓 <span>Change log</span>';
  link.addEventListener('click', ev => { ev.preventDefault(); openLog(); });
  document.getElementById('loglink').appendChild(link);
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  DATA.nodes.forEach(n => {
    const hay = (n.title + ' ' + n.description + ' ' + n.type + ' ' + n.tags.join(' ')).toLowerCase();
    const hit = !q || hay.includes(q);
    const navA = document.querySelector(`#nav a[data-id="${cssEscape(n.id)}"]`);
    navA && navA.classList.toggle('hidden', !hit);
    if (main.classList.contains('graph-only')) cy.getElementById(n.id).toggleClass('faded', !!q && !hit);
  });
});

/* ---------- legend ---------- */
function buildLegend() {
  const legend = document.getElementById('legend');
  const title = document.createElement('span');
  title.className = 'legend-title';
  title.textContent = 'Types';
  legend.appendChild(title);
  DATA.types.forEach(t => {
    const item = document.createElement('button');
    item.className = 'legend-item';
    item.dataset.type = t.name;
    item.innerHTML = `<span class="sw" style="background:${t.color}"></span>${escapeHtml(t.name)}`;
    item.addEventListener('click', () => {
      if (activeType === t.name) clearHighlight(); else highlightType(t.name);
    });
    legend.appendChild(item);
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&'); }

/* ---------- initial state ---------- */
runLayout();
buildLegend();
clearHighlight();
const start = decodeURIComponent(location.hash.slice(1));
if (start === 'log') openLog();
else if (byId[start]) openConcept(start);
else if (DATA.index) openIndex();
else showGraphOnly();
</script>
</body>
