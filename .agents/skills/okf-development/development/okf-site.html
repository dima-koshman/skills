<style>
  :root {

  .layout { display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:14px; align-items:center; padding:9px 16px; border-bottom:1px solid var(--line); background:var(--sidebar); flex:0 0 auto; }

  #search { margin-left:auto; flex:0 0 260px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13px; }
  .below { flex:1 1 auto; display:flex; min-height:0; }

  aside { flex:0 0 264px; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--sidebar); min-height:0; }

const DATA = {"title": "development", "nodes": [{"id": "communication/grpc.md", "title": "gRPC", "type": "Standard", "description": "RPC framework using Protocol Buffers as its IDL to generate client and server stubs \u2014 a service-to-service alternative to REST.", "tags": [], "resource": "https://grpc.io", "body": "gRPC is a remote procedure call framework that uses\n[Protocol Buffers](#node:communication/protobuf.md) as its interface definition\nlanguage: a `.proto` file declares both the payload messages *and* the service \u2014\nits methods, their request types, and their response types. From that single\ndefinition, codegen produces a client **stub** and a server skeleton, so calling\na remote service is a typed method call in the caller's language and implementing\none is filling in an interface. The contract is compiler-checked on both sides,\nwhich is the substantive difference from REST, where the contract lives in\ndocumentation or an OpenAPI file that nothing forces the code to match.\n\nFour call shapes fall out of the streaming model, all over HTTP/2:\n\n| Type | Shape |\n| --- | --- |\n| Unary | One request, one response \u2014 the ordinary function call |\n| Server streaming | One request, a stream of responses |\n| Client streaming | A stream of requests, one response |\n| Bidirectional streaming | Independent streams both ways, read and written in any order |\n\nBidirectional streaming is the capability with no clean REST equivalent, and\nit is often the reason a service ends up on gRPC at all.\n\nThe framework also standardizes the operational concerns that REST leaves to each\nteam to reinvent. **Deadlines** are first-class \u2014 a client specifies how long it\nwill wait, the deadline propagates, and expiry surfaces as `DEADLINE_EXCEEDED`\nrather than a hung connection. **Cancellation** lets either side end an RPC\nimmediately. **Channels** represent the connection to a server and carry\nconfiguration such as compression. **Metadata** is the key-value sidecar for\ncall context like auth tokens. **Status codes** are a fixed enum, so failure\nhandling is uniform across every service instead of per-endpoint HTTP semantics.\n\n# Trade-offs against REST\n\ngRPC is optimized for service-to-service traffic and pays for it at the edges.\nBrowsers cannot speak it natively \u2014 that requires grpc-web plus a proxy \u2014 so\npublic and browser-facing APIs usually stay REST. The binary framing that makes\nit efficient also makes it opaque to `curl`, generic log tooling, and casual\ninspection. And the schema must be distributed to every consumer, which is a\nbuild-and-release concern, not just a coding one.\n\nIts shape aligns well with a [service mesh](#node:infrastructure/service-mesh.md):\nbecause gRPC keeps long-lived HTTP/2 connections and multiplexes calls over them,\nnaive connection-level load balancing distributes badly, and request-level\nbalancing in the mesh's [data plane](#node:infrastructure/planes.md) is the standard\nfix. Istio load-balances gRPC as a first-class protocol for this reason.\n\n# Resources\n\n- [gRPC core concepts](https://grpc.io/docs/what-is-grpc/core-concepts/)\n- [Introduction to gRPC](https://grpc.io/docs/what-is-grpc/introduction/)\n- [Status codes and their use](https://grpc.io/docs/guides/status-codes/)", "color": "#ea7317"}, {"id": "communication/protobuf.md", "title": "Protocol Buffers", "type": "Standard", "description": "Language-neutral binary serialization for small structured records \u2014 schema-first `.proto` definitions compiled into native bindings.", "tags": [], "resource": "https://protobuf.dev", "body": "Protocol Buffers (\"protobuf\") are Google's mechanism for serializing structured\ndata across languages and platforms \u2014 in the project's own framing, \"like JSON,\nexcept it's smaller and faster, and it generates native language bindings.\" The\nschema is the artifact: you declare messages in a `.proto` file, and the `protoc`\ncompiler emits accessors, serializers, and parsers for each target language at\nbuild time. That generated code is what application code touches, so the schema\nis enforced by the compiler rather than by convention or runtime validation.\n\nThe design property that matters most in practice is **schema evolution through\nfield numbers**. Each field carries a permanently assigned number that is written\non the wire instead of its name, and that number must never be reused. This buys\ncompatibility in both directions: old code reads new messages by ignoring\nunrecognized fields, and new code reads old messages by applying defaults for\nabsent ones. Producers and consumers can therefore be deployed independently \u2014\nthe property that makes protobuf viable as a service contract rather than merely\na wire encoding, and the foundation [gRPC](#node:communication/grpc.md) builds on.\n\nThe same field-number encoding is why messages are **not self-describing**: a\npayload cannot be interpreted without its `.proto`. This is the central trade\nagainst JSON. You gain compactness and parse speed and lose the ability to\ninspect traffic with generic tooling \u2014 which pushes schema distribution (a\nregistry, a shared repo, or a build dependency) from a nicety to a requirement,\nand makes debugging harder at exactly the boundaries a\n[service mesh](#node:infrastructure/service-mesh.md) is watching.\n\nLanguage support is direct from `protoc` for C++, C#, Java, Kotlin, Objective-C,\nPHP, Python, and Ruby; Go and Dart come via plugins, and other languages exist as\nthird-party implementations. Beyond the long-standing proto2 and proto3 syntaxes,\nthe project is moving to **editions** (2023, 2024), which replace the\nsyntax-version split with per-feature settings so behavior can evolve without a\nnew syntax generation.\n\n# When not to use it\n\nThe project documents its own limits, and they are worth respecting rather than\ndiscovering: messages larger than a few megabytes, large multi-dimensional\nfloating-point arrays, non-object-oriented scientific languages, already\ncompressed data, and any context requiring a formal standards body. Add one\noperational caveat from the spec \u2014 the same message can have many valid binary\nencodings, so serialized bytes must never be compared, hashed, or signed as a\nproxy for message equality.\n\n# Resources\n\n- [Protocol Buffers overview](https://protobuf.dev/overview/)\n- [Language guide (editions)](https://protobuf.dev/programming-guides/editions/)\n- [Encoding \u2014 the wire format](https://protobuf.dev/programming-guides/encoding/)", "color": "#ea7317"}, {"id": "development.md", "title": "Development", "type": "Overview", "description": "Personal knowledge base for general software development and distributed-systems concepts.", "tags": [], "resource": "", "body": "Concepts behind building and operating distributed systems, kept separate from\nthe model-specific material in the `okf-ai-engineering` bundle. Written for a\nsenior practitioner: design framing, trade-offs, and vetted primary sources \u2014\nnot tutorials.\n\n# Map\n\n- **Communication** \u2014 how services define contracts and talk to each other:\n  [Protocol Buffers](#node:communication/protobuf.md) for the wire format and schema,\n  [gRPC](#node:communication/grpc.md) for the RPC layer built on it.\n- **Infrastructure** \u2014 the layer around the services: the\n  [service mesh](#node:infrastructure/service-mesh.md), and the\n  [data, control, and management planes](#node:infrastructure/planes.md) that\n  describe how such systems are decomposed.", "color": "#3b82f6"}, {"id": "infrastructure/planes.md", "title": "Data, Control & Management Planes", "type": "Technique", "description": "The decomposition of a distributed system into traffic-carrying, policy-distributing, and operator-facing layers.", "tags": [], "resource": "", "body": "\"Plane\" is the vocabulary for separating a system by *what kind of work* a\ncomponent does, independent of how it is deployed. The split originates in\nnetworking and generalizes cleanly to any system with a policy layer over a\ntraffic layer.\n\n| Plane | Responsibility | Question it answers |\n| --- | --- | --- |\n| **Data** | Carries application/user traffic, applying rules it was given | \"Where does this packet/request go, right now?\" |\n| **Control** | Decides configuration and policy and distributes it to the data plane | \"What should the rules be?\" |\n| **Management** | Interfaces for operators to configure, inspect, administer, and monitor | \"How do humans express and observe intent?\" |\n\nTraditional networking names all three: policy is devised at the management\nplane, passed to the control plane for enforcement, and executed at the data\nplane. SDN made the boundary architectural rather than incidental by centralizing\nthe control plane into controllers that program forwarding tables, leaving\ndevices to forward packets against those tables. Many systems collapse management\ninto control and speak only of two planes; the distinction is worth keeping when\nthe operator-facing surface \u2014 API, CLI, console, audit \u2014 has its own availability\nand access-control requirements, which in regulated environments it does.\n\nConcrete instances make the pattern easy to recognize:\n\n- **[Istio](#node:infrastructure/service-mesh.md)** \u2014 Envoy sidecars (or `ztunnel`)\n  are the data plane; `istiod` is the control plane.\n- **Kubernetes** \u2014 the API server, scheduler, and controller manager form the\n  control plane; `kubelet` and `kube-proxy` on each node do the data-plane work.\n  `kubectl` and the API surface are effectively the management plane.\n\n# Why the boundary is load-bearing\n\nThe separation is a **blast-radius** decision, not a diagram. A well-built data\nplane keeps forwarding traffic on its last known configuration when the control\nplane is unavailable \u2014 *failing static* rather than failing closed. Get this\nright and a control-plane outage degrades your ability to make changes; get it\nwrong and it takes down serving. This is the single most consequential property\nto verify in any system described in these terms, and it is routinely assumed\nrather than tested.\n\nTwo corollaries follow. The planes have genuinely different **scaling profiles**:\nthe data plane scales with traffic, the control plane with the rate of\nconfiguration change \u2014 so they belong on separate resource budgets and separate\nSLOs. And they present different **security surfaces**: the data plane sees\nuser data, while the control and management planes hold the authority to\nredirect it, which usually makes them the higher-value target.\n\n# Resources\n\n- [Control plane vs. data plane \u2014 IBM](https://www.ibm.com/think/topics/control-plane-vs-data-plane)\n- [Kubernetes cluster architecture](https://kubernetes.io/docs/concepts/architecture/)\n- [Control planes are more than signalling \u2014 Systems Approach](https://systemsapproach.substack.com/p/control-planes-are-more-than-signalling)", "color": "#16a34a"}, {"id": "infrastructure/service-mesh.md", "title": "Service Mesh", "type": "Technique", "description": "A dedicated infrastructure layer handling service-to-service routing, security, reliability, and observability outside application code.", "tags": [], "resource": "", "body": "A service mesh is a distributed infrastructure layer that takes over the concerns\nevery service-to-service call shares \u2014 routing, security, reliability, traffic\npolicy, and observability \u2014 and moves them out of the application. The problems\nare real whether or not you adopt a mesh; the question a mesh answers is *where\nthey live*. Without one, each service imports a library that does retries,\ntimeouts, mTLS, circuit breaking, and trace propagation, which means every\nlanguage in the fleet needs its own implementation and every policy change is a\nredeploy of everything. A mesh relocates that logic into proxies alongside the\nworkloads, so it is configured once and applies uniformly, including to services\nwhose source you do not control.\n\nArchitecturally a mesh is the textbook\n[data-plane/control-plane split](#node:infrastructure/planes.md): proxies carry the\nactual request traffic, and a controller compiles operator intent into proxy\nconfiguration and pushes it out.\n\n# Istio\n\n[Istio](https://istio.io) is the reference implementation and the clearest way to\nsee the shape. It \"layers transparently onto existing distributed applications\" \u2014\ntransparently being the operative claim, since application code is unchanged.\n\n- **Data plane** \u2014 in **sidecar mode**, an Envoy proxy runs in each pod and\n  intercepts all of its traffic, giving full L7 control. In **ambient mode**, a\n  per-node L4 proxy (`ztunnel`) handles identity and encryption, with optional\n  per-namespace L7 proxies (*waypoints*) added only where richer policy is\n  needed \u2014 materially less overhead when most workloads only need mTLS.\n- **Control plane** \u2014 `istiod` watches the services and dynamically programs\n  proxy behavior as rules and the environment change.\n\nWhat that buys: automatic load balancing for HTTP, [gRPC](#node:communication/grpc.md),\nWebSocket, and TCP, with fine-grained routing, retries, failover, and fault\ninjection; mutual TLS with identity-based authentication and authorization\nbetween services; and automatic metrics, logs, and traces for all traffic\nincluding cluster ingress and egress. The observability property is the one teams\nmost often underrate \u2014 it arrives without instrumenting a single service.\n\n# Cost\n\nA mesh is not free and is frequently adopted too early. Every call gains a proxy\nhop and its latency; the control plane is another distributed system to operate,\nupgrade, and debug; and failures acquire a new and unfamiliar layer to\ninvestigate. The sidecar-versus-ambient choice is largely a bet on that cost \u2014\ncomprehensive features against lighter per-node overhead. A mesh earns its place\nat the point where the number of services, languages, or compliance requirements\nmakes per-service libraries the more expensive option.\n\n# Resources\n\n- [What is Istio?](https://istio.io/latest/docs/overview/what-is-istio/)\n- [Istio ambient mode](https://istio.io/latest/docs/ambient/overview/)\n- [Envoy proxy](https://www.envoyproxy.io/)\n- [Linkerd](https://linkerd.io/) \u2014 a deliberately smaller alternative", "color": "#16a34a"}], "edges": [{"source": "communication/grpc.md", "target": "communication/protobuf.md"}, {"source": "communication/grpc.md", "target": "infrastructure/service-mesh.md"}, {"source": "communication/grpc.md", "target": "infrastructure/planes.md"}, {"source": "communication/protobuf.md", "target": "communication/grpc.md"}, {"source": "communication/protobuf.md", "target": "infrastructure/service-mesh.md"}, {"source": "development.md", "target": "communication/protobuf.md"}, {"source": "development.md", "target": "communication/grpc.md"}, {"source": "development.md", "target": "infrastructure/service-mesh.md"}, {"source": "development.md", "target": "infrastructure/planes.md"}, {"source": "infrastructure/planes.md", "target": "infrastructure/service-mesh.md"}, {"source": "infrastructure/service-mesh.md", "target": "infrastructure/planes.md"}, {"source": "infrastructure/service-mesh.md", "target": "communication/grpc.md"}], "types": [{"name": "Overview", "color": "#3b82f6"}, {"name": "Standard", "color": "#ea7317"}, {"name": "Technique", "color": "#16a34a"}], "log": "# Directory Update Log\n\n## 2026-08-16\n\n* **Initialization**: Created the development concept bundle \u2014 a vendor-neutral knowledge graph for general software-development and distributed-systems concepts, split out from `okf-ai-engineering` so the AI-specific material stays focused. Structured as `communication/` (service contracts and transport) and `infrastructure/` (the layer around services), with a root [Development](#node:development.md) map concept.\n* **Creation**: Added [Protocol Buffers](#node:communication/protobuf.md) \u2014 schema-first binary serialization, with field numbers as the evolution contract and the non-self-describing trade-off against JSON that makes schema distribution mandatory.\n* **Creation**: Added [gRPC](#node:communication/grpc.md) \u2014 protobuf-as-IDL RPC with generated stubs, the four streaming shapes, and the operational primitives (deadlines, cancellation, channels, metadata, status codes) it standardizes; records the edge-facing trade-offs against REST and why HTTP/2 multiplexing pushes load balancing into the mesh data plane.\n* **Creation**: Added [Service Mesh](#node:infrastructure/service-mesh.md) \u2014 the case for relocating cross-cutting call concerns out of per-service libraries, Istio's sidecar and ambient data planes with `istiod` as control plane, and the cost that makes early adoption a common mistake.\n* **Creation**: Added [Data, Control & Management Planes](#node:infrastructure/planes.md) \u2014 the three-plane decomposition and its SDN origin, worked through Istio and Kubernetes, with the load-bearing consequence recorded: a correct data plane fails *static* on its last known config when the control plane is down.\n", "index": "* [Development](#node:development.md) `[Overview]` - Personal knowledge base for general software development and distributed-systems concepts.\n\n# communication\n\n* [gRPC](#node:communication/grpc.md) `[Standard]` - RPC framework using Protocol Buffers as its IDL to generate client and server stubs \u2014 a service-to-service alternative to REST.\n* [Protocol Buffers](#node:communication/protobuf.md) `[Standard]` - Language-neutral binary serialization for small structured records \u2014 schema-first `.proto` definitions compiled into native bindings.\n\n# infrastructure\n\n* [Data, Control & Management Planes](#node:infrastructure/planes.md) `[Technique]` - The decomposition of a distributed system into traffic-carrying, policy-distributing, and operator-facing layers.\n* [Service Mesh](#node:infrastructure/service-mesh.md) `[Technique]` - A dedicated infrastructure layer handling service-to-service routing, security, reliability, and observability outside application code."};

const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [
    ...DATA.nodes.map(n => ({ data: { id: n.id, label: n.title, color: n.color } })),
    ...DATA.edges.map(e => ({ data: { id: e.source + '->' + e.target, source: e.source, target: e.target } })),
  ],
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'label': 'data(label)', 'color': '#1f2328',
        'font-size': '8px', 'text-wrap': 'wrap', 'text-max-width': '80px',
        'text-valign': 'bottom', 'text-margin-y': 3, 'width': 15, 'height': 15,
        'border-width': 1.5, 'border-color': '#ffffff' } },
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#c8d1da', 'target-arrow-color': '#c8d1da',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .7 } },
    { selector: 'node.sel', style: { 'border-color': '#0969da', 'border-width': 3, 'font-size': '10px', 'font-weight': 'bold', 'width': 20, 'height': 20 } },
    { selector: '.faded', style: { 'opacity': .12 } },
    { selector: 'node.hidden', style: { 'display': 'none' } },
  ],
  wheelSensitivity: 0.2,
});

function graphLayout() {
  return { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true,
           idealEdgeLength: 150, nodeRepulsion: 22000, nodeOverlap: 60,
           gravity: 0.2, componentSpacing: 160, numIter: 1500, padding: 40 };
}

// Run the force layout, then a deterministic pass that pushes any still-
// overlapping nodes apart using their label-inclusive bounding boxes, so labels
// never sit on top of each other regardless of the force layout's result.
function runLayout() {
  const layout = cy.layout(graphLayout());
  layout.one('layoutstop', () => requestAnimationFrame(() => separateOverlaps()));
  layout.run();
}

function separateOverlaps(iterations = 80, pad = 10) {
  const nodes = cy.nodes();
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ba = a.boundingBox({ includeLabels: true });
        const bb = b.boundingBox({ includeLabels: true });
        const overlapX = Math.min(ba.x2, bb.x2) - Math.max(ba.x1, bb.x1) + pad;
        const overlapY = Math.min(ba.y2, bb.y2) - Math.max(ba.y1, bb.y1) + pad;
        if (overlapX > 0 && overlapY > 0) {
          let dx = (ba.x1 + ba.x2) / 2 - (bb.x1 + bb.x2) / 2;
          let dy = (ba.y1 + ba.y2) / 2 - (bb.y1 + bb.y2) / 2;
          const dist = Math.hypot(dx, dy) || 0.01;
          const push = Math.min(overlapX, overlapY) / 2;
          dx /= dist; dy /= dist;
          a.position({ x: a.position('x') + dx * push, y: a.position('y') + dy * push });
          b.position({ x: b.position('x') - dx * push, y: b.position('y') - dy * push });
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  cy.fit(undefined, 30);
}

cy.on('tap', 'node', ev => {
  // Clicking the already-selected node toggles the selection off.
  if (ev.target.hasClass('sel')) clearHighlight(); else openConcept(ev.target.id());
});
cy.on('tap', 'edge', ev => openEdgeLink(ev.target.id()));           // open the source doc at the link that made this edge
cy.on('tap', ev => { if (ev.target === cy) clearHighlight(); });    // click empty space = deselect node, keep the doc open
document.getElementById('graph').addEventListener('dblclick', () => {  // double-click anywhere = reset zoom to fit all
  cy.animate({ fit: { eles: cy.elements(), padding: 30 } }, { duration: 300 });
});

let activeType = null;

// Reflect the active type (if any) onto the legend chips and the nav tree.
function paintTypeState() {
  document.querySelectorAll('#legend .legend-item').forEach(el =>
    el.classList.toggle('active', el.dataset.type === activeType));
  document.querySelectorAll('#nav a[data-id]').forEach(a =>
    a.classList.toggle('typematch', !!activeType && byId[a.dataset.id].type === activeType));
}

function highlight(id) {
  const node = cy.getElementById(id);
  activeType = null;
  cy.elements().addClass('faded');
  cy.nodes().removeClass('sel');
  const near = node.closedNeighborhood();
  near.removeClass('faded');
  node.addClass('sel');
  paintTypeState();
  caption.textContent = node.data('label') + ' — ' + node.connectedEdges().length + ' links';
}

// Highlight every concept of one type across the graph and the nav tree.
function highlightType(type) {
  activeType = type;
  cy.nodes().removeClass('sel');
  cy.elements().addClass('faded');
  const matching = cy.nodes().filter(n => byId[n.id()].type === type);
  matching.removeClass('faded');
  paintTypeState();
  caption.textContent = type + ' — ' + matching.length + ' concepts';
}

function clearHighlight() {
  activeType = null;
  cy.elements().removeClass('faded');
  cy.nodes().removeClass('sel');
  paintTypeState();
  caption.textContent = cy.nodes().length + ' concepts · ' + cy.edges().length + ' links';
}

function relayout() {
  // Only resize/refit on view changes — never re-run the force layout, which
  // would reshuffle node positions and make the graph jump on every click.
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

function focusOn(id) {
  // Zoom and recenter to the selected node plus its immediate links, instead of
  // refitting the entire graph.
  const node = cy.getElementById(id);
  requestAnimationFrame(() => {
    cy.resize();
    if (node.nonempty()) cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 60 } }, { duration: 300 });
    else cy.fit(undefined, 30);
  });
}

/* ---------- reader ---------- */
// Wire a rendered markdown container: in-bundle links navigate the graph,
// external links open in a new tab.
function wireDocLinks(container) {
  container.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  container.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
}

function renderDoc(markdown) {
  doc.innerHTML = marked.parse(markdown);
  wireDocLinks(doc);
  doc.scrollTop = 0;
}

function openConcept(id) {
  const n = byId[id];
  if (!n) return;
  closeMobilePanels();
  main.classList.remove('graph-only');
  const resourceHtml = n.resource
    ? `<span class="resource">🔗 <a href="${escapeAttr(n.resource)}" title="${escapeAttr(n.resource)}" target="_blank" rel="noopener">${escapeHtml(n.resource)}</a></span>` : '';
  const tagsHtml = (n.tags && n.tags.length)
    ? `<span class="tags-inline">${n.tags.map(t => `<code>${escapeHtml(t)}</code>`).join('')}</span>` : '';
  const summaryHtml = n.description ? `<p class="summary">${escapeHtml(n.description)}</p>` : '';
  doc.innerHTML =
    `<h1>${escapeHtml(n.title)}</h1>` +
    `<div class="meta">` +
      resourceHtml +
      `<span class="meta-right">${tagsHtml}` +
        `<span class="badge" style="background:${n.color}">${escapeHtml(n.type)}</span>` +
      `</span>` +
    `</div>` + summaryHtml;
  const bodyHtml = document.createElement('div');
  bodyHtml.className = 'prose';
  bodyHtml.innerHTML = marked.parse(n.body);
  doc.appendChild(bodyHtml);
  wireDocLinks(bodyHtml);
  doc.scrollTop = 0;
  setActiveNav(id);
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  highlight(id);
  focusOn(id);
}

function openIndex() {
  // The bundle-root index.md is the landing page: catalog in the reader, whole graph.
  closeMobilePanels();
  main.classList.remove('graph-only');
  const body = document.createElement('div');
  body.className = 'prose';
  body.innerHTML = DATA.index ? marked.parse(DATA.index) : '';
  doc.innerHTML = '';
  doc.appendChild(body);
  wireDocLinks(body);
  doc.scrollTop = 0;
  setActiveNav('index');
  clearHighlight();
  history.replaceState(null, '', '#index');
  relayout();
}

function openEdgeLink(edgeId) {
  // Open the edge's source concept and scroll to / flash the specific link in
  // its markdown that produced this edge.
  const sep = edgeId.indexOf('->');
  const source = edgeId.slice(0, sep), target = edgeId.slice(sep + 2);
  openConcept(source);
  const link = doc.querySelector(`a[href="#node:${target}"]`);
  if (link) {
    link.scrollIntoView({ behavior: 'smooth', block: 'center' });
    link.classList.add('flash');
    setTimeout(() => link.classList.remove('flash'), 1600);
  }
}

function openLog() {
  if (!DATA.log) return;
  closeMobilePanels();
  main.classList.remove('graph-only');
  renderDoc(DATA.log);
  setActiveNav('log');
  clearHighlight();
  history.replaceState(null, '', '#log');
  relayout();
}

function showGraphOnly() {
  main.classList.add('graph-only');
  setActiveNav(null);
  clearHighlight();
  history.replaceState(null, '', location.pathname);
  relayout();
}

/* ---------- sidebar tree ---------- */
function buildTree(nodes) {
  const root = { dirs: {}, files: [] };
  nodes.forEach(n => {
    const parts = n.id.split('/');
    let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
      cur = cur.dirs[parts[i]];
    }
    cur.files.push(n);
  });
  return root;
}

function renderTree(tree) {
  const ul = document.createElement('ul');
  // Concept pages first, then subdirectories (so a directory's own overview sits
  // above its children).
  tree.files.sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(n.id);
    a.dataset.id = n.id;
    a.innerHTML = `<span class="dot" style="background:${n.color}"></span><span>${escapeHtml(n.title)}</span>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(n.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
  Object.keys(tree.dirs).sort().forEach(name => {
    const li = document.createElement('li');
    li.className = 'dir';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name.replace(/[-_]/g, ' ');
    li.appendChild(label);
    li.appendChild(renderTree(tree.dirs[name]));
    ul.appendChild(li);
  });
  return ul;
}

function setActiveNav(id) {
  document.querySelectorAll('#nav a, #loglink a').forEach(a => a.classList.remove('active'));
  if (id === 'log') { const l = document.querySelector('#loglink a'); l && l.classList.add('active'); return; }
  if (id === 'index') { const h = document.querySelector('#nav a.homelink'); h && h.classList.add('active'); return; }
  if (!id) return;
  const a = document.querySelector(`#nav a[data-id="${cssEscape(id)}"]`);
  a && a.classList.add('active');
}

const nav = document.getElementById('nav');
if (DATA.index) {
  const home = document.createElement('a');
  home.href = '#index';
  home.className = 'homelink';
  home.innerHTML = '🏠 <span>Index</span>';
  home.addEventListener('click', ev => { ev.preventDefault(); openIndex(); });
  nav.appendChild(home);
}
nav.appendChild(renderTree(buildTree(DATA.nodes)));
if (DATA.log) {
  const link = document.createElement('a');
  link.href = '#log';
  link.innerHTML = '📓 <span>Change log</span>';
  link.addEventListener('click', ev => { ev.preventDefault(); openLog(); });
  document.getElementById('loglink').appendChild(link);
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', ev => {
  if (window.matchMedia('(max-width: 860px)').matches) {
    closeMobilePanels();
    document.body.classList.add('nav-open');
    navToggle.setAttribute('aria-expanded', 'true');
  }
  const q = ev.target.value.trim().toLowerCase();
  DATA.nodes.forEach(n => {
    const hay = (n.title + ' ' + n.description + ' ' + n.type + ' ' + n.tags.join(' ')).toLowerCase();
    const hit = !q || hay.includes(q);
    const navA = document.querySelector(`#nav a[data-id="${cssEscape(n.id)}"]`);
    navA && navA.classList.toggle('hidden', !hit);
    if (main.classList.contains('graph-only')) cy.getElementById(n.id).toggleClass('faded', !!q && !hit);
  });
});

/* ---------- legend ---------- */
function buildLegend() {
  const legend = document.getElementById('legend');
  const title = document.createElement('span');
  title.className = 'legend-title';
  title.textContent = 'Types';
  legend.appendChild(title);
  DATA.types.forEach(t => {
    const item = document.createElement('button');
    item.className = 'legend-item';
    item.dataset.type = t.name;
    item.innerHTML = `<span class="sw" style="background:${t.color}"></span>${escapeHtml(t.name)}`;
    item.addEventListener('click', () => {
      if (activeType === t.name) clearHighlight(); else highlightType(t.name);
    });
    legend.appendChild(item);
  });
}

/* ---------- helpers ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&'); }

/* ---------- initial state ---------- */
runLayout();
buildLegend();
clearHighlight();
const start = decodeURIComponent(location.hash.slice(1));
if (start === 'log') openLog();
else if (byId[start]) openConcept(start);
else if (DATA.index) openIndex();
else showGraphOnly();
</script>
</body>
</html>
