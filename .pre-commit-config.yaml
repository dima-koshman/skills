repos:
  - repo: local
    hooks:
      # Model-backed: review and commit generated changes before retrying a push.
      # Scope this to knowledge inputs so unrelated pushes do not spend tokens.
      - id: openwiki-update
        name: OpenWiki - update knowledge
        entry: openwiki --update --print
        language: system
        pass_filenames: false
        files: ^(wiki/|openwiki/INSTRUCTIONS\.md$|\.openwikiignore$)
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.38.2
    hooks:
      - id: basedpyright

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(\.claude/|\.agents/skills/)

  # Runs the same offline suite CI runs, at push time (not on every commit, to keep commits
  # fast) so a red push is caught locally before it blocks the auto-deploy on main.
  - repo: local
    hooks:
      - id: pytest-offline
        name: pytest (offline suite)
        entry: uv run pytest --ignore=tests/integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
