const DATA = {"title": "ai-engineering", "home": "README.md", "nodes": [{"id": "README.md", "title": "AI Engineering Knowledge Base", "type": "Overview", "description": "A vendor-neutral concept graph for building enterprise AI platforms \u2014 gateway, agents, security, and lifecycle.", "tags": ["overview", "enterprise", "ai-engineering"], "resource": "", "body": "A curated, vendor-neutral knowledge graph of the concepts behind building\nenterprise-grade AI services \u2014 an AI platform, an MCP gateway, and a PII masker.\nThe notes are written for a practitioner: senior-level framing, key design\nconsiderations, and vetted sources \u2014 not beginner explainers, not vendor\ntutorials, not model training.\n\n## Map\n\n- **Context** \u2014 the protocols the platform is built on:\n  [MCP](#node:context/mcp.md) and the [Open Knowledge Format](#node:context/okf.md).\n- **Enterprise** \u2014 the control plane: the [LLM Gateway](#node:enterprise/llm-gateway.md)\n  and the [MCP Gateway](#node:enterprise/mcp-gateway.md).\n- **Agents** \u2014 [Agent Architecture](#node:agents/agent-architecture.md),\n  [deepagents](#node:agents/deepagents.md), the [Agent Harness](#node:agents/harness.md),\n  and [Programmatic Tools & Code Mode](#node:agents/programmatic-tools.md).\n- **Observability** \u2014 [tracing](#node:observability/observability.md) with\n  [LangSmith](#node:observability/langsmith.md) and [Langfuse](#node:observability/langfuse.md).\n- **Evaluation** \u2014 [evals & LLM-as-judge](#node:evaluation/evals.md),\n  operationalized via [LangSmith Evals](#node:evaluation/langsmith-evals.md).\n- **Security** \u2014 the [OWASP Agentic Top 10](#node:security/threats/asi01-agent-goal-hijack.md)\n  threats, and the controls that contain them:\n  [Guardrails](#node:security/controls/guardrails.md) and [PII Masking](#node:security/controls/pii-masking.md).\n\n## How to use\n\nExplore the graph on the right or the tree on the left; each concept links to\nits neighbors and to the anchoring project work\n([Bir MCP](https://gitlab.com/koshmandk/bir_mcp),\n[agents](https://github.com/dima-koshman/agents)). Change history lives in the log.", "color": "#7c3aed"}, {"id": "agents/agent-architecture.md", "title": "Agent Architecture", "type": "Architecture Pattern", "description": "The loop, planning, subagents, tools, and memory that turn an LLM into a task-completing agent.", "tags": ["agents", "architecture", "deepagents", "platform"], "resource": "", "body": "An agent is an LLM in a loop with tools, working memory, and a stopping\ncondition. Beyond the toy loop, production agents add **planning** (explicit\ntask decomposition), **subagents** (isolated context for delegated work),\n**durable state/memory**, and **human-in-the-loop** checkpoints. deepagents\npackages these patterns vendor-neutrally on top of LangGraph.\n\n## In an enterprise platform\n\nThis is the shape of both your work platform and your personal\n[agents](https://github.com/dima-koshman/agents) project. The engineering\nsubstance is not the model call \u2014 it is context management, tool orchestration,\nand controlling the loop. Get the architecture right and the choice of model\nbecomes swappable.\n\n## Design considerations\n\n- **Context engineering over prompt cleverness** \u2014 what enters the window each\n  turn (tool results, memory, retrieved knowledge such as an\n  [OKF](#node:context/okf.md) bundle) determines behavior more than\n  the system prompt.\n- **Subagents for isolation** \u2014 spin up fresh context for a bounded task; return\n  only the conclusion. Prevents context rot on long runs.\n- **Durable execution** \u2014 checkpoint state (deepagents/LangGraph on Postgres) so\n  long tasks survive restarts and support resume/approval.\n- **Tools via [MCP](#node:context/mcp.md)** \u2014 get capabilities from the gateway, not\n  hardcoded, so the agent and the platform evolve independently.\n- **Every step is untrusted** \u2014 tool results can carry\n  [prompt injection](#node:security/threats/asi01-agent-goal-hijack.md); wrap the loop in\n  [guardrails](#node:security/controls/guardrails.md) and trace it with\n  [observability](#node:observability/observability.md).\n\n# Citations\n\n[1] [deepagents overview \u2014 LangChain](https://docs.langchain.com/oss/python/deepagents/overview)\n[2] [Cognition blog](https://cognition.com/blog)\n[3] [LangChain blog](https://www.langchain.com/blog)\n[4] [The Agentic Operating Model \u2014 LangChain](https://www.langchain.com/resources/the-agentic-operating-model)", "color": "#3b82f6"}, {"id": "agents/deepagents.md", "title": "deepagents", "type": "Framework", "description": "LangChain library packaging planning, subagents, memory, and human-in-the-loop on LangGraph.", "tags": ["agents", "deepagents", "langgraph", "framework"], "resource": "https://docs.langchain.com/oss/python/deepagents/overview", "body": "deepagents is the LangChain library that packages production agent patterns \u2014 planning, subagents, durable memory, HITL \u2014 on top of LangGraph; the base for the personal agent project.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Agent Architecture](#node:agents/agent-architecture.md)\n- [Agent Harness](#node:agents/harness.md)\n- [Programmatic Tools & Code Mode](#node:agents/programmatic-tools.md)\n\n# Citations\n\n[1] [deepagents](https://docs.langchain.com/oss/python/deepagents/overview)", "color": "#16a34a"}, {"id": "agents/harness.md", "title": "Agent Harness", "type": "Architecture Pattern", "description": "The runtime scaffolding around the model loop: tool dispatch, state, sandboxing, and loop control.", "tags": ["agents", "harness", "runtime", "architecture"], "resource": "", "body": "The harness is everything around the model call that makes an agent run \u2014 tool dispatch, state and memory, sandboxing, retries, and stop conditions.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Agent Architecture](#node:agents/agent-architecture.md)\n- [deepagents](#node:agents/deepagents.md)\n- [Programmatic Tools & Code Mode](#node:agents/programmatic-tools.md)\n\n# Citations\n\n[1] [OWASP Top 10 for Agentic Applications 2026](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#3b82f6"}, {"id": "agents/programmatic-tools.md", "title": "Programmatic Tools & Code Mode", "type": "Technique", "description": "Letting agents write and run code \u2014 interpreters, dynamic workflows \u2014 instead of only fixed tool calls.", "tags": ["agents", "code-mode", "tools", "technique"], "resource": "", "body": "Programmatic tools (code mode) give an agent a code interpreter and dynamic workflows rather than a fixed tool list \u2014 more expressive, and a direct code-execution risk.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Agent Harness](#node:agents/harness.md)\n- [Agent Architecture](#node:agents/agent-architecture.md)\n- [Unexpected Code Execution](#node:security/threats/asi05-unexpected-code-execution.md)\n\n# Citations\n\n[1] [OWASP Top 10 for Agentic Applications 2026](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#9333ea"}, {"id": "context/mcp.md", "title": "Model Context Protocol (MCP)", "type": "Protocol", "description": "Open protocol standardizing how LLM apps expose and consume tools, resources, and prompts.", "tags": ["mcp", "protocol", "platform", "integration"], "resource": "https://modelcontextprotocol.io", "body": "MCP is a JSON-RPC-based protocol (over stdio or HTTP/SSE) that standardizes the\nboundary between an LLM client and external capabilities: **tools** (callable\nfunctions), **resources** (readable context), and **prompts** (templates). It\nturns the N\u00d7M integration problem \u2014 every model against every system \u2014 into N+M.\n\n## In an enterprise platform\n\nMCP is the integration substrate for an enterprise AI platform. Standardizing on\nit means any compliant client (Claude Desktop, Cursor, custom agents) reaches\ninternal systems through one contract, and new backends are added by composition\nrather than bespoke glue. The gateway is where the protocol's neutrality meets\nenterprise reality \u2014 auth, permissions, secrets, audit \u2014 see\n[LLM gateway](#node:enterprise/llm-gateway.md).\n\n## Design considerations\n\n- **Transport** \u2014 stdio for local/desktop, streamable HTTP for multi-tenant\n  services. HTTP is what a gateway needs.\n- **Auth is underspecified for enterprise** \u2014 MCP's OAuth story assumes Dynamic\n  Client Registration many enterprise IdPs lack; an OIDC-proxy pattern bridges\n  the gap (as in [Bir MCP](https://gitlab.com/koshmandk/bir_mcp)).\n- **Tool surface = attack surface** \u2014 exposed tools are a\n  [prompt-injection](#node:security/threats/asi01-agent-goal-hijack.md) vector; gate them with\n  per-user permissions and [guardrails](#node:security/controls/guardrails.md).\n- **Framework** \u2014 FastMCP over the raw SDK for middleware, composition, and DX.\n\n## Related\n\nConsumed by [agent architectures](#node:agents/agent-architecture.md); secured and\nmultiplexed by an [LLM gateway](#node:enterprise/llm-gateway.md); distinct from\n[OKF](#node:context/okf.md), which is static knowledge rather than live\ntools.\n\n# Citations\n\n[1] [MCP specification](https://modelcontextprotocol.io)\n[2] [FastMCP](https://gofastmcp.com)\n[3] [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)", "color": "#ca8a04"}, {"id": "context/okf.md", "title": "Open Knowledge Format (OKF)", "type": "Knowledge Format", "description": "Google's vendor-neutral markdown-plus-frontmatter standard for agent-readable knowledge.", "tags": ["knowledge", "standards", "agents"], "resource": "https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md", "body": "OKF represents knowledge \u2014 the metadata and curated context around data and\nsystems \u2014 as a directory of markdown files with YAML frontmatter. One concept\nper file; the file path is the concept's identity. No schema registry, no\ncentral authority, no required tooling. This very bundle is an OKF bundle.\n\n## In an enterprise platform\n\nFor an enterprise AI platform, the hard part of \"give the agent context\" is\ngovernance, not storage: knowledge must be diffable, reviewable, portable across\ntools, and free of vendor lock-in. OKF is deliberately the *lowest-common-\ndenominator* format \u2014 plain markdown in git \u2014 which is exactly what makes it\nsurvive tool churn and cross-org exchange. It is the knowledge substrate an\nagent reads; it is not itself a capability or a runtime.\n\n## Design considerations\n\n- **`type` is the only required field.** Everything else (title, description,\n  resource, tags, timestamp) is recommended-but-optional; consumers must degrade\n  gracefully. Permissive consumption is a feature, not a gap.\n- **Links are untyped** \u2014 a link asserts a relationship; the *kind* lives in\n  surrounding prose. Good for a knowledge graph, not a substitute for a schema.\n- **`index.md` is a build artifact** \u2014 generate it from frontmatter, never hand-\n  edit. This bundle is indexed by the `okf` skill's `okf_index.py`.\n- **Snapshot vs. mirror** \u2014 a young draft (v0.1) will move; pin the version and\n  reconcile deliberately rather than tracking a live upstream.\n\n## Relationship\n\nOKF is *knowledge* (declarative facts), distinct from an agent **skill**\n(procedural capability) and from [MCP](#node:context/mcp.md) (a transport for tools\nand resources). An agent could consume an OKF bundle as its knowledge base while\na skill provides the procedure to traverse it and MCP exposes the live tools.\n\n# Citations\n\n[1] [OKF specification](https://github.com/GoogleCloudPlatform/knowledge-catalog/blob/main/okf/SPEC.md)\n[2] [How the Open Knowledge Format can improve data sharing \u2014 Google Cloud](https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing)", "color": "#dc2626"}, {"id": "enterprise/llm-gateway.md", "title": "LLM Gateway", "type": "Architecture Pattern", "description": "A control plane sitting between AI clients and models/tools for auth, routing, policy, and observability.", "tags": ["platform", "gateway", "security", "enterprise"], "resource": "", "body": "An LLM gateway is the enterprise control plane between AI clients and the\nmodels/tools they use. It centralizes cross-cutting concerns \u2014 authentication,\nauthorization, secret injection, rate limiting, routing/failover, content\npolicy, and audit \u2014 so that individual apps and agents stay thin. In an\nMCP-centric platform the same layer multiplexes many\n[MCP](#node:context/mcp.md) subservers behind one authenticated endpoint.\n\n## In an enterprise platform\n\nThis is the load-bearing component of the enterprise triad (platform + gateway +\nmasker). It is where vendor-neutrality is actually enforced: clients depend on\nthe gateway's contract, not on any one model or backend. It is also the natural\nhome for every control that must apply *uniformly* \u2014 you do not want each agent\nre-implementing auth or PII handling.\n\n## Design considerations\n\n- **Middleware pipeline** \u2014 model cross-cutting concerns as a composable,\n  ordered pipeline (rate-limit \u2192 authz \u2192 secret-inject \u2192\n  [anonymize](#node:security/controls/pii-masking.md) \u2192 [moderate](#node:security/controls/guardrails.md) \u2192\n  log). Order matters: mask before logging, authorize before injecting secrets.\n- **Auth bridging** \u2014 OIDC proxy / token exchange to connect enterprise SSO to\n  clients lacking DCR.\n- **Per-user, per-tool permissions** \u2014 a graded model (disabled/read/write/\n  destroy) beats a binary allow/deny for real IT-ops use.\n- **Egress > ingress for data risk** \u2014 tool *outputs* are the leak channel;\n  anonymization and moderation belong on the response path.\n- **Observability is first-class** \u2014 the gateway is the one place to get\n  complete [traces](#node:observability/observability.md) across every agent and tool.\n\n## Reference implementation\n\n[Bir MCP](https://gitlab.com/koshmandk/bir_mcp) \u2014 an enterprise MCP gateway with\nOAuth/OIDC, Vault/Consul-backed secrets, a composable middleware pipeline,\nPresidio anonymization, and LangSmith tracing.\n\n# Citations\n\n[1] [The Agentic Operating Model \u2014 LangChain](https://www.langchain.com/resources/the-agentic-operating-model)\n[2] [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)\n[3] [Anthropic Engineering blog](https://www.anthropic.com/engineering)", "color": "#3b82f6"}, {"id": "enterprise/mcp-gateway.md", "title": "MCP Gateway", "type": "Architecture Pattern", "description": "An enterprise gateway multiplexing MCP servers behind auth, permissions, secrets, and audit.", "tags": ["enterprise", "mcp", "gateway", "platform"], "resource": "https://gitlab.com/koshmandk/bir_mcp", "body": "An MCP gateway is the enterprise control point in front of many MCP servers \u2014 one authenticated endpoint applying permissions, secret injection, anonymization, and audit (see Bir MCP).\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [MCP](#node:context/mcp.md)\n- [LLM Gateway](#node:enterprise/llm-gateway.md)\n- [Guardrails](#node:security/controls/guardrails.md)\n- [PII Masking & Anonymization](#node:security/controls/pii-masking.md)\n- [Agent Identity & Privilege Abuse](#node:security/threats/asi03-identity-privilege-abuse.md)\n\n# Citations\n\n[1] [MCP Gateway](https://gitlab.com/koshmandk/bir_mcp)", "color": "#3b82f6"}, {"id": "evaluation/evals.md", "title": "Evals & LLM-as-Judge", "type": "Practice", "description": "Systematic measurement of LLM/agent quality offline and online, often using model-graded scoring.", "tags": ["evals", "quality", "llm-as-judge", "testing"], "resource": "", "body": "Evals are the systematic measurement of LLM/agent output quality: curated\ndatasets, scoring functions, and regression gates. Because outputs are open-\nended, scoring often uses **LLM-as-judge** \u2014 a model grading another model's\noutput against a rubric \u2014 alongside deterministic checks (exact match, schema,\ntool-call correctness). Evals are to AI systems what tests are to software.\n\n## In an enterprise platform\n\nWithout evals, every prompt or model change is a guess and every regression is\nfound in production. For a platform team, evals are the gate that lets you\nupgrade models, refactor [agents](#node:agents/agent-architecture.md), or tune\n[guardrails](#node:security/controls/guardrails.md) with confidence rather than fear.\n\n## Design considerations\n\n- **Deterministic first, judge second** \u2014 cheap exact/schema/tool checks catch\n  most regressions; reserve LLM-as-judge for open-ended quality where it earns\n  its cost and noise.\n- **Judge the judge** \u2014 calibrate the grader against human labels; an\n  unvalidated judge manufactures false confidence.\n- **Offline + online** \u2014 a static regression suite for CI *and* sampled scoring\n  of live traffic; production behavior drifts from your test set.\n- **Traces are your dataset** \u2014 mine [observability](#node:observability/observability.md)\n  for real failures and hard cases instead of inventing synthetic ones.\n- **Same judge, two jobs** \u2014 the model-based scorer doubles as a production\n  [guardrail](#node:security/controls/guardrails.md); build it once.\n- **Domain evals** \u2014 score [PII detection](#node:security/controls/pii-masking.md) and\n  [injection](#node:security/threats/asi01-agent-goal-hijack.md) resistance explicitly, not just\n  \"helpfulness.\"\n\n# Citations\n\n[1] [LangSmith](https://www.langchain.com/langsmith)\n[2] [LangChain blog](https://www.langchain.com/blog)", "color": "#0891b2"}, {"id": "evaluation/langsmith-evals.md", "title": "LangSmith Evals", "type": "Tool", "description": "Dataset and evaluator tooling in LangSmith for offline and online agent evaluation.", "tags": ["evaluation", "evals", "langsmith", "tool"], "resource": "https://docs.smith.langchain.com", "body": "LangSmith's evaluation tooling runs datasets, LLM-as-judge and custom evaluators, and experiments over traces \u2014 the operational side of evals in this stack.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Evals & LLM-as-Judge](#node:evaluation/evals.md)\n- [LangSmith](#node:observability/langsmith.md)\n- [AI Observability & Tracing](#node:observability/observability.md)\n\n# Citations\n\n[1] [LangSmith Evals](https://docs.smith.langchain.com)", "color": "#64748b"}, {"id": "observability/langfuse.md", "title": "Langfuse", "type": "Tool", "description": "Open-source LLM observability and tracing, OpenTelemetry-friendly.", "tags": ["observability", "tracing", "langfuse", "open-source", "tool"], "resource": "https://langfuse.com", "body": "Langfuse is an open-source LLM observability platform \u2014 self-hostable tracing, metrics, and evals, a vendor-neutral alternative on the same OTel backbone.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [AI Observability & Tracing](#node:observability/observability.md)\n- [LangSmith](#node:observability/langsmith.md)\n\n# Citations\n\n[1] [Langfuse](https://langfuse.com)", "color": "#64748b"}, {"id": "observability/langsmith.md", "title": "LangSmith", "type": "Tool", "description": "LangChain's tracing and evaluation platform for LLM/agent observability.", "tags": ["observability", "tracing", "langsmith", "tool"], "resource": "https://www.langchain.com/langsmith", "body": "LangSmith is LangChain's managed platform for tracing, monitoring, and evaluating LLM apps and agents \u2014 the observability backend used across this work.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [AI Observability & Tracing](#node:observability/observability.md)\n- [Langfuse](#node:observability/langfuse.md)\n- [LangSmith Evals](#node:evaluation/langsmith-evals.md)\n\n# Citations\n\n[1] [LangSmith](https://www.langchain.com/langsmith)", "color": "#64748b"}, {"id": "observability/observability.md", "title": "AI Observability & Tracing", "type": "Practice", "description": "Capturing traces, spans, and metrics of LLM/agent execution to debug, evaluate, and monitor in production.", "tags": ["observability", "tracing", "opentelemetry", "langsmith"], "resource": "", "body": "AI observability is the practice of instrumenting LLM and\n[agent](#node:agents/agent-architecture.md) runs so every prompt, tool call,\nretrieval, and decision is captured as a **trace** of nested **spans**, with\ntoken/cost/latency metrics attached. It is the difference between \"the agent did\nsomething weird\" and a reproducible timeline of exactly what it saw and did.\n\n## In an enterprise platform\n\nAgents are non-deterministic and multi-step; without tracing they are\nundebuggable. In an enterprise [gateway](#node:enterprise/llm-gateway.md), the trace is\nalso the **audit record** and the raw material for\n[evals](#node:evaluation/evals.md) and [guardrail](#node:security/controls/guardrails.md) tuning \u2014\none instrumentation layer serves debugging, compliance, and quality.\n\n## Design considerations\n\n- **Trace the whole agent, not just the model call** \u2014 tool I/O, retrieval, and\n  control-flow branches are where bugs live.\n- **OTel as the neutral backbone** \u2014 emit OpenTelemetry so you can send to\n  LangSmith, Logfire, or any backend without re-instrumenting; avoids\n  vendor lock-in the way the platform does elsewhere.\n- **Correlate by thread/session** \u2014 link spans across turns to follow a\n  conversation, not just a request.\n- **Mask before you trace** \u2014 traces capture raw I/O; apply\n  [PII masking](#node:security/controls/pii-masking.md) on the path into telemetry.\n- **Close the loop** \u2014 production traces become eval datasets and injection\n  forensics; treat observability as input to quality, not just monitoring.\n\n# Citations\n\n[1] [LangSmith](https://www.langchain.com/langsmith)\n[2] [OpenTelemetry](https://opentelemetry.io)\n[3] [Anthropic Engineering blog](https://www.anthropic.com/engineering)", "color": "#0891b2"}, {"id": "security/controls/guardrails.md", "title": "Guardrails", "type": "Control", "description": "Input/output controls that constrain LLM behavior to a safe, policy-compliant envelope.", "tags": ["security", "control", "policy", "moderation"], "resource": "", "body": "Guardrails are the deterministic and model-based controls wrapped around an LLM\ncall to keep behavior inside a safe envelope: input filters (jailbreak/\n[injection](#node:security/threats/asi01-agent-goal-hijack.md) detection, topic limits), output\nfilters (moderation, PII checks, schema/format validation), and action gates\n(approval required before destructive tool calls). They are policy enforcement,\ndistinct from the model's own alignment.\n\n## In an enterprise platform\n\nIn an enterprise [gateway](#node:enterprise/llm-gateway.md), guardrails are where\ncompliance becomes executable \u2014 the uniform layer that every agent inherits\nrather than re-implementing. They convert \"the model should not\u2026\" into \"the\nplatform will not let it.\"\n\n## Design considerations\n\n- **Layer the checks** \u2014 cheap deterministic validators (regex, schema, all/deny\n  lists) first; expensive model-based judges only where needed.\n- **Output path is the priority** \u2014 most real damage (leaks, unsafe content) is\n  on egress; validate before the response leaves the boundary.\n- **Fail closed for high-risk actions** \u2014 ambiguous \u2192 block or route to a human,\n  don't pass through.\n- **Guardrails \u2260 evals, but share machinery** \u2014 the same judge that gates\n  production traffic can score offline [evals](#node:evaluation/evals.md); reuse it.\n- **Measure the guardrails themselves** \u2014 false-positive/negative rates matter;\n  a guardrail nobody can tune becomes a guardrail everyone disables.\n\n## Related\n\nMitigate [prompt injection](#node:security/threats/asi01-agent-goal-hijack.md); complement\n[PII masking](#node:security/controls/pii-masking.md) on the output path; observable via\n[tracing](#node:observability/observability.md).\n\n# Citations\n\n[1] [OWASP GenAI / LLM Top 10](https://genai.owasp.org)\n[2] [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)", "color": "#ea7317"}, {"id": "security/controls/pii-masking.md", "title": "PII Masking & Anonymization", "type": "Control", "description": "Detecting and redacting or tokenizing personal data in LLM inputs/outputs, reversibly where needed.", "tags": ["security", "control", "privacy", "pii"], "resource": "", "body": "PII masking is the detection and transformation of personal data flowing through\nan AI system \u2014 redaction, pseudonymization, or reversible tokenization \u2014 so that\nsensitive fields never reach a model, a log, or a third party in the clear. In a\nbank, this is a hard regulatory boundary, not a nice-to-have.\n\n## In an enterprise platform\n\nThe masker is the third pillar of the enterprise triad and a key\n[guardrail](#node:security/controls/guardrails.md) on the [gateway](#node:enterprise/llm-gateway.md)\noutput path. It is also a [prompt-injection](#node:security/threats/asi01-agent-goal-hijack.md)\ncontainment control: even if an agent is hijacked, masked egress limits what can\nactually leak.\n\n## Design considerations\n\n- **Detection quality is the ceiling** \u2014 recognizer coverage (NER + patterns +\n  context) bounds everything downstream; Presidio locally, or an API detector,\n  with domain-specific recognizers for local identifiers.\n- **Reversible vs. irreversible** \u2014 redaction for logs/telemetry; reversible\n  tokenization when the workflow must restore the original (e.g. round-tripping\n  a ticket). Store the mapping in a vault, never inline.\n- **Placement** \u2014 anonymize *before* logging/tracing and *before* egress; inject\n  real secrets only inside the trusted boundary, after masking is applied to\n  outputs.\n- **Locale matters** \u2014 names, IDs, and formats are region-specific\n  (Azerbaijan/Turkic naming, local doc numbers); generic English models\n  under-detect. Tune and evaluate on real local data.\n- **Measure it** \u2014 treat detection as a scored task with precision/recall\n  [evals](#node:evaluation/evals.md); a silent miss is a breach.\n\n# Citations\n\n[1] [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)\n[2] [Bir MCP \u2014 anonymization middleware (Presidio/Dataiku)](https://gitlab.com/koshmandk/bir_mcp)", "color": "#ea7317"}, {"id": "security/threats/asi01-agent-goal-hijack.md", "title": "ASI01: Agent Goal Hijack", "type": "Threat", "description": "Adversarial input redirects the agent's plan or objective \u2014 OWASP's", "tags": ["security", "threat", "agents", "owasp", "asi01"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Agent goal hijack is when adversarial input redirects an agent's plan or\nobjective away from the developer's intent. Its primary mechanism is **prompt\ninjection** \u2014 adversarial instructions embedded in content the model reads (a web\npage, a document, a tool result, an email). **Indirect** injection (via data the\nagent retrieves rather than the user's own message) is the dangerous variant for\nautonomous agents. There is no known complete fix; it is a systemic property of\nmodels that follow natural-language instructions.\n\n## In an enterprise platform\n\nFor an [agent](#node:agents/agent-architecture.md) with real tools behind an\n[MCP gateway](#node:enterprise/mcp-gateway.md), a successful hijack turns the agent\ninto a confused deputy: it wields the *user's* permissions against the user.\nData exfiltration and unauthorized tool calls are the concrete outcomes. The more\ncapable the tool surface, the higher the blast radius.\n\n## Design considerations\n\n- **Assume every tool result is hostile** \u2014 treat retrieved content as data, not\n  instructions; never let it silently escalate.\n- **Least privilege is the real control** \u2014 scope tool permissions per user and\n  per action (disabled/read/write/destroy) so an injection can't reach\n  destructive tools.\n- **Constrain egress** \u2014 the payoff for most injections is exfiltration; gate and\n  [anonymize](#node:security/controls/pii-masking.md) outbound data.\n- **Defense in depth, not a silver bullet** \u2014 combine\n  [guardrails](#node:security/controls/guardrails.md), human approval for high-risk actions,\n  and full [tracing](#node:observability/observability.md) to detect and forensically\n  analyze attempts.\n- **Zero-trust framing** \u2014 every agent action is authenticated, authorized, and\n  logged as if the agent were a potentially-compromised insider.\n\n# Citations\n\n[1] [OWASP GenAI / LLM Top 10](https://genai.owasp.org)\n[2] [State of Agentic AI Security and Governance v2.01 \u2014 OWASP](https://genai.owasp.org/resource/state-of-agentic-ai-security-and-governance/)\n[3] [Zero Trust for AI agents \u2014 Anthropic](https://claude.com/blog/zero-trust-for-ai-agents)", "color": "#db2777"}, {"id": "security/threats/asi02-tool-misuse.md", "title": "ASI02: Tool Misuse & Exploitation", "type": "Threat", "description": "The agent invokes tools in ways they were not intended or authorized for.", "tags": ["security", "threat", "tools", "owasp", "asi02"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Tool misuse is when an agent is driven to call tools \u2014 or chain them \u2014 in ways outside their intended, authorized use, turning legitimate capabilities into an attack.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [MCP](#node:context/mcp.md)\n- [MCP Gateway](#node:enterprise/mcp-gateway.md)\n- [Guardrails](#node:security/controls/guardrails.md)\n- [Agent Architecture](#node:agents/agent-architecture.md)\n\n# Citations\n\n[1] [ASI02: Tool Misuse & Exploitation](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#db2777"}, {"id": "security/threats/asi03-identity-privilege-abuse.md", "title": "ASI03: Agent Identity & Privilege Abuse", "type": "Threat", "description": "The agent's identity or permissions are misused, impersonated, or escalated.", "tags": ["security", "threat", "identity", "owasp", "asi03"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Identity and privilege abuse covers impersonation, token theft, and privilege escalation \u2014 the agent acting with authority it should not have.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [MCP Gateway](#node:enterprise/mcp-gateway.md)\n- [LLM Gateway](#node:enterprise/llm-gateway.md)\n- [Rogue Agents](#node:security/threats/asi10-rogue-agents.md)\n\n# Citations\n\n[1] [ASI03: Agent Identity & Privilege Abuse](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#db2777"}, {"id": "security/threats/asi04-supply-chain-compromise.md", "title": "ASI04: Agentic Supply Chain Compromise", "type": "Threat", "description": "Malicious or compromised components \u2014 tools, MCP servers, models, dependencies \u2014 enter the agent supply chain.", "tags": ["security", "threat", "supply-chain", "owasp", "asi04"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Supply chain compromise is the poisoning of what the agent depends on: a backdoored MCP server, a tampered model, a malicious package, or a spoofed tool.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [MCP](#node:context/mcp.md)\n- [MCP Gateway](#node:enterprise/mcp-gateway.md)\n\n# Citations\n\n[1] [ASI04: Agentic Supply Chain Compromise](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#db2777"}, {"id": "security/threats/asi05-unexpected-code-execution.md", "title": "ASI05: Unexpected Code Execution", "type": "Threat", "description": "The agent executes attacker-influenced code, e.g. via a code interpreter or a tool with an RCE path.", "tags": ["security", "threat", "rce", "owasp", "asi05"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Unexpected code execution is when an agent runs attacker-controlled code \u2014 a growing risk as agents gain interpreters and code-mode tools.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Programmatic Tools & Code Mode](#node:agents/programmatic-tools.md)\n- [Guardrails](#node:security/controls/guardrails.md)\n\n# Citations\n\n[1] [ASI05: Unexpected Code Execution](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#db2777"}, {"id": "security/threats/asi06-memory-context-poisoning.md", "title": "ASI06: Memory & Context Poisoning", "type": "Threat", "description": "Malicious content persists in the agent's memory or context and influences later decisions.", "tags": ["security", "threat", "memory", "owasp", "asi06"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Memory and context poisoning plants adversarial content that survives across turns \u2014 the persistent cousin of goal hijack, corrupting future reasoning.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Agent Goal Hijack](#node:security/threats/asi01-agent-goal-hijack.md)\n- [Agent Architecture](#node:agents/agent-architecture.md)\n- [Guardrails](#node:security/controls/guardrails.md)\n\n# Citations\n\n[1] [ASI06: Memory & Context Poisoning](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#db2777"}, {"id": "security/threats/asi07-insecure-inter-agent-communication.md", "title": "ASI07: Insecure Inter-Agent Communication", "type": "Threat", "description": "Trust, spoofing, or tampering weaknesses in messaging between agents.", "tags": ["security", "threat", "multi-agent", "owasp", "asi07"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "In multi-agent systems, the channels between agents become an attack surface: unauthenticated messages, spoofed peers, and tampered hand-offs.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Agent Architecture](#node:agents/agent-architecture.md)\n- [Agent Harness](#node:agents/harness.md)\n\n# Citations\n\n[1] [ASI07: Insecure Inter-Agent Communication](https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/)", "color": "#db2777"}, {"id": "security/threats/asi08-cascading-agent-failures.md", "title": "ASI08: Cascading Agent Failures", "type": "Threat", "description": "A local failure or compromise propagates across agents and tools into a systemic failure.", "tags": ["security", "threat", "reliability", "owasp", "asi08"], "resource": "https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/", "body": "Cascading failures are when one bad output, loop, or outage ripples through dependent agents and tools \u2014 a reliability failure that is also a security one.\n\n## In an enterprise platform\n\n_TODO: how this manifests in the platform / gateway / agents, and why it matters here._\n\n## Design considerations\n\n- _TODO: key decisions, mitigations, and tradeoffs._\n\n## Related\n\n- [Agent Architecture](#node:agents/agent const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const main = document.getElementById('main');
const doc = document.getElementById('doc');
const caption = document.getElementById('graph-caption');

/* ---------- graph ---------- */
const cy = cytoscape({
  container: document.getElementById('graph'),
  elements: [
    ...DATA.nodes.filter(n => n.id !== DATA.home).map(n => ({ data: { id: n.id, label: n.title, color: n.color } })),
    ...DATA.edges.filter(e => e.source !== DATA.home && e.target !== DATA.home)
        .map(e => ({ data: { id: e.source + '->' + e.target, source: e.source, target: e.target } })),
  ],
  style: [
    { selector: 'node', style: {
        'background-color': 'data(color)', 'label': 'data(label)', 'color': '#1f2328',
        'font-size': '8px', 'text-wrap': 'wrap', 'text-max-width': '80px',
        'text-valign': 'bottom', 'text-margin-y': 3, 'width': 15, 'height': 15,
        'border-width': 1.5, 'border-color': '#ffffff' } },
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#c8d1da', 'target-arrow-color': '#c8d1da',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': .7 } },
    { selector: 'node.sel', style: { 'border-color': '#0969da', 'border-width': 3, 'font-size': '10px', 'font-weight': 'bold', 'width': 20, 'height': 20 } },
    { selector: '.faded', style: { 'opacity': .12 } },
    { selector: 'node.hidden', style: { 'display': 'none' } },
  ],
  wheelSensitivity: 0.2,
});

function graphLayout() {
  return { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true,
           idealEdgeLength: 150, nodeRepulsion: 22000, nodeOverlap: 60,
           gravity: 0.2, componentSpacing: 160, numIter: 1500, padding: 40 };
}

// Run the force layout, then a deterministic pass that pushes any still-
// overlapping nodes apart using their label-inclusive bounding boxes, so labels
// never sit on top of each other regardless of the force layout's result.
function runLayout() {
  const layout = cy.layout(graphLayout());
  layout.one('layoutstop', () => requestAnimationFrame(() => separateOverlaps()));
  layout.run();
}

function separateOverlaps(iterations = 80, pad = 10) {
  const nodes = cy.nodes();
  for (let it = 0; it < iterations; it++) {
    let moved = false;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const ba = a.boundingBox({ includeLabels: true });
        const bb = b.boundingBox({ includeLabels: true });
        const overlapX = Math.min(ba.x2, bb.x2) - Math.max(ba.x1, bb.x1) + pad;
        const overlapY = Math.min(ba.y2, bb.y2) - Math.max(ba.y1, bb.y1) + pad;
        if (overlapX > 0 && overlapY > 0) {
          let dx = (ba.x1 + ba.x2) / 2 - (bb.x1 + bb.x2) / 2;
          let dy = (ba.y1 + ba.y2) / 2 - (bb.y1 + bb.y2) / 2;
          const dist = Math.hypot(dx, dy) || 0.01;
          const push = Math.min(overlapX, overlapY) / 2;
          dx /= dist; dy /= dist;
          a.position({ x: a.position('x') + dx * push, y: a.position('y') + dy * push });
          b.position({ x: b.position('x') - dx * push, y: b.position('y') - dy * push });
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
  cy.fit(undefined, 30);
}

cy.on('tap', 'node', ev => {
  // Clicking the already-selected node toggles the selection off.
  if (ev.target.hasClass('sel')) clearHighlight(); else openConcept(ev.target.id());
});
cy.on('tap', ev => { if (ev.target === cy) clearHighlight(); });  // click empty space = deselect node, keep the doc open

function highlight(id) {
  const node = cy.getElementById(id);
  cy.elements().addClass('faded');
  cy.nodes().removeClass('sel');
  const near = node.closedNeighborhood();
  near.removeClass('faded');
  node.addClass('sel');
  caption.textContent = node.data('label') + ' — ' + node.connectedEdges().length + ' links';
}

function clearHighlight() {
  cy.elements().removeClass('faded');
  cy.nodes().removeClass('sel');
  caption.textContent = cy.nodes().length + ' concepts · ' + cy.edges().length + ' links';
}

function relayout() {
  // Only resize/refit on view changes — never re-run the force layout, which
  // would reshuffle node positions and make the graph jump on every click.
  requestAnimationFrame(() => { cy.resize(); cy.fit(undefined, 30); });
}

function focusOn(id) {
  // Zoom and recenter to the selected node plus its immediate links, instead of
  // refitting the entire graph.
  const node = cy.getElementById(id);
  requestAnimationFrame(() => {
    cy.resize();
    if (node.nonempty()) cy.animate({ fit: { eles: node.closedNeighborhood(), padding: 60 } }, { duration: 300 });
    else cy.fit(undefined, 30);
  });
}

/* ---------- reader ---------- */
function renderDoc(markdown) {
  doc.innerHTML = marked.parse(markdown);
  doc.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  doc.scrollTop = 0;
}

function openConcept(id) {
  const n = byId[id];
  if (!n) return;
  main.classList.remove('graph-only');
  const header =
    `<h1>${escapeHtml(n.title)}</h1>` +
    `<div class="meta"><span class="badge" style="background:${n.color}">${escapeHtml(n.type)}</span>` +
    `<span class="path">${escapeHtml(n.id)}</span></div>` +
    (n.resource ? `<div class="resource">🔗 <a href="${escapeAttr(n.resource)}" target="_blank" rel="noopener">${escapeHtml(n.resource)}</a></div>` : '');
  const tags = (n.tags && n.tags.length)
    ? `\n\n<div class="tags">${n.tags.map(t => `<code>${escapeHtml(t)}</code>`).join(' ')}</div>` : '';
  doc.innerHTML = header;
  const bodyHtml = document.createElement('div');
  bodyHtml.innerHTML = marked.parse(n.body) + tags;
  doc.appendChild(bodyHtml);
  bodyHtml.querySelectorAll('a[href^="#node:"]').forEach(a => {
    const target = decodeURIComponent(a.getAttribute('href').slice(6));
    a.classList.add('xref');
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(target); });
  });
  bodyHtml.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  doc.scrollTop = 0;
  setActiveNav(id);
  history.replaceState(null, '', '#' + encodeURIComponent(id));
  if (id === DATA.home) { clearHighlight(); relayout(); }   // landing: show whole graph
  else { highlight(id); focusOn(id); }                       // concept: zoom to its neighborhood
}

function openLog() {
  if (!DATA.log) return;
  main.classList.remove('graph-only');
  renderDoc(DATA.log);
  setActiveNav('log');
  clearHighlight();
  history.replaceState(null, '', '#log');
  relayout();
}

function showGraphOnly() {
  main.classList.add('graph-only');
  setActiveNav(null);
  clearHighlight();
  history.replaceState(null, '', location.pathname);
  relayout();
}

/* ---------- sidebar tree ---------- */
function buildTree(nodes) {
  const root = { dirs: {}, files: [] };
  nodes.forEach(n => {
    const parts = n.id.split('/');
    let cur = root;
    for (let i = 0; i < parts.length - 1; i++) {
      cur.dirs[parts[i]] = cur.dirs[parts[i]] || { dirs: {}, files: [] };
      cur = cur.dirs[parts[i]];
    }
    cur.files.push(n);
  });
  return root;
}

function renderTree(tree) {
  const ul = document.createElement('ul');
  Object.keys(tree.dirs).sort().forEach(name => {
    const li = document.createElement('li');
    li.className = 'dir';
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = name.replace(/[-_]/g, ' ');
    li.appendChild(label);
    li.appendChild(renderTree(tree.dirs[name]));
    ul.appendChild(li);
  });
  tree.files.sort((a, b) => a.title.localeCompare(b.title)).forEach(n => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(n.id);
    a.dataset.id = n.id;
    a.innerHTML = `<span class="dot" style="background:${n.color}"></span><span>${escapeHtml(n.title)}</span>`;
    a.addEventListener('click', ev => { ev.preventDefault(); openConcept(n.id); });
    li.appendChild(a);
    ul.appendChild(li);
  });
  return ul;
}

function setActiveNav(id) {
  document.querySelectorAll('#nav a, #loglink a').forEach(a => a.classList.remove('active'));
  if (id === 'log') { const l = document.querySelector('#loglink a'); l && l.classList.add('active'); return; }
  if (!id) return;
  const a = document.querySelector(`#nav a[data-id="${cssEscape(id)}"]`);
  a && a.classList.add('active');
}

const nav = document.getElementById('nav');
if (DATA.home && byId[DATA.home]) {
  const home = document.createElement('a');
  home.href = '#' + encodeURIComponent(DATA.home);
  home.dataset.id = DATA.home;
  home.className = 'homelink';
  home.innerHTML = '🏠 <span>' + escapeHtml(byId[DATA.home].title) + '</span>';
  home.addEventListener('click', ev => { ev.preventDefault(); openConcept(DATA.home); });
  nav.appendChild(home);
}
nav.appendChild(renderTree(buildTree(DATA.nodes.filter(n => n.id !== DATA.home))));
if (DATA.log) {
  const link = document.createElement('a');
  link.href = '#log';
  link.innerHTML = '📓 <span>Change log</span>';
  link.addEventListener('click', ev => { ev.preventDefault(); openLog(); });
  document.getElementById('loglink').appendChild(link);
}

/* ---------- search ---------- */
document.getElementById('search').addEventListener('input', ev => {
  const q = ev.target.value.trim().toLowerCase();
  DATA.nodes.forEach(n => {
    const hay = (n.title + ' ' + n.description + ' ' + n.type + ' ' + n.tags.join(' ')).toLowerCase();
    const hit = !q || hay.includes(q);
    const navA = document.querySelector(`#nav a[data-id="${cssEscape(n.id)}"]`);
    navA && navA.classList.toggle('hidden', !hit);
    if (main.classList.contains('graph-only')) cy.getElementById(n.id).toggleClass('faded', !!q && !hit);
  });
});

/* ---------- helpers ---------- */
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
function cssEscape(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s.replace(/["\\]/g, '\\$&'); }

/* ---------- initial state ---------- */
runLayout();
clearHighlight();
const start = decodeURIComponent(location.hash.slice(1));
if (start === 'log') openLog();
else if (byId[start]) openConcept(start);
else if (DATA.home && byId[DATA.home]) openConcept(DATA.home);
else showGraphOnly();
