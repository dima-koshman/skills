[project]
    dependencies = [
        "fastmcp>=3,<4",
        "platformdirs>=4",
        "protobuf>=5",
        "pydantic>=2.0.0",
        "pyyaml>=6.0.3",
    ]
    name = "dima"
    requires-python = ">=3.11"
    version = "0.1.0"

[dependency-groups]
    dev = [
        "pytest>=8.0.0",
    ]

[tool.codespell]
    skip = "*.html"

[tool.uv]
    package = true

[tool.coverage.run]
    data_file = "runtime/.coverage"
